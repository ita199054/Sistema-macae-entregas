const db = window.db;
const auth = window.auth;

const ADMIN_EMAIL =
  "italorossi.generali@gmail.com";


/* =========================================================
   VERIFICAÇÃO DO ADMIN MASTER
   ========================================================= */

window.isAdminMaster = async function(){

  const user = auth.currentUser;

  if(!user){
    return false;
  }

  if(
    String(user.email || "")
      .toLowerCase()
      === ADMIN_EMAIL.toLowerCase()
  ){
    return true;
  }

  const snap =
    await getDoc(
      doc(db,"usuarios",user.uid)
    );

  if(!snap.exists()){
    return false;
  }

  const data = snap.data();

  return (
    data.role === "admin" &&
    data.adminMaster === true
  );

};

/* =========================================================
   RESUMO
   ========================================================= */

async function carregarResumoAdmin(){

  const snap =
    await getDocs(
      collection(db,"usuarios")
    );

  let total=0;
  let motoristas=0;
  let lojistas=0;
  let franqueados=0;
  let pendentes=0;

  snap.forEach(d=>{

    const u=d.data();

    total++;

    if(u.role==="motorista"){
      motoristas++;

      if(u.aprovado!==true){
        pendentes++;
      }
    }

    if(
      u.role==="lojista" ||
      u.role==="lojista_franquia"
    ){
      lojistas++;
    }

    if(u.role==="franqueado"){
      franqueados++;
    }

  });

  $("adminResumo").innerHTML=`

    <div class="grid">

      <div class="card">
        <h3>Usuários</h3>
        <b>${total}</b>
      </div>

      <div class="card">
        <h3>Motoristas</h3>
        <b>${motoristas}</b>
      </div>

      <div class="card">
        <h3>Lojistas</h3>
        <b>${lojistas}</b>
      </div>

      <div class="card">
        <h3>Franqueados</h3>
        <b>${franqueados}</b>
      </div>

      <div class="card">
        <h3>⏳ Pendentes</h3>
        <b>${pendentes}</b>
      </div>

    </div>

  `;

}
