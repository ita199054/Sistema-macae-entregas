<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  collection, query, where, orderBy, getDocs, getDoc, doc, updateDoc, setDoc, addDoc, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",
  authDomain: "anjos-flash.firebaseapp.com",
  projectId: "anjos-flash",
  storageBucket: "anjos-flash.firebasestorage.app",
  messagingSenderId: "725133182752",
  appId: "1:725133182752:web:5f9a98fa97269dcdcab945",
  measurementId: "G-9CSJXXNR0C"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window.db = db;
window.auth = auth;

const ADMIN_EMAIL = "italorossi.generali@gmail.com";
const $ = (id)=>document.getElementById(id);

window.isAdminMaster = async function(){
  const user = auth.currentUser;
  if(!user) return false;
  if(String(user.email||"").toLowerCase()===ADMIN_EMAIL.toLowerCase()) return true;
  const snap = await getDoc(doc(db,"usuarios",user.uid));
  if(!snap.exists()) return false;
  const data = snap.data();
  return (data.role==="admin" && data.adminMaster===true);
};

window.renderAdmin = async function(){
  const autorizado = await isAdminMaster();
  if(!autorizado){
    $("panel").innerHTML = `<div class="card"><h2>🔒 ACESSO NEGADO</h2><p>Área exclusiva <b>ADMIN MASTER</b><br>${auth.currentUser?.email||""}</p></div>`;
    return;
  }
  $("panel").innerHTML = `
    <div class="card">
      <h1>👑 ADMIN MASTER</h1><p>Controle geral <b>ANJOS EM DUAS RODAS</b></p>
      <div class="grid">
        <button class="gold" onclick="adminUsuarios()">👥 USUÁRIOS</button>
        <button class="gold" onclick="adminMotoristas()">🏍️ MOTORISTAS</button>
        <button class="gold" onclick="adminLojistas()">🏪 LOJISTAS</button>
        <button class="gold" onclick="adminFranqueados()">🏢 FRANQUEADOS</button>
        <button class="gold" onclick="adminCorridas()">🚀 CORRIDAS</button>
        <button class="gold" onclick="adminSaldos()">💰 SALDOS</button>
        <button class="gold" onclick="adminConfiguracoes()">⚙️ VALORES</button>
        <button class="gold" onclick="adminExtratos()">📊 EXTRATOS</button>
        <button class="gold" onclick="adminChat()">💬 CHAT</button>
      </div>
    </div>
    <div id="adminConteudo"><div class="card"><h2>📊 RESUMO DO SISTEMA</h2><div id="adminResumo">Carregando...</div></div></div>
  `;
  carregarResumoAdmin();
};

async function carregarResumoAdmin(){
  const snap = await getDocs(collection(db,"usuarios"));
  let total=0,motoristas=0,lojistas=0,franqueados=0,pendentes=0;
  snap.forEach(d=>{ const u=d.data(); total++; if(u.role==="motorista"){motoristas++; if(u.aprovado!==true) pendentes++;} if(u.role==="lojista"||u.role==="lojista_franquia") lojistas++; if(u.role==="franqueado") franqueados++; });
  $("adminResumo").innerHTML=`<div class="grid"><div class="card"><h3>Usuários</h3><b>${total}</b></div><div class="card"><h3>Motoristas</h3><b>${motoristas}</b></div><div class="card"><h3>Lojistas</h3><b>${lojistas}</b></div><div class="card"><h3>Franqueados</h3><b>${franqueados}</b></div><div class="card"><h3>⏳ Pendentes</h3><b>${pendentes}</b></div></div>`;
}

window.adminUsuarios = async function(){
  const snap = await getDocs(collection(db,"usuarios"));
  let html=`<div class="card"><h2>👥 TODOS OS USUÁRIOS</h2><div style="overflow:auto"><table><tr><th>Nome</th><th>Telefone</th><th>Tipo</th><th>Status</th><th>Ação</th></tr>`;
  snap.forEach(d=>{ const u=d.data(); html+=`<tr><td>${u.nome||"-"}</td><td>${u.telefone||"-"}</td><td>${u.role||"-"}</td><td>${u.aprovado?"✅":"⏳"}</td><td><button class="gold" onclick="aprovarUsuario('${d.id}')">Aprovar</button></td></tr>`; });
  html+=`</table></div></div>`; $("adminConteudo").innerHTML=html;
};

window.adminMotoristas = async function(){
  const q = query(collection(db,"usuarios"), where("role","==","motorista"));
  const snap = await getDocs(q);
  let html=`<div class="card"><h2>🏍️ MOTORISTAS</h2><table><tr><th>Nome</th><th>Código</th><th>Veículo</th><th>Status</th><th>Ação</th></tr>`;
  snap.forEach(d=>{ const u=d.data(); html+=`<tr><td>${u.nome}</td><td>${u.codigoMotorista||"-"}</td><td>${u.veiculo||"-"}</td><td>${u.aprovado?"✅":"⏳ PENDENTE"}</td><td><button class="gold" onclick="aprovarUsuario('${d.id}')">✅ APROVAR</button></td></tr>`; });
  html+=`</table></div>`; $("adminConteudo").innerHTML=html;
};

window.aprovarUsuario = async function(id){ await updateDoc(doc(db,"usuarios",id), {aprovado:true}); alert("Aprovado!"); carregarResumoAdmin(); };
window.adminLojistas = async function(){ const q=query(collection(db,"usuarios"), where("role","==","lojista")); const s=await getDocs(q); $("adminConteudo").innerHTML=`<div class="card"><h2>🏪 LOJISTAS - ${s.size}</h2></div>`; };
window.adminFranqueados = async function(){ const q=query(collection(db,"usuarios"), where("role","==","franqueado")); const s=await getDocs(q); $("adminConteudo").innerHTML=`<div class="card"><h2>🏢 FRANQUEADOS - ${s.size}</h2></div>`; };
window.adminCorridas = async function(){ const s=await getDocs(query(collection(db,"corridas"), orderBy("criadoEm","desc"))); $("adminConteudo").innerHTML=`<div class="card"><h2>🚀 CORRIDAS - ${s.size}</h2></div>`; };
window.adminSaldos = async function(){ adminUsuarios(); };
window.adminConfiguracoes = async function(){ $("adminConteudo").innerHTML=`<div class="card"><h2>⚙️ VALORES</h2><p>Edite em configuracoes/principal</p></div>`; };
window.adminExtratos = async function(){ $("adminConteudo").innerHTML=`<div class="card"><h2>📊 EXTRATOS</h2></div>`; };
window.adminChat = async function(){ $("adminConteudo").innerHTML=`<div class="card"><h2>💬 CHAT</h2></div>`; };

onAuthStateChanged(auth, (user)=>{
  if(!user) location.href="index.html";
  else renderAdmin();
});
</script>
