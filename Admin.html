<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><style>body{background:#000;color:#fff;font-family:Arial;padding:12px} .card{background:#111;border:1px solid #D4AF37;padding:12px;border-radius:12px;margin-bottom:12px} button{padding:10px;border:none;border-radius:8px;font-weight:900;margin:4px} .g{background:#D4AF37;color:#000} .gr{background:#0f0;color:#000}</style></head><body>
<h2 style="color:#D4AF37">👑 ADMIN MASTER</h2><div id="pendentes" class="card">Carregando motoboys...</div><div id="corridas" class="card">Carregando corridas...</div>
<script>
const cfg={apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain:"anjos-flash.firebaseapp.com",projectId:"anjos-flash",storageBucket:"anjos-flash.firebasestorage.app",messagingSenderId:"725133182752",appId:"1:725133182752:web:5f9a98fa97269dcdcab945"};firebase.initializeApp(cfg);const db=firebase.firestore();
db.collection("usuarios").where("role","==","motorista").where("aprovado","==",false).onSnapshot(ss=>{let h="<b>Pendentes:</b><br>";ss.forEach(d=>{const u=d.data();h+=`${u.email} COD ${u.codigoMotorista} <button class="gr" onclick="aprovar('${d.id}')">Aprovar</button><br>`;});document.getElementById("pendentes").innerHTML=h;});
db.collection("corridas").orderBy("criadoEm","desc").limit(20).onSnapshot(ss=>{let h="<b>Últimas Corridas:</b><br>";ss.forEach(d=>{const r=d.data();h+=`${r.id.slice(0,5)} ${r.status} R$${r.valorLojista} ${r.lojaNome}->${r.clienteEndereco}<br>`;});document.getElementById("corridas").innerHTML=h;});
async function aprovar(id){await db.collection("usuarios").doc(id).update({aprovado:true});alert("Aprovado");}
</script></body></html>
