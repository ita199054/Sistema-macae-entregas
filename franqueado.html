<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franqueado - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="config.js"></script>
<style>body{background:#0A0A0A;color:#fff;font-family:Arial;padding:15px}.card{background:#171717;border:1px solid #D4AF3733;border-radius:16px;padding:15px;margin-bottom:12px}.btn{background:#D4AF37;color:#000;font-weight:bold;padding:10px;border:none;border-radius:10px;margin:2px;cursor:pointer}.btn-green{background:#00c851;color:#fff}.input{width:100%;background:#1F1F1F;border:1px solid #D4AF3733;border-radius:10px;padding:10px;color:#fff;margin:5px 0}.gold{color:#D4AF37}</style>
</head><body>
<h2 class="gold">👑 FRANQUEADO</h2>
<div id="info" class="card">Carregando...</div>
<div class="card"><h4 class="gold">Aprovar motoboys da MINHA cidade</h4><div id="pend"></div></div>
<div class="card"><h4 class="gold">Financeiro hoje - Pix: 22997450131</h4><div id="fin">Carregando...</div></div>

<div class="card" style="border:2px solid #D4AF37"><h4 class="gold">🏪 Lojas da minha cidade - COLOCAR SALDO</h4><div id="lojas"></div></div>

<script>
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); const auth=firebase.auth();
let minhaCidade="", MEU_EMAIL="";
auth.onAuthStateChanged(async u=>{
 if(!u) return location.href='index.html';
 MEU_EMAIL=u.email.toLowerCase();
 // BUSCA POR EMAIL (igual seu index.html)
 let doc=await db.collection("usuarios").doc(MEU_EMAIL).get();
 if(!doc.exists){
   let q=await db.collection("usuarios").where("email","==",MEU_EMAIL).limit(1).get();
   if(!q.empty) doc=q.docs[0];
 }
 if(!doc.exists) return;
 let d=doc.data();
 minhaCidade=(d.cidade||"macae").toLowerCase();
 document.getElementById("info").innerHTML=`Cidade: <b class="gold">${minhaCidade.toUpperCase()}</b> | Franqueado: ${d.nome||d.email} | Email: ${MEU_EMAIL}`;
 carregarPend(); carregarFin(); carregarLojasCidade();
});
async function carregarPend(){
 const s=await db.collection("usuarios").where("cidade","==",minhaCidade).where("status","==","pendente").get();
 let h=""; s.forEach(doc=>{const u=doc.data(); h+=`<div style="border-bottom:1px solid #333;padding:8px">${u.nome||u.email} - ${u.placa||''} <button class="btn" onclick="aprovar('${doc.id}')">Aprovar</button></div>`});
 document.getElementById("pend").innerHTML=h||"Nenhum pendente";
}
async function aprovar(id){
  const counterRef=db.collection("config").doc("contadorMotoboys");
  const num=await db.runTransaction(async t=>{ const d=await t.get(counterRef); let n=1; if(d.exists) n=(d.data().ultimo||0)+1; t.set(counterRef,{ultimo:n},{merge:true}); return n; });
  const codigo=String(num).padStart(4,'0');
  await db.collection("usuarios").doc(id).update({status:"aprovado",codigoMotoboy:codigo});
  alert("Aprovado #"+codigo); carregarPend();
}
async function carregarFin(){
 db.collection("corridas").where("cidade","==",minhaCidade).onSnapshot(s=>{
  let total=0,totalMoto=0,hoje=0; let hojeStr=new Date().toDateString();
  s.forEach(d=>{
    const c=d.data();
    if(c.status=="finalizada"){
      total+= (c.valor||0);
      totalMoto+= (c.valor*0.8||0);
      let dataFinal = c.finalizadoEm? c.finalizadoEm.toDate() : new Date();
      if(dataFinal.toDateString()==hojeStr) hoje+=(c.valor||0);
    }
  });
  document.getElementById("fin").innerHTML=`Total: ${s.size} corridas | Entrou: R$${total.toFixed(2)} | Pago motoboys: R$${totalMoto.toFixed(2)} | <b style="color:#D4AF37">Lucro: R$${(total-totalMoto).toFixed(2)}</b> | Hoje: R$${hoje.toFixed(2)}<br><small>Pix: 22997450131</small>`;
 });
}
async function carregarLojasCidade(){
 const s=await db.collection("usuarios").where("tipo","==","lojista").where("cidade","==",minhaCidade).get();
 let h=""; s.forEach(doc=>{
   const x=doc.data();
   h+=`<div style="border-bottom:1px solid #222;padding:8px"><b>${x.nomeLoja||x.nome||doc.id}</b> - Saldo: <span style="color:#D4AF37">R$${(x.saldo||0).toFixed(2)}</span><br>
   <button class="btn btn-green" onclick="addSaldoLoja('${doc.id}',10)">+10 LOJA</button>
   <button class="btn btn-green" onclick="addSaldoLoja('${doc.id}',50)">+50 LOJA</button>
   <button class="btn" style="background:#ff4444;color:#fff" onclick="addSaldoLoja('${doc.id}',-10)">-10</button>
   </div>`;
 });
 document.getElementById("lojas").innerHTML=h||"Nenhuma loja nessa cidade";
}
async function addSaldoLoja(id,valor){
 await db.collection("usuarios").doc(id).update({saldo: firebase.firestore.FieldValue.increment(valor)});
 carregarLojasCidade();
}
</script></body></html>
