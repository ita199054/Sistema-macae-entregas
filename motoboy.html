<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { CONFIG_PADRAO, TIPOS_VEICULO, formatarMoeda } from "./config.js";

const firebaseConfig = { apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44", authDomain:"anjos-flash.firebaseapp.com", projectId:"anjos-flash", storageBucket:"anjos-flash.firebasestorage.app", messagingSenderId:"725133182752", appId:"1:725133182752:web:5f9a98fa97269dcdcab945", measurementId:"G-9CSJXXNR0C" };
const app=initializeApp(firebaseConfig);
const db=getFirestore(app); const auth=getAuth(app);
window.db=db; window.auth=auth;

let somLiberado=false;
window.ativarSom=function(){ document.getElementById("som").play(); somLiberado=true; }

window.ouvirCorridasMotorista=function(tipoVeiculo, meuCodigo){
  const q=query(collection(db,"corridas"), where("status","==","PROCURANDO_MOTORISTA"), where("tipoVeiculo","==",tipoVeiculo), orderBy("criadoEm","desc"));
  onSnapshot(q,snap=>{
    let html="";
    snap.forEach(d=>{
      const r=d.data();
      let destino=(r.motoboyDestino||"TODOS").toUpperCase();
      if(destino!=="TODOS" && destino!==meuCodigo.toUpperCase()) return;
      if(somLiberado) document.getElementById("som").play();
      html+=`<div class="ride"><h3>🚀 ${r.lojaNome}</h3><b>${destino}</b><br>${r.clienteEndereco}<br><b>${r.km}km</b><div class="money">${formatarMoeda(r.valorMotorista)}</div><button class="green" onclick="aceitarCorrida('${r.id}')">ACEITAR</button></div>`;
    });
    document.getElementById("corridasMotorista").innerHTML=html||"Nenhuma";
  });
};

window.aceitarCorrida=async function(corridaId){
  const uid=auth.currentUser.uid;
  await runTransaction(db, async(transaction)=>{
    const corridaRef=doc(db,"corridas",corridaId); const motoristaRef=doc(db,"usuarios",uid);
    const corridaSnap=await transaction.get(corridaRef); const motoristaSnap=await transaction.get(motoristaRef);
    const r=corridaSnap.data(); const m=motoristaSnap.data();
    if(r.status!=="PROCURANDO_MOTORISTA") throw new Error("CORRIDA_JA_ACEITA");
    if(String(m.veiculo)!==String(r.tipoVeiculo)) throw new Error("VEICULO_INCOMPATIVEL");
    transaction.update(corridaRef,{motoristaId:uid, motoristaNome:m.nome, status:"ACEITA", aceitaEm:serverTimestamp()});
    transaction.update(motoristaRef,{saldo:Number((Number(m.saldo||0)+Number(r.valorMotorista)).toFixed(2))});
    const movRef=doc(collection(db,"movimentacoes"));
    transaction.set(movRef,{usuarioId:uid, corridaId, tipo:"CREDITO", valor:r.valorMotorista, descricao:"Ganho corrida", data:serverTimestamp()});
  });
};
</script>
