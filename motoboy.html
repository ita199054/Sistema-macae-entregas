<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEBUG</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="config.js"></script></head><body style="background:#000;color:#fff;font-family:Arial;padding:15px">
<h2 style="color:#D4AF37">DEBUG - TODAS CORRIDAS</h2>
<div id="log">Conectando...</div>
<div id="lista"></div>
<script>
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const log = m => document.getElementById("log").innerHTML += "<br>" + m;

log("Firebase conectado...");
db.collection("corridas").onSnapshot(s=>{
  log("Snapshot retornou: "+s.size+" docs");
  let h="";
  s.forEach(d=>{
    let x=d.data();
    h+=`<div style="background:#222;padding:10px;margin:8px 0;border-radius:10px">ID:${d.id}<br>Loja:${x.nomeLoja}<br>Status:${x.status}<br>Destino field:${x.motoboyDestino}<br>Origem:${x.origem}<br><hr></div>`;
  });
  document.getElementById("lista").innerHTML = h || "ZERO corridas no banco - coleção corridas vazia ou Rules bloqueando";
}, err=>{
  log("ERRO: "+err.message);
});
</script></body></html>
