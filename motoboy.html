<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motoboy - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>
body{background:#0A0A0A;color:#fff;font-family:Arial;padding:12px;margin:0}
.card{background:#171717;border:1px solid #D4AF3733;border-radius:16px;padding:14px;margin-bottom:12px}
.input{background:#1F1F1F;border:1px solid #D4AF3733;border-radius:12px;padding:12px;color:#fff;width:90%;margin:6px 0}
.btn{background:#D4AF37;color:#000;font-weight:bold;padding:12px;border:none;border-radius:12px;width:100%;cursor:pointer;margin-top:8px}
.btn-green{background:#00c851;color:#fff}.btn-red{background:#ff4444;color:#fff}
.saldo{color:#D4AF37;font-weight:bold;font-size:22px}
.badge{background:#D4AF3733;color:#D4AF37;padding:5px 8px;border-radius:6px;font-size:11px;margin:2px;display:inline-block}
h1,h2{color:#D4AF37}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center">
<h1>🏍️ MOTOBOY <span id="meuCodigo" style="color:#fff;font-size:14px"></span></h1>
<button class="btn-red" style="width:auto;padding:8px 12px;border-radius:8px;border:none;font-weight:bold" onclick="firebase.auth().signOut().then(()=>location.href='index.html')">SAIR</button>
</div>

<div class="card" style="border:2px solid #D4AF37">
Saldo a receber: <span id="meuSaldo" class="saldo">R$ 0,00</span><br>
<span id="meuVeiculo" class="badge">MOTO</span> <span id="minhaCidade" style="font-size:12px;color:#aaa"></span> | <span id="meuEmail" style="font-size:10px;color:#555"></span>
</div>

<div class="card">
<h2>📦 Corridas disponíveis - com nome da loja</h2>
<p style="font-size:10px;color:#aaa">Se lojista digitou seu #0001, aparece 🎯 SÓ PRA VOCÊ. Se vazio, é pra todo mundo.</p>
<div id="corridas">Carregando...</div>
</div>

<div class="card" style="border:2px solid #00c851">
<h2>✅ Minhas corridas - digita código do cliente</h2>
<div id="minhas">Carregando...</div>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); const auth=firebase.auth();
let MEU_EMAIL="", MEU_VEICULO="moto", MEU_CODIGO="";

auth.onAuthStateChanged(async u=>{
 if(!u) return location.href="index.html";
 MEU_EMAIL=u.email.toLowerCase();
 document.getElementById("meuEmail").innerText=MEU_EMAIL;
 const doc=await db.collection("usuarios").doc(MEU_EMAIL).get();
 if(doc.exists){
  const d=doc.data();
  document.getElementById("meuSaldo").innerText="R$ "+(d.saldo||0).toFixed(2);
  MEU_VEICULO=d.veiculo||"moto";
  MEU_CODIGO=d.codigoMotoboy||"";
  document.getElementById("meuVeiculo").innerText=MEU_VEICULO.toUpperCase();
  document.getElementById("meuCodigo").innerText= d.codigoMotoboy ? "#"+d.codigoMotoboy : "";
  document.getElementById("minhaCidade").innerText=d.cidade||"";
 }
 carregar();
 // atualiza a cada 5 seg
 setInterval(carregar,5000);
});

async function carregar(){
 // PENDENTES
 const snap=await db.collection("corridas").where("status","==","pendente").orderBy("criadoEm","desc").limit(30).get();
 let html="";
 snap.forEach(doc=>{
  const x=doc.data();
  // FILTRO #0001 ESPECÍFICO: se tem destino e não é eu, não mostra
  if(x.motoboyDestino && x.motoboyDestino.toLowerCase()!=MEU_EMAIL.toLowerCase() && x.motoboyDestino!=MEU_CODIGO && x.motoboyDestino!="#"+MEU_CODIGO) return;

  const ehMeu = x.motoboyDestino ? true : false;
  const borda = ehMeu ? 'border:2px solid #D4AF37;background:#D4AF3722' : 'border:1px solid #333';

  html+=`<div class="card" style="${borda};margin-bottom:10px">
<b style="font-size:18px">${x.numero||'#0001'} - ${x.nomeLoja||'Loja'}</b> ${ehMeu?'<span style="color:#D4AF37;font-weight:bold">🎯 SÓ PRA VOCÊ</span>':''}<br>
<span style="font-size:12px;color:#aaa">📦 CAIXA / ORIGEM:</span><br>
<b style="font-size:13px">${x.enderecoLoja||x.origem}</b><br>
<span style="font-size:12px;color:#aaa">➡️ DESTINO:</span><br>
<b style="font-size:13px">${x.destino}</b><br>
<div style="margin:8px 0">
<span class="badge">🛻 ${ (x.veiculo||'moto').toUpperCase() }</span>
${x.super?'<span class="badge" style="background:#ff444433;color:#ff4444">SUPER</span>':''}
${x.retorno?'<span class="badge" style="background:#00c85133;color:#00c851">RETORNO</span>':''}
${x.dinamica?'<span class="badge" style="background:#ffaa0033;color:#ffaa00">DINÂMICA +R$'+x.valorDinamica+'</span>':''}
</div>
<span style="font-size:12px">Lojista: ${x.lojista}</span><br>
<b style="color:#D4AF37;font-size:16px">Você recebe: R$ ${(x.valor*0.8).toFixed(2)}</b> <span style="font-size:11px">(lojista paga R$${x.valor})</span><br>
<span style="font-size:10px;color:#666">Código: **** (cliente vai falar)</span><br>
<button class="btn" onclick="aceitar('${doc.id}')">✅ ACEITAR ${x.numero||''}</button>
</div>`;
 });
 document.getElementById("corridas").innerHTML=html||"<p style='color:#555'>Nenhuma corrida no momento. Se lojista digitar seu código #"+MEU_CODIGO+" só você vê.</p>";

 // MINHAS ACEITAS
 const minhas=await db.collection("corridas").where("motoboy","==",MEU_EMAIL).where("status","in",["aceita","em_andamento"]).get();
 let h2="";
 minhas.forEach(doc=>{
  const x=doc.data();
  h2+=`<div class="card" style="border:1px solid #00c851;margin-bottom:10px">
<b>${x.numero} - ${x.nomeLoja}</b><br>
<span style="font-size:12px">${x.enderecoLoja} -> ${x.destino}</span><br>
<span class="badge">${x.veiculo.toUpperCase()}</span> R$${x.valor} | Você: R$${(x.valor*0.8).toFixed(2)}<br><br>
<label style="font-size:12px;color:#D4AF37">🔐 Digita código que cliente falou:</label><br>
<div style="display:flex;gap:6px">
<input id="cod_${doc.id}" class="input" placeholder="Ex: 4821" style="width:60%" type="number">
<button class="btn btn-green" style="width:38%;margin-top:6px" onclick="finalizar('${doc.id}')">FINALIZAR</button>
</div>
<button class="btn" style="background:#333;color:#fff;font-size:12px;padding:8px" onclick="verCodigo('${doc.id}')">Ver endereço no Maps</button>
</div>`;
 });
 document.getElementById("minhas").innerHTML=h2||"Nenhuma corrida aceita";
}

async function aceitar(id){
 if(!confirm("Aceitar essa corrida?")) return;
 await db.collection("corridas").doc(id).update({status:"aceita",motoboy:MEU_EMAIL,aceitoEm:new Date()});
 carregar();
}

async function finalizar(id){
 const digitado=document.getElementById("cod_"+id).value.trim();
 if(!digitado) return alert("Digita o código que o cliente falou!");
 const c=await db.collection("corridas").doc(id).get();
 if(!c.exists) return alert("Corrida não existe mais");
 const correto=c.data().codigoEntrega;
 if(digitado!=correto){
   return alert("❌ Código errado!\nCliente tem que falar: "+correto+"\nVocê digitou: "+digitado);
 }
 await db.collection("corridas").doc(id).update({status:"finalizada",finalizadoEm:new Date(),codigoValidado:true,codigoDigitado:digitado});
 const val=c.data().valor*0.8;
 await db.collection("usuarios").doc(MEU_EMAIL).update({saldo: firebase.firestore.FieldValue.increment(val)});
 alert("✅ Entrega "+c.data().numero+" finalizada com código "+correto+"!\n+ R$"+val.toFixed(2)+" no seu saldo");
 carregar();
}

function verCodigo(id){
 // abre google maps com destino
 alert("Abre o Maps com o endereço de entrega");
}
</script>
</body>
</html>
