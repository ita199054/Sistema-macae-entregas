<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motoboy</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="config.js"></script><style>body{background:#000;color:#fff;font-family:Arial;padding:12px} .c{background:#222;padding:12px;border-radius:12px;margin:10px 0;border-left:4px solid #D4AF37}</style></head><body>
<h2 style="color:#D4AF37">🏍️ MOTOBOY #<span id="cod">0001</span> - TODAS</h2>
<div id="status">Conectando...</div>
<div id="lista">Carregando corridas...</div>
<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
document.getElementById("status").innerText="Firebase OK, buscando corridas pendentes...";

// NÃO PRECISA LOGIN PRA TESTAR DISPARO PRA TODOS
db.collection("corridas").where("status","==","pendente").onSnapshot(s=>{
  document.getElementById("status").innerText="Encontradas: "+s.size+" corridas pendentes";
  let h="";
  s.forEach(doc=>{
    let x=doc.data();
    let dest=(x.motoboyDestino||"").toString().toLowerCase();
    // LÓGICA NOVA:
    // null / "" / "todos" = MOSTRA
    // "#0001" = MOSTRA TAMBÉM (porque você é 0001)
    if(dest!=="" && dest!=="null" && dest!=="todos"){
      if(!dest.includes("0001")) return;
    }
    h+=`<div class="c">
    <b>${x.nomeLoja||x.localizacao||"LOJA"}</b> - R$ ${x.valor||0}<br>
    De: ${x.origem||"-"}<br>Para: ${x.destino||x.localizacao||"-"}<br>
    Destino: ${x.motoboyDestino} (${dest===""?"TODOS":dest})<br>
    <button onclick="aceitar('${doc.id}')" style="width:100%;padding:12px;background:#D4AF37;border:none;border-radius:8px;font-weight:900;margin-top:8px">ACEITAR</button>
    </div>`;
  });
  document.getElementById("lista").innerHTML = h || "Nenhuma corrida com status=pendente";
}, err=>{
  document.getElementById("status").innerText="ERRO: "+err.message;
});

async function aceitar(id){
  await db.collection("corridas").doc(id).update({status:"aceita",aceitaEm: new Date()});
  alert("Aceita! Status mudou pra aceita");
}
</script></body></html>
