<script type="module">

import {
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  doc,
  getDoc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db=window.db;
const auth=window.auth;

window.renderMotorista=async function(data){

  if(data.aprovado !== true){

    $("panel").innerHTML=`

      <div class="card">

        <h2>⏳ CADASTRO EM ANÁLISE</h2>

        <p>
          Seus documentos ainda precisam
          ser aprovados pelo Admin ou
          Franqueado autorizado.
        </p>

        <div class="badge">
          PENDENTE
        </div>

      </div>

    `;

    return;

  }

  $("panel").innerHTML=`

    <div class="card">

      <h2>🏍️ PAINEL MOTORISTA</h2>

      <div class="badge">
        ${TIPOS_VEICULO[data.veiculo] ||
          data.veiculo ||
          "Veículo não informado"}
      </div>

      <h3>Meu código</h3>

      <div class="money">
        ${data.codigoMotorista || "—"}
      </div>

      <h3>Meu saldo</h3>

      <div
        class="money"
        id="saldoMoto">

        ${formatarMoeda(data.saldo)}

      </div>

      <button
        id="onlineBtn"
        class="${data.online ? "green":"red"}"
        onclick="alternarOnline()">

        ${data.online ? "🟢 ONLINE":"🔴 OFFLINE"}

      </button>

    </div>

    <div class="card">

      <h2>🚀 CORRIDAS DISPONÍVEIS</h2>

      <div id="corridasMotorista">
        Carregando...
      </div>

    </div>

    <div class="card">

      <h2>📊 MEU EXTRATO</h2>

      <button
        class="gold"
        onclick="mostrarExtratoMotorista()">

        EXTRATO — ÚLTIMOS 90 DIAS

      </button>

      <button
        class="dark"
        onclick="imprimirExtratoMotorista()">

        🖨️ IMPRIMIR EXTRATO

      </button>

      <div id="extratoMotorista"></div>

    </div>

    <div class="card">

      <h2>💬 CHAT COM ADMIN</h2>

      <button
        class="gold"
        onclick="abrirChatAdmin()">

        ABRIR CHAT

      </button>

    </div>

  `;

  ouvirCorridasMotorista(data.veiculo);

};

function ouvirCorridasMotorista(tipoVeiculo){

  const q=query(
    collection(db,"corridas"),
    where(
      "status",
      "==",
      "PROCURANDO_MOTORISTA"
    ),
    where(
      "tipoVeiculo",
      "==",
      tipoVeiculo
    ),
    orderBy(
      "criadoEm",
      "desc"
    )
  );

  onSnapshot(q,snap=>{

    let html="";

    snap.forEach(d=>{

      const r=d.data();

      let ganho =
        Number(
          window.CONFIG_PADRAO.ganhoBase
        );

      if(Number(r.km)>5){

        ganho +=
          (Number(r.km)-5) *
          Number(
            window.CONFIG_PADRAO
              .adicionalMotorista
          );

      }

      if(r.opcoes?.super){

        ganho =
          Number(
            window.CONFIG_PADRAO
              .superMotorista
          );

      }

      html += `

        <div class="ride">

          <h3>🚀 NOVA CORRIDA</h3>

          <b>Tipo:</b>
          ${TIPOS_VEICULO[r.tipoVeiculo]}

          <br>

          <b>Loja:</b>
          ${r.lojaNome}

          <br>

          <b>Origem:</b>
          ${r.lojaEndereco}

          <br>

          <b>Destino:</b>
          ${r.clienteEndereco}

          <br>

          <b>Distância:</b>
          ${Number(r.km).toFixed(1)} km

          <div class="money">
            Você recebe
            ${formatarMoeda(ganho)}
          </div>

          <button
            class="green"
            onclick="aceitarCorrida('${r.id}')">

            ACEITAR

          </button>

          <button
            class="red"
            onclick="recusarCorrida('${r.id}')">

            RECUSAR

          </button>

        </div>

      `;

    });

    $("corridasMotorista").innerHTML =
      html || "Nenhuma corrida disponível.";

  });

}

window.aceitarCorrida=async function(corridaId){

  const uid=auth.currentUser.uid;

  try{

    await runTransaction(
      db,
      async(transaction)=>{

        const corridaRef =
          doc(db,"corridas",corridaId);

        const motoristaRef =
          doc(db,"usuarios",uid);

        const corridaSnap =
          await transaction.get(corridaRef);

        const motoristaSnap =
          await transaction.get(
            motoristaRef
          );

        if(!corridaSnap.exists())
          throw new Error(
            "CORRIDA_NAO_EXISTE"
          );

        const r=
          corridaSnap.data();

        const m=
          motoristaSnap.data();

        if(m.aprovado!==true)
          throw new Error(
            "MOTORISTA_NAO_APROVADO"
          );

        if(m.online!==true)
          throw new Error(
            "MOTORISTA_OFFLINE"
          );

        if(r.status !==
           "PROCURANDO_MOTORISTA"){

          throw new Error(
            "CORRIDA_JA_ACEITA"
          );

        }

        /*
          Segurança adicional:
          o tipo do veículo precisa
          ser exatamente igual.
        */

        if(
          String(m.veiculo) !==
          String(r.tipoVeiculo)
        ){

          throw new Error(
            "VEICULO_INCOMPATIVEL"
          );

        }

        let ganho =
          Number(
            window.CONFIG_PADRAO.ganhoBase
          );

        if(Number(r.km)>5){

          ganho +=
            (Number(r.km)-5) *
            Number(
              window.CONFIG_PADRAO
                .adicionalMotorista
            );

        }

        if(r.opcoes?.super){

          ganho =
            Number(
              window.CONFIG_PADRAO
                .superMotorista
            );

        }

        ganho=
          Number(ganho.toFixed(2));

        const saldoAtual =
          Number(m.saldo || 0);

        /*
          O valor do motorista
          entra no saldo dele
          somente quando ele aceita.
        */

        transaction.update(
          corridaRef,
          {

            motoristaId:uid,
            motoristaNome:m.nome,

            valorMotorista:ganho,

            status:"ACEITA",

            aceitaEm:serverTimestamp()

          }
        );

        transaction.update(
          motoristaRef,
          {

            saldo:
              Number(
                (saldoAtual+ganho)
                .toFixed(2)
              )

          }
        );

        const movRef =
          doc(
            collection(
              db,
              "movimentacoes"
            )
          );

        transaction.set(
          movRef,
          {

            usuarioId:uid,

            corridaId,

            tipo:"CREDITO",

            valor:ganho,

            descricao:
              "Ganho de corrida",

            data:
              serverTimestamp()

          }
        );

      }
    );

    toast(
      "✅ Corrida aceita e saldo creditado."
    );

  }catch(e){

    const mensagens={

      CORRIDA_JA_ACEITA:
        "Essa corrida já foi aceita.",

      VEICULO_INCOMPATIVEL:
        "Essa corrida é para outro tipo de veículo.",

      MOTORISTA_NAO_APROVADO:
        "Seu cadastro ainda não foi aprovado.",

      MOTORISTA_OFFLINE:
        "Você está OFFLINE."

    };

    toast(
      mensagens[e.message] ||
      "Não foi possível aceitar."
    );

  }

};

  const q=query(
    collection(db,"movimentacoes"),

    )

  const snap=
    await getDocs(q);

    const data=
      typeof m.data.toDate==="function"
      ?m.data.toDate()

    if(data < inicio)return;

    total +=
      Number(m.valor||0);

    linhas.push({

      data:
        formatarData(m.data),

      corrida:
        m.corridaId || "-",

      valor:
        Number(m.valor||0)

    });

  });

  return {
    linhas,
    total
  };

};
