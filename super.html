<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="config.js"></script>
<style>
body{background:#0A0A0A;color:#fff;font-family:Arial;padding:15px}
.card{background:#171717;border:1px solid #D4AF3733;border-radius:16px;padding:15px;margin-bottom:15px}
.btn{background:#D4AF37;color:#000;font-weight:bold;padding:10px 15px;border:none;border-radius:10px;margin:3px}
.input{width:100%;background:#1F1F1F;border:1px solid #D4AF3733;border-radius:10px;padding:10px;color:#fff;margin:5px 0;box-sizing:border-box}
.gold{color:#D4AF37} .item{border-bottom:1px solid #333;padding:10px 0}
</style></head><body>
<h1 class="gold">SUPER ADMIN - APROVAÇÕES</h1>

<div class="card">
<h3 class="gold">1. Motoboys pendentes por cidade</h3>
<select id="filtroCidade" class="input" onchange="carregar()"><option value="">Todas cidades</option><option value="macae">Macaé</option><option value="rio">Rio</option><option value="niteroi">Niterói</option></select>
<div id="lista"></div>
</div>

<div class="card">
<h3 class="gold">2. Mural de Avisos</h3>
<input id="avTitulo" class="input" placeholder="Título: ATENÇÃO DINÂMICA ATIVA">
<input id="avMsg" class="input" placeholder="Mensagem: Chuva forte hoje, taxa extra...">
<select id="avPara" class="input"><option value="todos">Todos</option><option value="motoboy">Só Motoboy</option><option value="lojista">Só Lojista</option></select>
<button class="btn" onclick="publicar()">PUBLICAR AVISO</button>
</div>

<div class="card">
<h3 class="gold">3. Preço por cidade (franqueado só vê a dele)</h3>
<input id="cid" class="input" placeholder="cidade ex: macae">
<input id="baseL" class="input" placeholder="Base lojista ex: 10">
<input id="baseM" class="input" placeholder="Base motoboy ex: 7.5">
<input id="superL" class="input" placeholder="Super lojista ex: 8">
<input id="retM" class="input" placeholder="Retorno motoboy ex: 2">
<button class="btn" onclick="salvarCidade()">SALVAR PREÇO CIDADE</button>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
async function carregar(){
 const cidade=filtroCidade.value;
 let q=db.collection("usuarios").where("status","==","pendente");
 if(cidade) q=q.where("cidade","==",cidade);
 const snap=await q.get();
 let h=""; snap.forEach(d=>{
  const u=d.data();
  h+=`<div class="item"><b>${u.nome}</b> - ${u.cidade} - ${u.placa}<br>
  <a class="gold" href="${u.cnhUrl}" target="_blank">Ver CNH</a> | 
  <a class="gold" href="${u.selfieUrl}" target="_blank">Selfie</a> | 
  <a class="gold" href="${u.crlvUrl}" target="_blank">CRLV</a><br>
  <button class="btn" onclick="aprovar('${d.id}')">APROVAR</button>
  <button class="btn" style="background:#ff4444" onclick="reprovar('${d.id}')">REPROVAR</button></div>`;
 });
 lista.innerHTML=h||"Nenhum pendente";
}
async function aprovar(id){ await db.collection("usuarios").doc(id).update({status:"aprovado"}); alert("Aprovado!"); carregar(); }
async function reprovar(id){ await db.collection("usuarios").doc(id).update({status:"reprovado"}); carregar(); }
async function publicar(){
 await db.collection("avisos").add({titulo:avTitulo.value,mensagem:avMsg.value,para:avPara.value,ativo:true,criadoEm:new Date()});
 alert("Aviso publicado no mural!");
}
async function salvarCidade(){
 await db.collection("config").doc("cidades").collection(cid.value.toLowerCase()).doc("precos").set({
  lojistaBase:Number(baseL.value), motoboyBase:Number(baseM.value),
  superLojista:Number(superL.value), retornoMotoboy:Number(retM.value), atualizadoEm:new Date()
 },{merge:true});
 alert("Preço salvo para "+cid.value);
}
carregar();
</script></body></html>
