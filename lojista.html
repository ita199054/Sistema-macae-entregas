<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { CONFIG_PADRAO, calcularCorrida, formatarMoeda } from "./config.js";

const firebaseConfig = { apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44", authDomain:"anjos-flash.firebaseapp.com", projectId:"anjos-flash", storageBucket:"anjos-flash.firebasestorage.app", messagingSenderId:"725133182752", appId:"1:725133182752:web:5f9a98fa97269dcdcab945", measurementId:"G-9CSJXXNR0C" };
const app=initializeApp(firebaseConfig);
const db=getFirestore(app); const auth=getAuth(app);
window.db=db; window.auth=auth;

// SUA LÓGICA DE CRIAR CORRIDA - CORRIGIDA
window.criarCorrida = async function(dados){
  const uid=auth.currentUser.uid;
  await runTransaction(db, async (transaction)=>{
    const lojistaRef=doc(db,"usuarios",uid);
    const lojistaSnap=await transaction.get(lojistaRef);
    const lojista=lojistaSnap.data();
    const calc=calcularCorrida(dados.km, dados.opcoes);
    if(Number(lojista.saldo||0) < calc.valorLojista) throw new Error("SEM_SALDO");
    
    const corridaRef=doc(collection(db,"corridas"));
    transaction.set(corridaRef, {
      id: corridaRef.id,
      lojaNome: dados.lojaNome, lojaEndereco: dados.lojaEndereco,
      clienteEndereco: dados.clienteEndereco, clienteTelefone: dados.clienteTelefone,
      km: Number(dados.km), tipoVeiculo: dados.tipoVeiculo,
      motoboyDestino: (dados.codigoMotoboy||"TODOS").toUpperCase(),
      codigoCliente: dados.codigoCliente,
      opcoes: dados.opcoes,
      valorLojista: calc.valorLojista, valorMotorista: calc.ganhoMotorista,
      status: "PROCURANDO_MOTORISTA",
      lojistaId: uid,
      criadoEm: serverTimestamp()
    });
    transaction.update(lojistaRef, { saldo: Number((Number(lojista.saldo)-calc.valorLojista).toFixed(2)) });
    const movRef=doc(collection(db,"movimentacoes"));
    transaction.set(movRef, { usuarioId:uid, corridaId:corridaRef.id, tipo:"DEBITO", valor:calc.valorLojista, descricao:"Pagamento corrida", data:serverTimestamp() });
  });
};
</script>
