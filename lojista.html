<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojista - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>body{background:#0A0A0A;color:#fff;font-family:Arial;margin:0}.top{background:#111;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #D4AF3733;position:sticky;top:0;z-index:10}.card{background:#171717;border:1px solid #FFFFFF0D;border-radius:16px;padding:16px;margin:12px auto;max-width:560px}.input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #D4AF3733;background:#1F1F1F;color:#fff;margin:6px 0;outline:none}.btn{background:#D4AF37;color:#000;font-weight:900;padding:15px;border:none;border-radius:12px;width:100%;cursor:pointer}.btn:disabled{background:#333;color:#666;cursor:not-allowed}.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900}.b-aberto{background:#FFA50022;color:#FFA500}.b-aceito{background:#25D36622;color:#25D366}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moto-box{background:#111;border:2px solid #D4AF37;border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center}.moto-box img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37}.code-big{font-size:32px;font-weight:900;color:#D4AF37;letter-spacing:3px;text-align:center;background:#111;border:2px dashed #D4AF37;border-radius:16px;padding:14px;margin:10px 0}.km-box{background:#1A1A1A;border:1px solid #D4AF37;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between}</style></head><body>
<div class="top"><div style="color:#D4AF37;font-weight:900">⚡ ANJOS FLASH LOJISTA</div><div style="text-align:right"><div style="font-size:10px;color:#888">SALDO</div><b id="saldo" style="color:#D4AF37;font-size:18px">R$ 0,00</b><div id="saldoAviso" style="font-size:10px;color:#ff4444;display:none">SEM SALDO</div></div></div>
<div style="max-width:560px;margin:0 auto;padding:8px">
<div class="card">
<h3 style="color:#D4AF37;margin:0 0 10px 0">🚀 NOVA ENTREGA</h3>
<input id="nomeLoja" class="input" placeholder="Nome da loja (fica salvo)" onblur="salvarLoja()">
<input id="coleta" class="input" placeholder="📍 Coleta (fica salvo)" onblur="salvarLoja(); calcularKM()">
<input id="entrega" class="input" placeholder="🏁 Entrega cliente" onblur="calcularKM()">

<div id="boxKM" style="display:none" class="km-box">
<div><div style="font-size:11px;color:#888">DISTÂNCIA</div><b id="kmTexto" style="color:#fff">0 km</b></div>
<div><div style="font-size:11px;color:#888">TEMPO ESTIMADO</div><b id="tempoTexto" style="color:#25D366">0 min</b></div>
<div><div style="font-size:11px;color:#888">TIPO</div><b id="tipoTexto" style="color:#D4AF37">-</b></div>
</div>

<label style="color:#D4AF37;font-size:11px">🚚 VEÍCULO *</label>
<select id="tipoVeiculo" class="input" onchange="calcPreco()"><option value="">-- ESCOLHA VEÍCULO --</option><option value="moto">🏍️ Moto até 10kg</option><option value="fiorino">🚐 Fiorino até 300kg</option><option value="caminhao">🚚 Caminhão 3/4</option><option value="carreta">🚛 Carreta</option></select>

<div style="display:flex;gap:8px;margin:8px 0">
<label style="flex:1;background:#1F1F1F;border:1px solid #333;border-radius:12px;padding:10px;display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="retorno" onchange="calcPreco()"> <span style="font-size:12px">🔄 Retorno</span></label>
<label style="flex:1;background:#1F1F1F;border:1px solid #D4AF37;border-radius:12px;padding:10px;display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="super" onchange="calcPreco()"> <span style="font-size:12px">⚡ Super +R$10</span></label>
</div>

<div class="grid2"><input id="nomeCliente" class="input" placeholder="Nome cliente"><input id="telCliente" class="input" placeholder="Zap cliente"></div>
<input id="obs" class="input" placeholder="Obs: bloco, apto">

<label style="color:#888;font-size:11px">🎯 MOTOBOY ESPECÍFICO (opcional)</label>
<input id="codigoMotoboy" class="input" placeholder="#0001 ou vazio = qualquer" style="border-color:#25D366">

<div id="boxPreco" style="background:#1F1F1F;border:1px dashed #D4AF37;border-radius:12px;padding:12px;margin:8px 0;display:none">
<div style="display:flex;justify-content:space-between"><span>Base:</span><b id="vBase">R$0</b></div>
<div id="linhaDin" style="display:flex;justify-content:space-between;color:#ffaa00;display:none"><span>Dinâmica:</span><b id="vDin">+R$0</b></div>
<div style="display:flex;justify-content:space-between"><span>KM:</span><b id="vKM">0 km</b></div>
<div style="border-top:1px solid #333;margin:8px 0"></div>
<div style="display:flex;justify-content:space-between"><span style="color:#D4AF37;font-weight:bold">VOCÊ PAGA:</span><b id="vTotal" style="color:#D4AF37;font-size:22px">R$0</b></div>
</div>

<button id="btnChamar" class="btn" onclick="pedir()">CHAMAR MOTOBOY AGORA</button>
<div id="msg" style="text-align:center;margin-top:8px;font-weight:bold;color:#888">Preencha coleta e entrega para calcular</div>

<div id="boxNumeroEntrega" style="display:none">
<div class="code-big" id="numeroEntrega">#0000</div>
<div style="text-align:center;color:#25D366;font-size:12px;font-weight:bold">✅ Pedido criado!</div>
<button class="btn" style="margin-top:10px;background:#25D366;color:#fff" onclick="enviarZap()">📲 ENVIAR Nº PARA CLIENTE NO ZAP</button>
<button class="btn" style="margin-top:8px;background:#222;color:#fff" onclick="copiarNumero()">📋 COPIAR NÚMERO</button>
</div>
</div>

<div class="card"><h3 style="color:#D4AF37">📦 Meus Pedidos</h3><div id="lista">Carregando...</div></div>
<div id="boxMoto"></div>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let meuEmail="", saldo=0, TABELA={moto:15,fiorino:35,caminhao:80,carreta:150}, DIN=0, ultimoPedido=null, ultimoClienteTel="", distanciaKM=0, tempoMin=0;

auth.onAuthStateChanged
