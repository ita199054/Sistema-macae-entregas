<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojista - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>body{background:#0A0A0A;color:#fff;font-family:Arial;padding:12px;margin:0}.card{background:#171717;border:1px solid #D4AF3733;border-radius:16px;padding:14px;margin:10px auto;max-width:450px}.input{width:92%;padding:12px;border-radius:10px;border:1px solid #333;background:#1F1F1F;color:#fff;margin:5px 0}.btn{background:#D4AF37;color:#000;font-weight:bold;padding:12px;border:none;border-radius:10px;width:100%;cursor:pointer}</style>
</head><body>
<h2 style="color:#D4AF37;text-align:center">PAINEL LOJISTA</h2>
<div class="card">
<input id="nomeLoja" class="input" placeholder="Nome da loja">
<input id="enderecoColeta" class="input" placeholder="Endereço coleta">
<input id="enderecoEntrega" class="input" placeholder="Endereço entrega">
<input id="valor" class="input" type="number" placeholder="Valor da corrida R$">
<button class="btn" onclick="criarPedido()">PEDIR MOTOBOY</button>
</div>
<div id="listaPedidos"></div>
<div id="boxMotoboy"></div>

<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
let meuEmail="";
auth.onAuthStateChanged(async u=>{ if(!u) location.href="index.html"; else{ meuEmail=u.email.toLowerCase(); carregarPedidos(); }});

async function criarPedido(){
  let v=parseFloat(document.getElementById("valor").value);
  if(!v) return alert("Coloca valor");
  await db.collection("pedidos").add({
    lojista:meuEmail,
    loja:document.getElementById("nomeLoja").value,
    coleta:document.getElementById("enderecoColeta").value,
    entrega:document.getElementById("enderecoEntrega").value,
    valor:v,
    status:"aberto",
    criadoEm:new Date()
  });
  alert("Pedido criado!");
}

function carregarPedidos(){
  db.collection("pedidos").where("lojista","==",meuEmail).orderBy("criadoEm","desc").onSnapshot(snap=>{
    let html="";
    snap.forEach(doc=>{
      let p=doc.data(), id=doc.id;
      html+=`<div class="card"><b>${p.loja||'Pedido'}</b><br>${p.coleta} -> ${p.entrega}<br>R$ ${p.valor} - <b style="color:#D4AF37">${p.status}</b>`;
      if(p.status=="aceito" && p.motoboyEmail){
        html+=`<br><button class="btn" onclick="verMotoboy('${p.motoboyEmail}')">VER MOTOBOY</button>`;
      }
      html+=`</div>`;
    });
    document.getElementById("listaPedidos").innerHTML=html;
  });
}

async function verMotoboy(email){
  let doc=await db.collection("usuarios").doc(email).get();
  if(!doc.exists) return alert("Motoboy não encontrado");
  let m=doc.data();
  // SÓ NOME E FOTO DO ROSTO - SEM CNH/CRLV/TELEFONE/ENDEREÇO
  let foto=m.selfieBase64 || m.selfieUrl || "https://via.placeholder.com/150";
  let nome=m.nome || m.nomeCompleto || email;
  document.getElementById("boxMotoboy").innerHTML=`
    <div class="card" style="text-align:center;border:2px solid #D4AF37">
      <img src="${foto}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #D4AF37"><br>
      <h2 style="color:#D4AF37;margin:10px 0 5px 0">${nome}</h2>
      <p style="color:#aaa">Motoboy a caminho da sua loja</p>
      <button class="btn" onclick="document.getElementById('boxMotoboy').innerHTML=''">FECHAR</button>
    </div>
  `;
  window.scrollTo(0,0);
}
</script></body></html>
