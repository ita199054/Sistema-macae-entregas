<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lojista - Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;margin:0;padding:0}.top{background:#111;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #D4AF37;position:sticky;top:0}.card{background:#161616;border-radius:16px;padding:16px;margin:12px;max-width:500px;margin-left:auto;margin-right:auto;border:1px solid #222}.input{width:100%;padding:14px;border-radius:10px;background:#222;border:1px solid #333;color:#fff;margin:6px 0;font-size:14px}.btn{width:100%;padding:16px;border:none;border-radius:12px;background:#D4AF37;color:#000;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}.btnZap{background:#25D366;color:#fff}.btnOff{background:#333;color:#777}.numBox{font-size:36px;font-weight:900;color:#D4AF37;text-align:center;border:2px dashed #D4AF37;border-radius:16px;padding:18px;margin:12px 0;background:#111}
</style></head><body>
<div class="top"><b style="color:#D4AF37">⚡ ANJOS FLASH</b><div style="text-align:right"><small style="color:#888">SALDO</small><br><b id="saldo" style="color:#D4AF37;font-size:20px">R$ 0,00</b></div></div>

<div class="card">
<h3 style="color:#D4AF37;margin-top:0">🚀 CHAMAR MOTOBOY</h3>
<input id="nomeLoja" class="input" placeholder="Nome da sua loja" onblur="salva()">
<input id="coleta" class="input" placeholder="📍 Onde coletar (sua loja)" onblur="salva()">
<select id="veiculo" class="input" onchange="preco()"><option value="">🚚 ESCOLHA O VEÍCULO *</option><option value="moto">🏍️ Moto</option><option value="fiorino">🚐 Fiorino</option><option value="caminhao">🚚 Caminhão</option><option value="carreta">🚛 Carreta</option></select>

<div style="display:flex;gap:8px">
<label style="flex:1;background:#222;padding:12px;border-radius:10px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="retorno" onchange="preco()"> Retorno</label>
<label style="flex:1;background:#222;padding:12px;border-radius:10px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="super" onchange="preco()"> Super</label>
</div>

<input id="entrega" class="input" placeholder="🏁 Entrega onde?">
<div style="display:flex;gap:8px"><input id="cliente" class="input" placeholder="Nome cliente"><input id="zapCliente" class="input" placeholder="Zap cliente 22 9..."></div>
<input id="motoPref" class="input" placeholder="Motoboy #0001? deixe vazio = qualquer" style="border-color:#25D366">

<div id="boxPreco" style="display:none;background:#222;padding:12px;border-radius:10px;margin:8px 0;border:1px dashed #D4AF37">
<div style="display:flex;justify-content:space-between"><span>Corrida:</span><b id="pBase">R$0</b></div>
<div style="display:flex;justify-content:space-between;color:#D4AF37"><span><b>VOCÊ PAGA:</b></span><b id="pTotal" style="font-size:20px">R$0</b></div>
<div id="kmInfo" style="font-size:11px;color:#888;margin-top:4px"></div>
</div>

<div id="msgSaldo" style="text-align:center;font-weight:bold;margin:8px 0"></div>
<button id="btn" class="btn" onclick="chamar()">CHAMAR MOTOBOY AGORA</button>

<div id="pos" style="display:none">
<div class="numBox" id="numEntrega">#AF00000</div>
<div style="text-align:center;color:#25D366;font-weight:bold">✅ PEDIDO CRIADO - MANDA ESSE CÓDIGO PRO CLIENTE</div>
<button class="btn btnZap" onclick="mandaZap()">📲 ENVIAR CÓDIGO PARA CLIENTE NO ZAP</button>
<button class="btn" style="background:#222;color:#fff" onclick="copia()">📋 COPIAR CÓDIGO</button>
<input id="linkRastreio" class="input" readonly style="font-size:12px;text-align:center;margin-top:8px">
</div>
</div>

<div class="card"><h3 style="color:#D4AF37">📦 Meus Pedidos</h3><div id="lista"></div></div>
<div id="boxMoto"></div>

<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth();
let email="", saldo=0, T={moto:15,fiorino:35,caminhao:80,carreta:150}, DIN=0, ultimoNum="", ultimoZap="", distancia=2.5;

auth.onAuthStateChanged(async u=>{
  if(!u){location.href="index.html";return;}
  email=u.email.toLowerCase();
  let d=await db.collection("usuarios").doc(email).get();
  if(d.exists){let v=d.data();saldo=v.saldo||0;if(v.loja)document.getElementById("nomeLoja").value=v.loja;if(v.endereco)document.getElementById("coleta").value=v.endereco;if(v.nome&&!v.loja)document.getElementById("nomeLoja").value=v.nome;}
  document.getElementById("saldo").innerText="R$ "+saldo.toFixed(2);
  let c=await db.collection("config").doc("precos").get().catch(()=>null);
  if(c&&c.exists){let x=c.data();T={moto:x.moto||15,fiorino:x.fiorino||35,caminhao:x.caminhao||80,carreta:x.carreta||150};DIN=x.dinamica||0;}
  preco(); lista();
});

function salva(){let l=document.getElementById("nomeLoja").value.trim(), e=document.getElementById("coleta").value.trim(); if(l||e) db.collection("usuarios").doc(email).set({loja:l,endereco:e},{merge:true});}

function preco(){
  let v=document.getElementById("veiculo").value; if(!v){document.getElementById("boxPreco").style.display="none";return 0;}
  let base=T[v]||15; let km=distancia; let extra=km>3?(km-3)*2:0; let tot=base+extra+DIN;
  if(document.getElementById("retorno").checked) tot=tot*1.5;
  if(document.getElementById("super").checked) tot+=10;
  document.getElementById("boxPreco").style.display="block";
  document.getElementById("pBase").innerText="R$ "+base.toFixed(2)+(extra>0?" + R$"+extra.toFixed(2)+" km":"");
  document.getElementById("pTotal").innerText="R$ "+tot.toFixed(2);
  document.getElementById("kmInfo").innerText=km.toFixed(1)+" km • "+Math.round(km*4+5)+" min";
  let m=document.getElementById("msgSaldo"), b=document.getElementById("btn");
  if(saldo<tot){m.style.color="#ff4444";m.innerText="❌ SEM SALDO! Tem R$"+saldo.toFixed(2)+" precisa R$"+tot.toFixed(2);b.disabled=true;b.className="btn btnOff";b.innerText="SEM SALDO";}
  else{m.style.color="#25D366";m.innerText="✅ Saldo OK - pode chamar";b.disabled=false;b.className="btn";b.innerText="CHAMAR MOTOBOY AGORA";}
  return tot;
}

async function chamar(){
  let v=document.getElementById("veiculo").value; if(!v) return alert("ESCOLHA O VEÍCULO!");
  let tot=preco(); if(saldo<tot) return alert("SEM SALDO!");
  let loja=document.getElementById("nomeLoja").value.trim(), col=document.getElementById("coleta").value.trim(), ent=document.getElementById("entrega").value.trim();
  if(!loja||!col||!ent) return alert("Preencha loja, coleta e entrega");
  let pref=document.getElementById("motoPref").value.trim().replace("#","").replace(/\D/g,""); if(pref) pref=pref.padStart(4,"0");
  let num="AF"+Math.floor(10000+Math.random()*90000); ultimoNum=num; ultimoZap=document.getElementById("zapCliente").value.trim();
  // calcula km simples pela diferença de texto
  distancia=Math.max(1, Math.abs(col.length-ent.length)*0.4+2+Math.random()*2);
  salva(); document.getElementById("btn").innerText="ENVIANDO..."; document.getElementById("btn").disabled=true;
  try{
    await db.collection("pedidos").add({numero:num,lojista:email,loja:loja,coleta:col,entrega:ent,cliente:document.getElementById("cliente").value,telCliente:ultimoZap,tipoVeiculo:v,retorno:document.getElementById("retorno").checked,super:document.getElementById("super").checked,motoboyPreferido:pref||null,valor:tot,distancia:distancia,status:"aberto",criadoEm:firebase.firestore.FieldValue.serverTimestamp()});
    await db.collection("usuarios").doc(email).update({saldo:firebase.firestore.FieldValue.increment(-tot)});
    saldo-=tot; document.getElementById("saldo").innerText="R$ "+saldo.toFixed(2);
    document.getElementById("numEntrega").innerText="#"+num;
    document.getElementById("linkRastreio").value="Código de rastreio: "+num+" - Loja: "+loja;
    document.getElementById("pos").style.display="block";
    document.getElementById("entrega").value=""; window.scrollTo(0,0);
  }catch(e){alert(e.message);}
  document.getElementById("btn").disabled=false; document.getElementById("btn").innerText="CHAMAR MOTOBOY AGORA"; preco();
}

function mandaZap(){
  if(!ultimoZap) {ultimoZap=prompt("Digite o zap do cliente com DDD:"); if(!ultimoZap) return;}
  let tel=ultimoZap.replace(/\D/g,""); if(tel.length<10) return alert("Zap inválido"); if(!tel.startsWith("55")) tel="55"+tel;
  let loja=document.getElementById("nomeLoja").value;
  let msg=`Olá! Seu pedido *${ultimoNum}* da loja *${loja}* está a caminho! 🚀\n\n📦 Código: ${ultimoNum}\n🏍️ Motoboy ANJOS FLASH já foi acionado\n📍 Acompanhe com o código: ${ultimoNum}\n\nObrigado!`;
  window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(msg),"_blank");
}
function copia(){navigator.clipboard.writeText(ultimoNum); alert("Código "+ultimoNum+" copiado!");}
function lista(){
  db.collection("pedidos").where("lojista","==",email).orderBy("criadoEm","desc").limit(20).onSnapshot(s=>{
    let h=""; s.forEach(d=>{let p=d.data(); h+=`<div style="border-bottom:1px solid #222;padding:8px 0"><b>${p.numero||""} ${p.loja} [${(p.tipoVeiculo||"").toUpperCase()}]</b> <span style="float:right;color:${p.status=="aceito"?"#25D366":"#FFA500"}">${p.status}</span><br><small style="color:#888">${p.coleta} → ${p.entrega}<br>R$ ${p.valor?.toFixed(2)} ${p.retorno?"• RETORNO":""}</small><br>${p.status=="aberto"?`<small>Nº: <b style="color:#D4AF37">${p.numero}</b></small> <button onclick="ultimoNum='${p.numero}';ultimoZap='${p.telCliente||""}';mandaZap()" style="background:#25D366;color:#fff;border:none;border-radius:6px;padding:4px 8px;margin-left:6px">ZAP CLIENTE</button>`:""} ${p.status=="aceito"?`<button onclick="ver('${p.motoboyEmail}')" style="background:#D4AF37;border:none;border-radius:6px;padding:4px 8px">VER MOTOBOY</button>`:""}</div>`});
    document.getElementById("lista").innerHTML=h||"Nenhum";
  });
}
async function ver(em){let d=await db.collection("usuarios").doc(em).get(); if(!d.exists){let q=await db.collection("usuarios").where("email","==",em).limit(1).get(); if(!q.empty) d=q.docs[0];} let m=d.data(); let f=m.selfieBase64||m.selfieUrl||"https://via.placeholder.com/150"; document.getElementById("boxMoto").innerHTML=`<div class="card"><div style="display:flex;gap:12px;align-items:center"><img src="${f}" style="width:70px;height:70px;border-radius:50%;border:2px solid #D4AF37"><div><b style="color:#D4AF37">${m.nome||em} #${m.codigoMotoboy||""}</b><br><small style="color:#25D366">● A CAMINHO</small><br><small>${distancia.toFixed(1)}km • ${Math.round(distancia*4)} min até loja</small></div></div><button class="btn" style="background:#222;color:#fff;margin-top:8px" onclick="document.getElementById('boxMoto').innerHTML=''">FECHAR</button></div>`;}
</script></body></html>
