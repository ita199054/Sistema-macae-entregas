<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macaé Entregas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;padding:12px}.card{background:#fff;max-width:460px;margin:20px auto;padding:20px;border-radius:18px}input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px}label{display:flex;gap:8px;margin:10px 0;font-weight:bold}label input{width:auto}.btn{width:100%;padding:16px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:bold;margin-top:10px}.btn2{background:#25D366}.box{background:#f6f6f6;padding:12px;border-radius:12px;margin:12px 0}</style></head><body><div class="card"><h2>📦 Macaé Entregas</h2><input id="origem" placeholder="Origem - Loja"><input id="destino" placeholder="Destino"><label><input type="checkbox" id="retorno"> ↩️ Retorno +R$2 motoboy</label><label><input type="checkbox" id="subir"> 🏢 Subir +R$2 loja / +R$1,50 motoboy</label><div class="box">Lojista: R$ <b id="vL">8.00</b><br>Motoboy: R$ <b id="vM">5.00</b></div><button class="btn" onclick="calc()">Calcular</button><button class="btn btn2" onclick="zap()">WhatsApp</button></div><script>function calc(){let l=8,m=5;if(subir.checked){l+=2;m+=1.5}if(retorno.checked){m+=2}vL.innerText=l.toFixed(2);vM.innerText=m.toFixed(2);return{l,m}}function zap(){let c=calc();let msg=`📦 Macaé%0ADe: ${origem.value}%0APara: ${destino.value}%0AR$${c.l.toFixed(2)} Moto R$${c.m.toFixed(2)}`;open('https://wa.me/?text='+msg)}</script></body></html>
