<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macaé Entregas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f4f6;padding:12px}.card{background:#fff;max-width:460px;margin:20px auto;padding:20px;border-radius:18px;box-shadow:0 6px 20px #0001}h2{margin:0}input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}label{display:flex;align-items:center;gap:8px;margin:10px 0;font-weight:bold}label input{width:20px}.btn{width:100%;padding:16px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:10px}.btn2{background:#25D366}.box{background:#f3f4f6;padding:12px;border-radius:12px;margin:12px 0;line-height:1.6}</style></head><body><div class="card"><h2>📦 Macaé Entregas</h2><p style="color:#666;margin:4px 0 12px">Valor fixo - sem KM</p><input id="origem" placeholder="Origem - Loja"><input id="destino" placeholder="Destino - Cliente"><label><input type="checkbox" id="retorno"> ↩️ Retorno (+R$2 pro motoboy)</label><label><input type="checkbox" id="subir"> 🏢 Subir/Portaria (+R$2 lojista | +R$1,50 motoboy)</label><div class="box">Lojista paga: R$ <b id="vL">8.00</b><br>Motoboy recebe: R$ <b id="vM">5.00</b></div><button class="btn" onclick="calc()">Calcular</button><button class="btn btn2" onclick="zap()">Enviar no WhatsApp</button><p style="text-align:center;margin-top:12px"><a href="super.html" style="color:#888;text-decoration:none;font-size:13px">🔐 SUPER</a></p></div><script>function calc(){let l=8,m=5;if(document.getElementById('subir').checked){l+=2;m+=1.5}if(document.getElementById('retorno').checked){m+=2}document.getElementById('vL').innerText=l.toFixed(2);document.getElementById('vM').innerText=m.toFixed(2);return {l,m}}function zap(){let c=calc();let o=document.getElementById('origem').value||'Loja';let d=document.getElementById('destino').value||'Cliente';let msg=`📦 *NOVA ENTREGA - MACAÉ*%0AOrigem: ${o}%0ADestino: ${d}%0ALojista: R$${c.l.toFixed(2)} | Motoboy: R$${c.m.toFixed(2)}%0ARetorno:${document.getElementById('retorno').checked?'SIM':'NAO'} Subir:${document.getElementById('subir').checked?'SIM':'NAO'}`;window.open('https://wa.me/?text='+msg,'_blank')}document.getElementById('retorno').onchange=calc;document.getElementById('subir').onchange=calc;</script></body></html>
