<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Saldo Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script></head><body class="bg-gray-900 text-white p-2"><h1 class="text-yellow-400 font-bold">Lojas - Adicionar Saldo</h1><div id="l" class="mt-3"></div><script>
const cfg={apiKey:"AIzaSy...",authDomain:"macae-entregas.firebaseapp.com",projectId:"macae-entregas"};firebase.initializeApp(cfg);const db=firebase.firestore();
async function load(){const s=await db.collection("lojas").get();let h="";s.forEach(d=>{let x=d.data();h+=`<div class="bg-zinc-800 p-3 rounded mb-2"><b>${x.nomeFantasia||x.nome}</b><br>R$${x.saldo||0}<br><button onclick="add('${d.id}',10)" class="bg-green-500 px-3 py-1 rounded mr-1">+10</button><button onclick="add('${d.id}',50)" class="bg-green-600 px-3 py-1 rounded mr-1">+50</button><button onclick="add('${d.id}',100)" class="bg-yellow-500 px-3 py-1 rounded">+100</button><button onclick="zerar('${d.id}')" class="bg-red-600 px-3 py-1 rounded ml-2">Zerar</button></div>`});document.getElementById("l").innerHTML=h}async function add(id,v){await db.collection("lojas").doc(id).set({saldo:firebase.firestore.FieldValue.increment(v)},{merge:true});load()}async function zerar(id){if(confirm("Zerar?")){await db.collection("lojas").doc(id).set({saldo:0},{merge:true});load()}}load();
</script></body></html>
