<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>body{background:#0A0A0A;color:#fff;font-family:Arial;padding:10px;margin:0}.card{background:#171717;border:1px solid #D4AF3733;border-radius:12px;padding:12px;margin:10px auto;max-width:600px}.btn{background:#D4AF37;color:#000;font-weight:900;padding:8px 12px;border:none;border-radius:8px;cursor:pointer}</style>
</head><body>

<div id="pedidos"></div>
<div id="lojasCard" class="card">
<h3 style="color:#D4AF37">🏪 Lojas - Caixa endereço salvo + Saldo + Dono</h3>
<div id="listaLojas"></div>
</div>

<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

function loadLojas(){
  db.collection("usuarios").where("tipo","in",["lojista","loja","lojista_moto"]).onSnapshot(async snap=>{
    let h=`<div style="display:flex;font-weight:bold;color:#aaa;padding:6px 0;border-bottom:1px solid #333;font-size:12px"><div style="flex:2">Loja / Endereço / Caixa</div><div style="flex:1">Saldo</div><div style="flex:1">Dono</div><div style="flex:1">Ação</div></div>`;
    snap.forEach(doc=>{
      let u=doc.data(); let id=doc.id;
      let saldo = u.saldo!=null ? u.saldo : (u.caixa||0);
      let end = u.endereco || u.enderecoLoja || "sem endereço";
      let cidade = u.cidade || "macaé";
      h+=`<div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #222;font-size:13px">
        <div style="flex:2"><b>${u.loja||u.nome||id}</b><br>📦 ${end}<br>${cidade}</div>
        <div style="flex:1">
          <b id="v-${id}" style="color:#D4AF37">R$${saldo.toFixed(2)}</b><br>
          <input id="i-${id}" type="number" placeholder="${saldo}" style="width:65px;background:#222;color:#fff;border:1px solid #D4AF37;border-radius:6px;padding:6px;margin-top:4px">
        </div>
        <div style="flex:1">${u.donoFranqueado||u.franqueado||'sem'}<br><button class="btn" style="font-size:11px;background:#333;color:#fff" onclick="vincular('${id}')">Vincular</button></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <button class="btn" style="background:#25D366;color:#fff" onclick="salvarSaldo('${id}')">Salvar</button>
          <button class="btn" style="background:#444;color:#fff" onclick="addSaldo('${id}',50)">+50</button>
          <button class="btn" style="background:#444;color:#fff" onclick="zerarSaldo('${id}')">Zerar</button>
        </div>
      </div>`;
    });
    document.getElementById("listaLojas").innerHTML=h;
  });
}

async function salvarSaldo(id){
  let input=document.getElementById("i-"+id);
  let v=parseFloat(input.value);
  if(isNaN(v)){ alert("Digite um número! Ex: 100"); return; }
  try{
    await db.collection("usuarios").doc(id).update({saldo:v, caixa:v});
    alert("✅ Saldo de "+id+" agora R$"+v);
    input.value="";
  }catch(e){ alert("Erro: "+e.message); }
}
async function addSaldo(id, qtd){
  await db.collection("usuarios").doc(id).update({saldo: firebase.firestore.FieldValue.increment(qtd), caixa: firebase.firestore.FieldValue.increment(qtd)});
  alert("+"+qtd+" adicionado");
}
async function zerarSaldo(id){
  if(!confirm("Zerar saldo de "+id+"?")) return;
  await db.collection("usuarios").doc(id).update({saldo:0, caixa:0});
}
async function vincular(id){
  let email=prompt("Email do franqueado dono:");
  if(email) await db.collection("usuarios").doc(id).update({donoFranqueado:email.toLowerCase()});
}

loadLojas();
</script>
</body></html>
