<!-- PARTE 2 — PAINEL LOJISTA -->

<script type="module">

import {
  doc,
  getDoc,
  addDoc,
  collection,
  serverTimestamp,
  runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = window.db;
const auth = window.auth;

window.renderLojista = async function(data){

  const configSnap = await getDoc(
    doc(db,"configuracoes","principal")
  );

  const CONFIG = configSnap.exists()
    ? {...window.CONFIG_PADRAO,...configSnap.data()}
    : {...window.CONFIG_PADRAO};

  let lojas = data.lojas || [];

  let options = lojas.map((loja,index)=>{

    return `
      <option value="${loja.id || index}">
        ${loja.nome || "Loja"}
      </option>
    `;

  }).join("");

  $("panel").innerHTML = `

  <div class="card">

    <h2>🏪 PAINEL LOJISTA</h2>

    <div class="grid">

      <div class="card">
        <h3>Saldo disponível</h3>

        <div class="money">
          ${formatarMoeda(data.saldo)}
        </div>
      </div>

      <div class="card">
        <h3>Pagamento</h3>

        <div>
          PIX:
          <b>${window.PIX_EMPRESA}</b>
        </div>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>🚀 PEDIR CORRIDA</h2>

    <label>Escolha a loja</label>

    <select id="lojaOrigem">
      ${options}
    </select>

    <label>Tipo de veículo</label>

    <select id="tipoVeiculo">

      <option value="moto">
        🏍️ Motoboy / Moto
      </option>

      <option value="utilitario">
        🚐 Utilitário
      </option>

      <option value="caminhao">
        🚚 Caminhão
      </option>

      <option value="carreta">
        🚛 Carreta
      </option>

    </select>

    <label>Endereço do cliente</label>

    <input
      id="clienteEndereco"
      placeholder="Endereço completo">

    <label>Telefone do cliente</label>

    <input
      id="clienteTelefone"
      placeholder="Telefone">

    <label>Distância loja → cliente</label>

    <input
      id="clienteKm"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex.: 7.5"
      oninput="calcularValorPedido()">

    <div id="valorPedido"></div>

    <div id="opcoesPedido"></div>

    <label>
      Código do cliente — 4 dígitos
    </label>

    <input
      id="codigoCliente"
      maxlength="4"
      inputmode="numeric"
      placeholder="0000">

    <button
      class="gold"
      onclick="dispararCorrida()">

      🚀 PEDIR CORRIDA

    </button>

    <div id="resultadoPedido"></div>

  </div>

  <div class="card">

    <h2>📋 Minhas corridas</h2>

    <div id="corridasLojista">
      Carregando...
    </div>

  </div>

  <div class="card">

    <h2>📊 Extrato</h2>

    <button
      class="gold"
      onclick="mostrarExtratoLojista()">

      EXTRATO — ÚLTIMOS 90 DIAS

    </button>

    <button
      class="dark"
      onclick="imprimirExtratoLojista()">

      🖨️ IMPRIMIR EXTRATO

    </button>

    <div id="extratoLojista"></div>

  </div>

  <div class="card">

    <h2>💬 Chat com Admin</h2>

    <button
      class="gold"
      onclick="abrirChatAdmin()">

      ABRIR CHAT

    </button>

  </div>

  `;

  mostrarOpcoesPedido(CONFIG);

  ouvirCorridasLojista(auth.currentUser.uid);

};

function mostrarOpcoesPedido(CONFIG){

  let html = "";

  if(CONFIG.dinamicaAtiva){

    html += `
      <button
        id="btnDinamica"
        class="dark"
        onclick="alternarOpcaoPedido('dinamica')">

        ⚡ DINÂMICA

      </button>
    `;

  }

  if(CONFIG.retornoAtivo){

    html += `
      <button
        id="btnRetorno"
        class="dark"
        onclick="alternarOpcaoPedido('retorno')">

        ↩ RETORNO

      </button>
    `;

  }

  if(CONFIG.superAtivo){

    html += `
      <button
        id="btnSuper"
        class="dark"
        onclick="alternarOpcaoPedido('super')">

        ⭐ SUPER

      </button>
    `;

  }

  $("opcoesPedido").innerHTML = html;

  window.opcoesPedido = {
    dinamica:false,
    retorno:false,
    super:false
  };

}

window.alternarOpcaoPedido = function(tipo){

  window.opcoesPedido[tipo] =
    !window.opcoesPedido[tipo];

  const ids = {
    dinamica:"btnDinamica",
    retorno:"btnRetorno",
    super:"btnSuper"
  };

  const botao = $(ids[tipo]);

  if(botao){

    botao.className =
      window.opcoesPedido[tipo]
      ? "gold"
      : "dark";

  }

  calcularValorPedido();

};

window.calcularValorPedido = async function(){

  const km =
    Number($("clienteKm")?.value) || 0;

  const configSnap =
    await getDoc(
      doc(db,"configuracoes","principal")
    );

  const c =
    configSnap.exists()
    ? {...window.CONFIG_PADRAO,...configSnap.data()}
    : window.CONFIG_PADRAO;

  let valor = c.valorBase;

  if(km > c.kmBase){

    valor +=
      (km-c.kmBase) *
      c.adicionalLojista;

  }

  if(window.opcoesPedido?.dinamica){

    valor += Number(c.dinamicaValor || 0);

  }

  if(window.opcoesPedido?.super){

    valor = Number(c.superLojista);

  }

  if(window.opcoesPedido?.retorno){

    valor +=
      valor *
      (Number(c.retornoPercentual)/100);

  }

  $("valorPedido").innerHTML = `

    <div class="card">

      <h3>Valor para o lojista</h3>

      <div class="money">
        ${formatarMoeda(valor)}
      </div>

    </div>

  `;

  return Number(valor.toFixed(2));

};

window.dispararCorrida = async function(){

  const uid = auth.currentUser.uid;

  const userSnap =
    await getDoc(
      doc(db,"usuarios",uid)
    );

  if(!userSnap.exists()){

    toast("Usuário não encontrado.");
    return;

  }

  const lojista = userSnap.data();

  const lojaId =
    $("lojaOrigem").value;

  const loja =
    (lojista.lojas || []).find(
      (l,index)=>
        String(l.id || index) === String(lojaId)
    );

  if(!loja){

    toast("Escolha uma loja.");
    return;

  }

  const tipoVeiculo =
    $("tipoVeiculo").value;

  const endereco =
    $("clienteEndereco").value.trim();

  const telefone =
    $("clienteTelefone").value.trim();

  const km =
    Number($("clienteKm").value);

  const codigo =
    $("codigoCliente").value.trim();

  if(
    !endereco ||
    !telefone ||
    !km ||
    !/^[0-9]{4}$/.test(codigo)
  ){

    toast(
      "Preencha endereço, telefone, km e código de 4 dígitos."
    );

    return;

  }

  const valor =
    await calcularValorPedido();

  const saldo =
    Number(lojista.saldo || 0);

  /*
    O lojista somente chama se tiver
    saldo suficiente.
  */

  if(saldo < valor){

    $("resultadoPedido").innerHTML = `

      <div class="card">

        <h3>❌ SALDO INSUFICIENTE</h3>

        <p>
          Saldo:
          <b>${formatarMoeda(saldo)}</b>
        </p>

        <p>
          Necessário:
          <b>${formatarMoeda(valor)}</b>
        </p>

        <p>
          PIX para recarga:
          <b>${window.PIX_EMPRESA}</b>
        </p>

      </div>

    `;

    return;

  }

  try{

    /*
      IMPORTANTE:
      o débito do lojista acontece
      dentro da transação.
    */

    await runTransaction(
      db,
      async(transaction)=>{

        const lojaRef =
          doc(db,"usuarios",uid);

        const lojaSnap =
          await transaction.get(lojaRef);

        const saldoAtual =
          Number(
            lojaSnap.data().saldo || 0
          );

        if(saldoAtual < valor){

          throw new Error(
            "SALDO_INSUFICIENTE"
          );

        }

        /*
          DESCONTA DO LOJISTA
        */

        transaction.update(
          lojaRef,
          {
            saldo:
              Number(
                (saldoAtual-valor)
                .toFixed(2)
              )
          }
        );

        const corridaRef =
          doc(collection(db,"corridas"));

        transaction.set(
          corridaRef,
          {

            lojistaId:uid,
            lojistaNome:lojista.nome,

            lojaId,
            lojaNome:loja.nome,
            lojaEndereco:loja.endereco,

            clienteEndereco:endereco,
            clienteTelefone:telefone,

            codigoCliente:codigo,

            tipoVeiculo,

            km,

            valorLojista:valor,

            /*
              O motorista ainda não recebe
              antes de aceitar.
            */

            valorMotorista:0,

            motoristaId:null,
            motoristaNome:null,

            status:"PROCURANDO_MOTORISTA",

            opcoes:{
              dinamica:
                !!window.opcoesPedido.dinamica,

              retorno:
                !!window.opcoesPedido.retorno,

              super:
                !!window.opcoesPedido.super
            },

            criadoEm:serverTimestamp()

          }
        );

        const movRef =
          doc(collection(db,"movimentacoes"));

        transaction.set(
          movRef,
          {

            usuarioId:uid,

            corridaId:corridaRef.id,

            tipo:"DEBITO",

            valor,

            descricao:
              "Pedido de corrida",

            data:serverTimestamp()

          }
        );

      }
    );

    toast(
      "🚀 Corrida disparada automaticamente!"
    );

    $("resultadoPedido").innerHTML = `

      <div class="card">

        <h3>🚀 CORRIDA DISPARADA</h3>

        <p>
          Procurando:
          <b>${TIPOS_VEICULO[tipoVeiculo]}</b>
        </p>

        <p>
          Motoristas aprovados e ONLINE
          desse tipo receberão a corrida.
        </p>

      </div>

    `;

  }catch(e){

    toast(
      e.message === "SALDO_INSUFICIENTE"
      ? "Saldo insuficiente."
      : "Erro ao criar corrida."
    );

  }

};

<script type="module">

import {
  collection,
  query,
  where,
  orderBy,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db=window.db;
const auth=window.auth;

window.montarExtratoLojista = async function(){

  const inicio =
    DATA_90_DIAS();

  const q=query(
    collection(db,"movimentacoes"),
    where(
      "usuarioId",
      "==",
      auth.currentUser.uid
    ),
    where(
      "tipo",
      "==",
      "DEBITO"
    ),
    orderBy(
      "data",
      "desc"
    )
  );

  const snap=await getDocs(q);

  let total=0;
  let linhas=[];

  snap.forEach(d=>{

    const m=d.data();

    if(!m.data)return;

    const data=
      typeof m.data.toDate==="function"
      ?m.data.toDate()
      :new Date(m.data);

    if(data < inicio)return;

    total += Number(m.valor||0);

    linhas.push({

      data:formatarData(m.data),

      corrida:m.corridaId || "-",

      valor:Number(m.valor||0)

    });

  });

  return {linhas,total};

};

window.mostrarExtratoLojista=async function(){

  const resultado =
    await montarExtratoLojista();

  let html=`

    <div class="card">

      <h3>
        EXTRATO DOS ÚLTIMOS 90 DIAS
      </h3>

      <p>
        Total gasto:
        <b>
          ${formatarMoeda(resultado.total)}
        </b>
      </p>

      <table
        style="
        width:100%;
        border-collapse:collapse;
        ">

        <tr>
          <th>Data</th>
          <th>Corrida</th>
          <th>Valor</th>
        </tr>

  `;

  resultado.linhas.forEach(l=>{

    html += `

      <tr>

        <td>${l.data}</td>

        <td>${l.corrida}</td>

        <td>
          ${formatarMoeda(l.valor)}
        </td>

      </tr>

    `;

  });

  html += `

      </table>

    </div>

  `;

  $("extratoLojista").innerHTML =
    html;

};

  const janela =
