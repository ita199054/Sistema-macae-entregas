<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anjos Flash V7 - Macaé + Bairro +X - FIX</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap');
body{font-family:'Inter';max-width:480px;margin:0 auto;background:#0e0e0e;padding:0;color:#fff}
.bg-stripe{background: repeating-linear-gradient(45deg,#000,#000 18px,#FFD700 18px,#FFD700 36px);height:10px}
.top{position:sticky;top:0;background:#000;color:#FFD700;padding:12px;border:3px solid #FFD700;z-index:9;display:flex;justify-content:space-between;align-items:center}
.top b{font-family:'Anton';font-size:20px}
.card{background:#1e1e1e;border:3px solid #FFD700;padding:12px;margin:10px;box-shadow:5px 5px 0 #FFD700}
.card-w{background:#fff;color:#000;border:3px solid #000;padding:12px;margin:10px;box-shadow:5px 5px 0 #000}
input,select{width:100%;padding:12px;margin-top:6px;border:2px solid #FFD700;background:#000;color:#FFD700;font-weight:bold;box-sizing:border-box}
button{padding:12px;width:100%;border:3px solid #000;font-family:'Anton';font-size:16px;margin-top:6px;box-shadow:4px 4px 0 #000}
.b-black{background:#000;color:#FFD700;border-color:#FFD700}.b-gold{background:#FFD700;color:#000}.b-green{background:#00ff88;color:#000}.b-red{background:#ff0033;color:#fff}.b-gray{background:#333;color:#fff}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.v-card{background:#fff;color:#000;border:3px solid #000;padding:8px;text-align:center;font-weight:900;font-size:12px}.v-card.active{background:#FFD700}
.flex{display:flex;justify-content:space-between;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="bg-stripe"></div>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",
  authDomain: "anjos-flash.firebaseapp.com",
  projectId: "anjos-flash",
  storageBucket: "anjos-flash.firebasestorage.app",
  messagingSenderId: "725133182752",
  appId: "1:725133182752:web:5f9a98fa97269dcdcab945",
  measurementId: "G-9CSJXXNR0C"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();
let tela="inicio", user=null, perfil=null;
let config={base:10, kmBase:5, valorKm:2, motoBase:7.5, motoKm:1.5, dinamicaAtiva:false, valorDinamica:3, valorSuper:5, retornoPorc:50, valorExpress:8, bairros:{"centro":0,"imbetiba":3,"cavaleiros":5,"cavalheiros":5,"barra":6,"lagomar":8,"aeroporto":7,"malvinas":7,"morro":7,"parque aeroporto":7,"atlantica":5}, utilitarioBase:25, utilitarioKm:3, caminhaoBase:60, caminhaoKm:5, carretaBase:120, carretaKm:8};
let lojas=[], motoboys=[], entregas=[];
function genCode(){return Math.floor(1000+Math.random()*9000).toString();}
function calc(km, tipo, veiculo, bairro){
  let k=Number(km)||0; let b=(bairro||"").toLowerCase().trim(); let extraB=config.bairros[b]||0;
  if(b.includes("atlantica")) extraB=config.bairros["atlantica"];
  if(b.includes("cavalheiros")||b.includes("cavaleiros")) extraB=config.bairros["cavaleiros"];
  let paga=config.base+(k>config.kmBase?(k-config.kmBase)*config.valorKm:0)+extraB; let moto=config.motoBase+(k>config.kmBase?(k-config.kmBase)*config.motoKm:0);
  if(veiculo==="utilitario"){paga=config.utilitarioBase+(k>config.kmBase?(k-config.kmBase)*config.utilitarioKm:0)+extraB; moto=paga*0.75;}
  if(veiculo==="caminhao"){paga=config.caminhaoBase+(k>config.kmBase?(k-config.kmBase)*config.caminhaoKm:0)+extraB; moto=paga*0.75;}
  if(veiculo==="carreta"){paga=config.carretaBase+(k>config.kmBase?(k-config.kmBase)*config.carretaKm:0)+extraB; moto=paga*0.75;}
  if(tipo==="super") paga+=config.valorSuper;
  if(tipo==="retorno") paga*=config.retornoPorc/100;
  if(tipo==="express") paga+=config.valorExpress;
  if(tipo==="dinamica"&&config.dinamicaAtiva) paga+=config.valorDinamica;
  return {paga:+paga.toFixed(2), moto:+moto.toFixed(2), extraB, tempo:Math.round(k*3+6), km:k};
}
auth.onAuthStateChanged(async u=>{user=u; if(u){let d=await db.collection("usuarios").doc(u.uid).get(); perfil=d.exists?{id:d.id,...d.data()}:null; tela=perfil?.tipo||"inicio";}else{tela="inicio";perfil=null;} render();});
let files={cnh:null,crlv:null,selfie:null,comp:null};
function render(){
  let h="";
  if(tela==="inicio"){
    h=`<div class="top"><b>⚡ ANJOS FLASH V7</b><small>MACAÉ FIX</small></div><div class="bg-stripe"></div>
    <div class="card"><input id="email" placeholder="EMAIL"><input id="senha" type="password" placeholder="SENHA"><button class="b-black" onclick="login()">ENTRAR</button>
    <button class="b-gray" onclick="tela='cad_lojista';render()">🏪 Lojista</button><button class="b-gray" onclick="tela='cad_super';render()">🏪🏪 Super</button>
    <button style="background:#fff;color:#000" onclick="tela='cad_motoboy';render()">🚚 Motorista #0001 + Docs + Veículo</button>
    <button class="b-gold" onclick="tela='login_franquia';render()">🏢 Admin / Franqueado</button></div>`;
  }
  else if(tela==="cad_lojista"||tela==="cad_super"){
    let isSuper=tela==="cad_super";
    h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><h3 style="font-family:Anton;color:#FFD700">${isSuper?'SUPER':'LOJISTA'} - Saldo 00,00</h3><input id="nome" placeholder="Nome loja"><input id="dono" placeholder="Dono"><input id="tel" placeholder="WhatsApp"><input id="endereco" placeholder="Av Atlântica 2720, Cavaleiros, Macaé RJ"><input id="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button class="b-black" onclick="cadastrarLojista(${isSuper})">CADASTRAR SALDO 0,00</button></div>`;
  }
  else if(tela==="cad_motoboy"){
    h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><h3 style="font-family:Anton;color:#FFD700">MOTORISTA #0001 - MACAÉ - Saldo 00,00</h3><select id="tipoVeiculo"><option value="moto">🏍️ Moto</option><option value="utilitario">🚐 Utilitário</option><option value="caminhao">🚚 Caminhão</option><option value="carreta">🚛 Carreta</option></select><input id="nome" placeholder="Nome *"><input id="tel" placeholder="Tel *"><input id="cpf" placeholder="CPF *"><input id="placa" placeholder="Placa *"><input id="email" placeholder="Email *"><input id="senha" type="password" placeholder="Senha *"><label style="color:#FFD700;font-size:11px">CNH *</label><input type="file" accept="image/*,.pdf" onchange="files.cnh=this.files[0]"><label style="color:#FFD700;font-size:11px">CRLV *</label><input type="file" accept="image/*,.pdf" onchange="files.crlv=this.files[0]"><label style="color:#FFD700;font-size:11px">Selfie *</label><input type="file" accept="image/*" onchange="files.selfie=this.files[0]"><label style="color:#FFD700;font-size:11px">Comprovante *</label><input type="file" accept="image/*,.pdf" onchange="files.comp=this.files[0]"><button class="b-black" onclick="cadastrarMotoboy()">CADASTRAR SALDO 0,00</button></div>`;
  }
  else if(tela==="login_franquia"){h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><input id="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button class="b-black" onclick="login()">ENTRAR</button><div style="font-size:11px;color:#888">admin@anjos.com / 123456</div></div>`;}
  else if(tela==="lojista"||tela==="lojista_super"){
    let isSuper=tela==="lojista_super"; let minhas=lojas.filter(l=>l.ownerId===user.uid||l.dono===perfil.dono); let lojaId=document.getElementById("lojaSel")?.value||(minhas[0]?.id||""); let loja=lojas.find(l=>l.id===lojaId)||minhas[0];
    if(!loja){document.getElementById("app").innerHTML='<div class="card">Carregando...</div>'; return;}
    let saldo=loja.saldo||0;
    let kmVal=document.getElementById("km")?.value||3; let bairroVal=document.getElementById("bairroEnt")?.value||""; let veiculoSel=document.getElementById("veiculo")?.value||"moto"; let tipoSel=document.querySelector('input[name="tipo"]:checked')?.value||"normal"; let c=calc(kmVal,tipoSel,veiculoSel,bairroVal);
    h=`<div class="top"><div><b>${loja?.nome||perfil.nome}</b><br><small style="color:#fff">R$${saldo.toFixed(2)} | Bairro +R$${c.extraB}</small></div><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="bg-stripe"></div>
    <div class="card" style="border-color:#00ff88;box-shadow:5px 5px 0 #00ff88"><h4 style="color:#00ff88;font-family:Anton;margin:0 0 6px 0">✏️ MEU ENDEREÇO - CLIQUE PARA EDITAR</h4><input id="editEnderecoLoja" value="${loja.endereco||''}" placeholder="Av Atlântica 2720, Cavaleiros, Macaé RJ"><button class="b-green" onclick="salvarEndereco('${loja.id}')">SALVAR MEU ENDEREÇO</button><small style="color:#aaa">Use formato curto: Av Atlantica 2720, Cavaleiros</small></div>
    <div class="card-w"><h3 style="font-family:Anton">📦 NOVA ENTREGA + BAIRRO +X</h3>
    <input id="end" placeholder="Endereço cliente *"><input id="bairroEnt" list="bairrosList" placeholder="Bairro * ex: Barra" value="${bairroVal}" oninput="render()"><datalist id="bairrosList">${Object.keys(config.bairros).map(b=>`<option value="${b}">`).join('')}</datalist>
    <input id="km" type="number" value="${kmVal}" oninput="render()" placeholder="KM">
    <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(loja?.endereco||'Macaé')}&destination=${encodeURIComponent((document.getElementById('end')?.value||'')+','+bairroVal+', Macaé')}" target="_blank" style="font-size:11px;color:#000;font-weight:900;display:block;margin:6px 0;background:#FFD700;padding:6px;text-align:center;border:2px solid #000">🗺️ VER MAPA: ${loja?.endereco||''} → cliente [CORRIGIDO]</a>
    <div class="v-grid"><div class="v-card ${veiculoSel==='moto'?'active':''}" onclick="document.getElementById('veiculo').value='moto';render()">🏍️ MOTO<br>R$${calc(kmVal,tipoSel,'moto',bairroVal).paga}</div><div class="v-card ${veiculoSel==='utilitario'?'active':''}" onclick="document.getElementById('veiculo').value='utilitario';render()">🚐 UTIL<br>R$${calc(kmVal,tipoSel,'utilitario',bairroVal).paga}</div><div class="v-card ${veiculoSel==='caminhao'?'active':''}" onclick="document.getElementById('veiculo').value='caminhao';render()">🚚 CAMINHÃO<br>R$${calc(kmVal,tipoSel,'caminhao',bairroVal).paga}</div><div class="v-card ${veiculoSel==='carreta'?'active':''}" onclick="document.getElementById('veiculo').value='carreta';render()">🚛 CARRETA<br>R$${calc(kmVal,tipoSel,'carreta',bairroVal).paga}</div></div><select id="veiculo" style="display:none"><option value="moto">moto</option><option value="utilitario">utilitario</option><option value="caminhao">caminhao</option><option value="carreta">carreta</option></select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px"><label style="background:#000;color:#FFD700;padding:6px"><input type="radio" name="tipo" value="normal" ${tipoSel==='normal'?'checked':''} onchange="render()"> Normal</label><label style="background:#000;color:#FFD700;padding:6px"><input type="radio" name="tipo" value="super" ${tipoSel==='super'?'checked':''} onchange="render()"> Super</label><label style="background:#fff;color:#000;padding:6px;border:2px solid #000"><input type="radio" name="tipo" value="retorno" ${tipoSel==='retorno'?'checked':''} onchange="render()"> Retorno 50%</label><label style="background:#fff;color:#000;padding:6px;border:2px solid #000"><input type="radio" name="tipo" value="express" ${tipoSel==='express'?'checked':''} onchange="render()"> Express</label></div>
    <div style="background:#000;color:#FFD700;padding:10px;text-align:center;font-family:Anton">VOCÊ PAGA R$${c.paga}<br><small style="font-family:Inter;font-size:10px;color:#fff">Base R$10 + KM + Bairro +R$${c.extraB} [${veiculoSel}] Você não vê ganho motorista</small></div>
    <input id="motoboyNum" placeholder="#0001 direcionar (opcional)"><button class="b-black" onclick="criarEntrega()">CRIAR + CÓDIGO 4 DÍGITOS</button></div>
    <div class="card"><h4 style="color:#FFD700;font-family:Anton">ENTREGAS</h4>${entregas.filter(e=>minhas.some(l=>l.id===e.lojaId)).slice(-15).reverse().map(e=>`<div style="border-bottom:1px solid #333;padding:6px 0"><b>${e.endereco}</b> ${e.bairro?`[${e.bairro} +R$${e.extraB||0}]`:''} ${e.veiculo} ${e.tipo}<br>R$${e.paga} KM ${e.km} Código ${e.codigo} ${e.motoboyNome?`🏍️ #${e.motoboyNumero}`:'⏳'}</div>`).join('')||'Nenhuma'}</div>`;
  }
  else if(tela==="motoboy"){
    let disp=entregas.filter(e=>e.status==='pendente' && e.veiculo===perfil.tipoVeiculo && (!e.motoboyDestino || e.motoboyDestino===perfil.numero));
    h=`<div class="top"><div>#${perfil.numero} ${perfil.nome} [${perfil.tipoVeiculo}]<br><small style="color:#fff">R$${(perfil.saldo||0).toFixed(2)} Saldo 00,00</small></div><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="bg-stripe"></div>
    <div class="card"><h3 style="color:#FFD700;font-family:Anton">CORRIDAS ${perfil.tipoVeiculo.toUpperCase()}</h3>${disp.map(e=>`<div style="background:#fff;color:#000;padding:8px;margin-bottom:6px;border:3px solid #000"><b>${e.lojaNome} [${e.veiculo}] ${e.tipo} ${e.bairro||''}</b><br>${e.endereco} ${e.km}km<br>💰 VOCÊ RECEBE R$${e.moto}<br><div class="flex"><button class="b-green" onclick="aceitar('${e.id}')">ACEITAR</button><button class="b-red" onclick="rejeitar('${e.id}')">REJEITAR</button></div><a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(e.lojaEndereco||'')}&destination=${encodeURIComponent(e.endereco+','+e.bairro)}" target="_blank"><button class="b-gray">🗺️ MAPA ATÉ CLIENTE</button></a></div>`).join('')||'Nenhuma'}</div>`;
  }
  else if(tela==="admin"||tela==="franqueado"){
    h=`<div class="top"><b>👑 ${tela.toUpperCase()} - BAIRROS +X</b><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="bg-stripe"></div>
    <div class="card"><h3 style="color:#FFD700;font-family:Anton">📍 CONFIG BAIRROS +X MACAÉ</h3><input id="nomeBairro" placeholder="Nome bairro"><input id="valorBairro" type="number" placeholder="Valor extra R$"><button class="b-black" onclick="addBairro()">SALVAR BAIRRO +X</button>
    <div style="margin-top:8px">${Object.entries(config.bairros).map(([b,v])=>`<div class="flex" style="background:#000;padding:6px;margin-bottom:4px;border:1px solid #FFD700">${b.toUpperCase()} +R$${v}<button onclick="removeBairro('${b}')" style="width:40px" class="b-red">X</button></div>`).join('')}</div></div>
    <div class="card"><h3>Motoboys Docs</h3>${motoboys.map(m=>`<div style="border-bottom:1px solid #333;padding:4px 0">#${m.numero} ${m.nome} [${m.tipoVeiculo}]<br>${m.cnhUrl?`<a href="${m.cnhUrl}" target="_blank" style="color:#FFD700">CNH</a>`:''} ${m.crlvUrl?`<a href="${m.crlvUrl}" target="_blank" style="color:#FFD700">CRLV</a>`:''} ${m.selfieUrl?`<a href="${m.selfieUrl}" target="_blank" style="color:#FFD700">SELFIE</a>`:''} ${m.compUrl?`<a href="${m.compUrl}" target="_blank" style="color:#FFD700">COMP</a>`:''}</div>`).join('')}</div>`;
  }
  document.getElementById("app").innerHTML=h;
}
async function login(){try{await auth.signInWithEmailAndPassword(document.getElementById("email").value,document.getElementById("senha").value);}catch(e){alert(e.message)}}
async function cadastrarLojista(isSuper){let n=document.getElementById("nome").value,d=document.getElementById("dono").value||n,t=document.getElementById("tel").value,en=document.getElementById("endereco").value||"Av Atlantica 2720, Cavaleiros, Macae RJ",em=document.getElementById("email").value,s=document.getElementById("senha").value;let c=await auth.createUserWithEmailAndPassword(em,s);await db.collection("usuarios").doc(c.user.uid).set({nome:n,dono:d,tipo:isSuper?"lojista_super":"lojista",email:em,saldo:0});await db.collection("lojistas").doc(c.user.uid).set({nome:n,dono:d,tel:t,endereco:en,email:em,tipo:isSuper?"lojista_super":"lojista",ownerId:c.user.uid,saldo:0});alert("Lojista saldo 0,00 OK");}
async function cadastrarMotoboy(){let n=document.getElementById("nome").value,t=document.getElementById("tel").value,em=document.getElementById("email").value,s=document.getElementById("senha").value,cpf=document.getElementById("cpf").value,placa=document.getElementById("placa").value,tipoVeiculo=document.getElementById("tipoVeiculo").value;if(!files.cnh||!files.crlv||!files.selfie||!files.comp) return alert("Envie todos docs");let c=await auth.createUserWithEmailAndPassword(em,s);let num=("000"+(motoboys.length+1)).slice(-4);async function up(f,p){let r=storage.ref().child(p);await r.put(f);return await r.getDownloadURL();}let cnhUrl=await up(files.cnh,`docs/${c.user.uid}/cnh`),crlvUrl=await up(files.crlv,`docs/${c.user.uid}/crlv`),selfieUrl=await up(files.selfie,`docs/${c.user.uid}/selfie`),compUrl=await up(files.comp,`docs/${c.user.uid}/comp`);await db.collection("usuarios").doc(c.user.uid).set({nome:n,tipo:"motoboy",tipoVeiculo,numero:num,email:em,saldo:0});await db.collection("motoboys").doc(c.user.uid).set({nome:n,tel:t,email:em,numero:num,cpf,placa,tipoVeiculo,cnhUrl,crlvUrl,selfieUrl,compUrl,tipo:"motoboy",saldo:0});alert("#"+num+" "+tipoVeiculo+" saldo 0,00 OK");}
async function criarEntrega(){let end=document.getElementById("end").value,bairro=document.getElementById("bairroEnt").value,km=document.getElementById("km").value,tipo=document.querySelector('input[name="tipo"]:checked')?.value||"normal",dest=document.getElementById("motoboyNum").value,veiculo=document.getElementById("veiculo").value||"moto";let c=calc(km,tipo,veiculo,bairro);let loja=lojas.find(l=>l.ownerId===user.uid);let codigo=genCode();await db.collection("entregas").add({endereco:end,bairro,extraB:c.extraB,km:Number(km),tempo:c.tempo,paga:c.paga,moto:c.moto,tipo,veiculo,status:"pendente",codigo,lojaId:loja?.id||user.uid,lojaNome:loja?.nome||perfil.nome,lojaEndereco:loja?.endereco||"",motoboyDestino:dest?dest.replace("#",""):"",criadoAt:new Date()});}
async function aceitar(id){await db.collection("entregas").doc(id).update({status:"aceita",motoboyId:user.uid,motoboyNome:perfil.nome,motoboyNumero:perfil.numero});}
async function rejeitar(id){await db.collection("entregas").doc(id).update({rejeitados:firebase.firestore.FieldValue.arrayUnion(user.uid)});}
async function addBairro(){let nome=document.getElementById("nomeBairro").value.toLowerCase().trim();let valor=Number(document.getElementById("valorBairro").value);if(!nome) return; config.bairros[nome]=valor;await db.collection("config").doc("geral").set(config);render();}
async function removeBairro(nome){delete config.bairros[nome];await db.collection("config").doc("geral").set(config);render();}
async function salvarEndereco(id){let novo=document.getElementById("editEnderecoLoja").value; if(!novo) return alert("Digite endereço"); await db.collection("lojistas").doc(id).update({endereco:novo}); alert("Endereço salvo: "+novo); render();}
db.collection("config").doc("geral").onSnapshot(d=>{if(d.exists){config={...config,...d.data()};render();}});
db.collection("lojistas").onSnapshot(s=>{lojas=s.docs.map(d=>({id:d.id,...d.data()}));render();});
db.collection("motoboys").onSnapshot(s=>{motoboys=s.docs.map(d=>({id:d.id,...d.data()}));render();});
db.collection("entregas").onSnapshot(s=>{entregas=s.docs.map(d=>({id:d.id,...d.data()}));render();});
render();
</script>
</body>
</html>
