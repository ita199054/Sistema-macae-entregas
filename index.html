function $(id){
  return document.getElementById(id);
}

function dinheiro(valor){
  return Number(valor || 0)
    .toLocaleString("pt-BR",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
}

function mensagem(id,texto,erro=false){

  const el = $(id);

  if(!el) return;

  el.style.display = "block";
  el.style.color = erro ? "#ff4444" : "#00ff66";
  el.innerText = texto;
}

function gerarCodigo4(){

}

function geraRastreio(){

}

function normalizarCodigo(codigo){

  codigo = String(codigo || "")
    .trim()
    .toUpperCase();

  if(codigo && !codigo.startsWith("#")){
    codigo = "#" + codigo;
  }

  return codigo;
}

  mensagem(

    false
  );

  if(!email){

    mensagem(
      "mensagemLogin",
      "Digite o e-mail.",
      true
    );

    return;
  }

  if(!senha){

    mensagem(
      "mensagemLogin",
      "Digite a senha.",
      true
    );

    return;
  }

  try{

    const cred =
      await auth.signInWithEmailAndPassword(
        email,
        senha
      );

    usuarioAtual = cred.user;

    console.log(
      "LOGIN OK:",
      usuarioAtual.uid
    );

    await carregarUsuario();

  }catch(error){

    console.error(
      "ERRO LOGIN:",
      error
    );

    let texto =
      "ERRO AO ENTRAR.\n\n";

    switch(error.code){

      case "auth/invalid-email":
        texto += "E-mail inválido.";
        break;

      case "auth/user-not-found":
        texto += "Usuário não encontrado.";
        break;

      case "auth/wrong-password":
        texto += "Senha incorreta.";
        break;

      case "auth/invalid-credential":
        texto +=
          "E-mail ou senha incorretos.";
        break;

      case "auth/user-disabled":
        texto +=
          "Usuário desativado.";
        break;

      case "auth/too-many-requests":
        texto +=
          "Muitas tentativas. Aguarde.";
        break;

      case "auth/network-request-failed":
        texto +=
          "Falha de conexão com a internet.";
        break;

      case "auth/operation-not-allowed":
        texto +=
          "E-mail/senha não está ativado no Firebase Authentication.";
        break;

      case "auth/api-key-not-valid":
        texto +=
          "A chave API do Firebase não é válida.";
        break;

      default:
        texto +=
          "Código: " +
          (error.code || "desconhecido") +
          "\n\n" +
          (error.message || "");
    }

    mensagem(
      "mensagemLogin",
      texto,
      true
    );
  }
}


/* =========================================================

async function registrarUser(){

  const nome =
    $("cadNome").value.trim();

  const email =
    $("cadEmail").value.trim().toLowerCase();

  const telefone =
    $("cadTelefone").value.trim();

  const senha =
    $("cadSenha").value;

  const tipo =
    $("cadTipo").value;

  const tipoConta =
    tipo === "lojista"
      ? $("cadTipoConta").value
      : tipo;

  const endereco =
    $("cadEndereco")
      ? $("cadEndereco").value.trim()
      : "";

  const nomeLoja =
    $("cadNomeLoja")
      ? $("cadNomeLoja").value.trim()
      : "";

  if(!nome || !email || !telefone || !senha){

    mensagem(
      "mensagemCadastro",
      "Preencha nome, e-mail, telefone e senha.",
      true
    );

    return;
  }

  if(tipo === "lojista" && !endereco){

    mensagem(
      "mensagemCadastro",
      "Informe o endereço da loja.",
      true
    );

    return;
  }

  if(tipo === "motoboy"){

    if(!$("cadSelfie").files[0]){

      mensagem(
        "mensagemCadastro",
        "Envie a selfie.",
        true
      );

      return;
    }

    if(!$("cadCNH").files[0]){

      mensagem(
        "mensagemCadastro",
        "Envie a CNH.",
        true
      );

      return;
    }

    if(!$("cadCRLV").files[0]){

      mensagem(
        "mensagemCadastro",
        "Envie o CRLV do veículo.",
        true
      );

      return;
    }
  }

  mensagem(
    "mensagemCadastro",
    "Criando cadastro...",
    false
  );

  let cred = null;

  try{

    cred =
      await auth.createUserWithEmailAndPassword(
        email,
        senha
      );

    const uid = cred.user.uid;

    let documentos = {};

    /* ================================================
       DOCUMENTOS MOTOBOY
    ================================================= */

    if(tipo === "motoboy"){

      const selfie =
        $("cadSelfie").files[0];

      const cnh =
        $("cadCNH").files[0];

      const crlv =
        $("cadCRLV").files[0];

      documentos.selfie =
        await enviarArquivo(
          selfie,
          `documentos/${uid}/selfie`
        );

      documentos.cnh =
        await enviarArquivo(
          cnh,
          `documentos/${uid}/cnh`
        );

      documentos.crlv =
        await enviarArquivo(
          crlv,
          `documentos/${uid}/crlv`
        );
    }


    /* ================================================
       PERFIL
    ================================================= */

    const perfil = {

      uid: uid,

      nome: nome,

      email: email,

      telefone: telefone,

      tipo: tipo,

      tipoConta: tipoConta,

      endereco: endereco,

      ativo: true,

      aprovado:
        tipo === "motoboy"
          ? false
          : true,

      online: false,

      criadoEm:
        firebase.firestore.FieldValue.serverTimestamp()

    };


    if(tipo === "motoboy"){

      perfil.veiculo =
        $("cadVeiculo").value;

      perfil.documentos =
        documentos;
    }


    await db
      .collection("profiles")
      .doc(uid)
      .set(perfil);


    /* ================================================
       CARTEIRA
    ================================================= */

    await db
      .collection("wallets")
      .doc(uid)
      .set({
        uid: uid,
        saldo: 0,
        atualizadoEm:
          firebase.firestore.FieldValue.serverTimestamp()
      });


    /* ================================================
       LOJISTA
    ================================================= */

    if(tipo === "lojista"){

      await db
        .collection("lojas")
        .add({

          donoId: uid,

          nomeLoja:
            nomeLoja || nome,

          endereco: endereco,

          lat: null,

          lng: null,

          criadoEm:
            firebase.firestore.FieldValue.serverTimestamp()

        });
    }


    /* ================================================
       MOTOBOY
    ================================================= */

    if(tipo === "motoboy"){

      const snap =
        await db
          .collection("motoboys")
          .orderBy("numero","desc")
          .limit(1)
          .get();

      let numero = 1;

      if(!snap.empty){

        numero =
          Number(
            snap.docs[0].data().numero || 0
          ) + 1;
      }

      const codigo =
        "#" +
        String(numero).padStart(4,"0");


      await db
        .collection("motoboys")
        .doc(uid)
        .set({

          uid: uid,

          numero: numero,

          codigo: codigo,

          aprovado: false,

          nome: nome,

          email: email,

          telefone: telefone,

          veiculo:
            $("cadVeiculo").value,

          documentos: documentos,

          criadoEm:
            firebase.firestore.FieldValue.serverTimestamp()

        });


      await db
        .collection("profiles")
        .doc(uid)
        .update({
          motoboyCodigo: codigo
        });


      mensagem(
        "mensagemCadastro",
        "CADASTRO REALIZADO!\n\n" +
        "Seu código: " +
        codigo +
        "\n\n" +
        "Aguarde a aprovação do administrador.",
        false
      );

      return;
    }


    mensagem(
      "mensagemCadastro",
      "Cadastro realizado com sucesso.\n\nAgora você pode entrar.",
      false
    );


    await auth.signOut();

  }catch(error){

    console.error(
      "ERRO CADASTRO:",
      error
    );

    if(cred && cred.user){

      try{
        await cred.user.delete();
      }catch(e){}
    }

    mensagem(
      "mensagemCadastro",
      "ERRO NO CADASTRO.\n\n" +
      "Código: " +
      (error.code || "desconhecido") +
      "\n\n" +
      (error.message || ""),
      true
    );
  }
}


/* =========================================================
   STORAGE
========================================================= */

async function enviarArquivo(file,path){

  if(!file){
    throw new Error(
      "Arquivo não informado."
    );
  }

  if(file.size > 10 * 1024 * 1024){

    throw new Error(
      "Arquivo maior que 10 MB: " +
      file.name
    );
  }

  const ref =
    storage.ref().child(path);

  await ref.put(file);

  return await ref.getDownloadURL();
}


/* =========================================================

async function carregarUsuario(){

  try{

    if(!auth.currentUser){

      mensagem(
        "mensagemLogin",
        "Usuário não encontrado.",
        true
      );

      return;
    }

    usuarioAtual =
      auth.currentUser;

    const snap =
      await db
        .collection("profiles")
        .doc(usuarioAtual.uid)
        .get();

    if(!snap.exists){

      mensagem(
        "mensagemLogin",
        "Login realizado, mas o perfil não foi encontrado no Firestore.",
        true
      );

      return;
    }

    perfilAtual =
      snap.data();


    if(!perfilAtual.tipo){

      mensagem(
        "mensagemLogin",
        "Perfil sem tipo de usuário.",
        true
      );

      return;
    }


    $("telaLogin")
      .classList.add("oculto");

    $("app")
      .classList.remove("oculto");


    $("tituloPainel").innerText =
      perfilAtual.nome ||
      "PAINEL";


    await abrirPainel(
      perfilAtual.tipo
    );


  }catch(error){

    console.error(
      "ERRO CARREGAR USUARIO:",
      error
    );

    mensagem(
      "mensagemLogin",
      "ERRO AO CARREGAR PAINEL.\n\n" +
      (error.code || "") +
      "\n" +
      (error.message || ""),
      true
    );
  }
}

async function obterSaldo(uid){

  const snap =
    await db
      .collection("wallets")
      .doc(uid)
      .get();

  if(!snap.exists){
    return 0;
  }

  return Number(
    snap.data().saldo || 0
  );
}

async function carregarLojasLojista(){

  if(!usuarioAtual) return;

  const select =
    $("pedidoLojaId");

  select.innerHTML = "";

  const snap =
    await db
      .collection("lojas")
      .where(
        "donoId",
        "==",
        usuarioAtual.uid
      )
      .get();

  const lojas =
    snap.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

  lojas.sort(
    (a,b) =>
      String(a.nomeLoja || "")
      .localeCompare(
        String(b.nomeLoja || "")
      )
  );


  if(lojas.length === 0){

    select.innerHTML =
      '<option value="">Cadastre uma loja</option>';

  }else{

    lojas.forEach(loja => {

      const option =
        document.createElement("option");

      option.value =
        loja.id;

      option.textContent =
        loja.nomeLoja || "Loja";

      select.appendChild(option);

    });
  }


  if(
    perfilAtual &&
    perfilAtual.tipoConta ===
    "super_lojista"
  ){

    $("areaSuperLojista")
      .classList.remove("oculto");

  }else{

    $("areaSuperLojista")
      .classList.add("oculto");
  }


  select.onchange =
    atualizarOrigemSelecionada;

  atualizarOrigemSelecionada();
}

async function buscarCoordenadasLoja(){

  const endereco =
    $("enderecoLoja")
      .value.trim();

  if(!endereco){

    mensagem(
      "msgLoja",
      "Digite o endereço.",
      true
    );

    return;
  }

  mensagem(
    "msgLoja",
    "Buscando coordenadas...",
    false
  );

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2&limit=1&q=" +
      encodeURIComponent(
        endereco + ", Macaé, RJ, Brasil"
      );

    const resposta =
      await fetch(url,{
        headers:{
          "Accept-Language":"pt-BR"
        }
      });

    const dados =
      await resposta.json();

    if(!dados.length){

      throw new Error(
        "Endereço não encontrado."
      );
    }

    $("latLoja").value =
      dados[0].lat;

    $("lngLoja").value =
      dados[0].lon;

    mensagem(
      "msgLoja",
      "Coordenadas encontradas.",
      false
    );

  }catch(error){

    mensagem(
      "msgLoja",
      "Não foi possível buscar automaticamente.\n\n" +
      "Você pode informar latitude e longitude manualmente.",
      true
    );
  }
}

  const nome =

  const endereco =
    $("enderecoLoja").value.trim();

  const lat =
    $("latLoja").value === ""
      ? null

  const lng =

  if(!nome || !endereco){

/* =========================================================
   GEOLOCALIZAÇÃO
========================================================= */

async function geocodificarEndereco(endereco){

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2&limit=1&q=" +
    encodeURIComponent(
      endereco + ", Macaé, RJ, Brasil"
    );

  const resposta =
    await fetch(url,{
      headers:{
        "Accept-Language":"pt-BR"
      }
    });

  const dados =
    await resposta.json();

  if(!dados.length){

    throw new Error(
      "Não foi possível localizar o endereço:\n" +
      endereco
    );
  }

  return {
    lat:Number(dados[0].lat),
    lng:Number(dados[0].lon)
  };
}


function distanciaKm(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1 *
      Math.PI / 180) *

    Math.cos(lat2 *
      Math.PI / 180) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


function velocidadeMedia(veiculo){

  if(veiculo === "moto")
    return 30;

  if(veiculo === "utilitario")
    return 25;

  if(veiculo === "caminhao")
    return 20;

  if(veiculo === "carreta")
    return 18;

  return 25;

      ),

function calcularValorEntrega(km){

  const base =
    Number(configTaxas.kmBase);

  const valorBase =
    Number(configTaxas.valorBase);

  const adicional =
    Number(configTaxas.valorAdicionalKm);

  if(km <= base){

    return valorBase;
  }

  return valorBase +
    ((km-base) * adicional);
}

async function criarPedido(){

  if(!usuarioAtual){

    mensagem(
      "mensagemPedido",
      "Faça login.",
      true
    );

    return;
  }


  const lojaId =
    $("pedidoLojaId").value;

  const cliente =
    $("pedidoCliente").value.trim();

  const telefone =
    $("pedidoTelefone").value.trim();

  const endereco =
    $("pedidoEndereco").value.trim();

  const tipo =
    $("pedidoTipo").value;

  const veiculo =
    $("pedidoVeiculo").value;

  const codigoMoto =
    normalizarCodigo(
      $("pedidoMotoboyCodigo").value
    );


  if(!lojaId){

    mensagem(
      "mensagemPedido",
      "Selecione a loja de origem.",
      true
    );

    return;
  }

  if(!cliente || !telefone || !endereco){

    mensagem(
      "mensagemPedido",
      "Preencha cliente, telefone e endereço.",
      true
    );

    return;
  }


  mensagem(
    "mensagemPedido",
    "Calculando distância e criando entrega...",
    false
  );


  try{

    await carregarConfigTaxas();


    const lojaSnap =
      await db
        .collection("lojas")
        .doc(lojaId)
        .get();

    if(!lojaSnap.exists){

      throw new Error(
        "Loja de origem não encontrada."
      );
    }

    const loja =
      lojaSnap.data();


    let origemLat =
      Number(loja.lat);

    let origemLng =
      Number(loja.lng);


    if(
      !Number.isFinite(origemLat) ||
      !Number.isFinite(origemLng)
    ){

      const origem =
        await geocodificarEndereco(
          loja.endereco
        );

      origemLat =
        origem.lat;

      origemLng =
        origem.lng;


      await db
        .collection("lojas")
        .doc(lojaId)
        .update({

          lat: origemLat,
          lng: origemLng

        });
    }


    const destino =
      await geocodificarEndereco(
        endereco
      );


    const km =
      distanciaKm(
        origemLat,
        origemLng,
        destino.lat,
        destino.lng
      );


    const kmFinal =
      Number(km.toFixed(2));


    const valorEntrega =
      Number(
        calcularValorEntrega(kmFinal)
          .toFixed(2)
      );


    const velocidade =
      velocidadeMedia(
        veiculo
      );


    const tempoMin =
      Math.max(
        1,
        Math.round(
          (kmFinal / velocidade) * 60
        )
      );


    const rastreio =
      geraRastreio();

    const codigoFinalizacao =
      gerarCodigo4();


    const numeroPedido =
      String(
        Date.now()
      ).slice(-4);


    const walletRef =
      db.collection("wallets")
        .doc(usuarioAtual.uid);


    const pedidoRef =
      db.collection("pedidos")
        .doc();


    await db.runTransaction(
      async transaction => {

        const walletSnap =
          await transaction.get(
            walletRef
          );

        const saldo =
          walletSnap.exists
            ? Number(
                walletSnap.data().saldo || 0
              )
            : 0;


        if(saldo < valorEntrega){

          throw new Error(
            "SALDO INSUFICIENTE.\n\n" +
            "Necessário: R$ " +
            dinheiro(valorEntrega) +
            "\nSaldo: R$ " +
            dinheiro(saldo)
          );
        }


        transaction.set(
          walletRef,
          {

            uid:usuarioAtual.uid,

            saldo:
              saldo - valorEntrega,

            atualizadoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          },
          {merge:true}
        );


        transaction.set(
          pedidoRef,
          {

            pedidoNumero:
              numeroPedido,

            lojistaId:
              usuarioAtual.uid,

            lojistaNome:
              perfilAtual.nome || "",

            tipoPedido:
              tipo,

            marca:
              tipo,

            lojaId:
              lojaId,

            lojaNome:
              loja.nomeLoja || "",

            origemEndereco:
              loja.endereco || "",

            origemLat:
              origemLat,

            origemLng:
              origemLng,

            clienteNome:
              cliente,

            telefoneCliente:
              telefone,

            enderecoEntrega:
              endereco,

            destinoLat:
              destino.lat,

            destinoLng:
              destino.lng,

            veiculo:
              veiculo,

            distanciaKm:
              kmFinal,

            tempoMin:
              tempoMin,

            valorEntrega:
              valorEntrega,

            valorTaxa:
              valorEntrega,

            taxaApp:
              Number(
                configTaxas.taxaApp || 0
              ),

            retornoPct:
              Number(
                configTaxas.retornoPct || 0
              ),

            superPct:
              Number(
                configTaxas.superPct || 0
              ),

            motoboyCodigo:
              codigoMoto,

            rastreio:
              rastreio,

            codigo4Digitos:
              codigoFinalizacao,

            status:
              "pendente",

            motoboyId:
              null,

            criadoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          }
        );


        const transacaoRef =
          db.collection("transactions")
            .doc();


        transaction.set(
          transacaoRef,
          {

            uid:
              usuarioAtual.uid,

            tipo:
              "taxa_pedido",

            valor:
              -valorEntrega,

            orderId:
              pedidoRef.id,

            status:
              "aprovado",

            criadoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          }
        );

      }
    );


    mensagem(
      "mensagemPedido",
      "ENTREGA CRIADA!\n\n" +
      "Pedido #" +
      numeroPedido +
      "\n" +
      "Rastreio do cliente: " +
      rastreio +
      "\n\n" +
      "Aguardando motoboy/motorista.",
      false
    );


    $("pedidoCliente").value = "";
    $("pedidoTelefone").value = "";
    $("pedidoEndereco").value = "";
    $("pedidoMotoboyCodigo").value = "";


    await atualizarSaldo();
    await carregarLojista();

  }catch(error){

    console.error(
      "ERRO PEDIDO:",
      error
    );

    mensagem(
      "mensagemPedido",
      "ERRO AO CRIAR ENTREGA.\n\n" +
      (error.message || error),
      true
    );
  }
}

        "lojistaId",

    pedidos.map(p => {

          <strong>

    pendente:
      "Aguardando motoboy",

    em_rota:
      "Motoboy a caminho",

    chegou_loja:
      "Chegou na loja",

    chegou_cliente:
      "Chegou no cliente",

    finalizado:
      "Finalizado",

    cancelado:
      "Cancelado"

  };

  return mapa[status] ||
    status ||
    "Aguardando";
}

async function alternarOnline(){

  if(
    !usuarioAtual ||
    !perfilAtual ||
    perfilAtual.tipo !== "motoboy"
  ){
    return;
  }


  const motoRef =
    db.collection("motoboys")
      .doc(usuarioAtual.uid);

    await motoRef.get();


  if(
    !snap.exists ||
    !snap.data().aprovado

  await db
    .collection("profiles")
    .doc(usuarioAtual.uid)
    .update({

  atualizarStatusVisual(
    novoStatus
  );

    snap.data().codigo
  );
}

/* =========================================================
   ACEITAR PEDIDO
========================================================= */

async function aceitarPedido(id){

  try{

    const motoSnap =
      await db
        .collection("motoboys")
        .doc(usuarioAtual.uid)
        .get();


    if(
      !motoSnap.exists ||
      !motoSnap.data().aprovado
    ){

      alert(
        "Motoboy ainda não aprovado."
      );

      return;
    }


    const meuCodigo =
      normalizarCodigo(
        motoSnap.data().codigo
      );


    const pedidoRef =
      db.collection("pedidos")
        .doc(id);


    await db.runTransaction(
      async transaction => {

        const pedidoSnap =
          await transaction.get(
            pedidoRef
          );


        if(!pedidoSnap.exists){

          throw new Error(
            "Entrega não encontrada."
          );
        }


        const p =
          pedidoSnap.data();


        if(p.status !== "pendente"){

          throw new Error(
            "Essa entrega já foi aceita por outro motorista."
          );
        }


        const destino =
          normalizarCodigo(
            p.motoboyCodigo
          );


        if(
          destino &&
          destino !== meuCodigo
        ){

          throw new Error(
            "Essa entrega foi direcionada para outro motorista."
          );
        }


        transaction.update(
          pedidoRef,
          {

            motoboyId:
              usuarioAtual.uid,

            motoboyCodigo:
              meuCodigo,

            status:
              "em_rota",

            aceitoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          }
        );
      }
    );


    alert(
      "Entrega aceita!"
    );


    await carregarMotoboy();

  }catch(error){

    alert(
      error.message || error
    );
  }
}

    $("listaAceitasMotoboy");

    await db
      .collection("pedidos")
      .where(
        "motoboyId",
        "==",
        usuarioAtual.uid
      )
      .get();


  if(snap.empty){

      "Nenhuma entrega.";

    return;
  }


  const lista =
    snap.docs.map(doc => ({
      id:doc.id,
      ...doc.data()
    }));


  lista.sort(
    (a,b) => {

      const aa =
        a.criadoEm
          ? a.criadoEm.toMillis()
          : 0;

      const bb =
        b.criadoEm
          ? b.criadoEm.toMillis()
          : 0;

      return bb-aa;

  );


  box.innerHTML =
    lista.map(p => `

            p.valorEntrega ||
            p.valorTaxa

          p.status !== "cancelado"
          ? `
            <button
              onclick="finalizarPedido('${p.id}')"
            >
              FINALIZAR ENTREGA
            </button>
          `
          : ""
        }

      </div>

    `).join("");
}


/* =========================================================
   FINALIZAR ENTREGA
========================================================= */

async function finalizarPedido(id){

  const codigo =
    prompt(
      "Digite o código de finalização de 4 dígitos:"
    );


  if(!codigo){
    return;
  }


  try{

    const pedidoRef =
      db.collection("pedidos")
        .doc(id);


    const adminSnap =
      await db
        .collection("profiles")
        .where(
          "tipo",
          "==",
          "admin"
        )
        .limit(1)
        .get();


    if(adminSnap.empty){

      throw new Error(
        "Nenhum administrador encontrado."
      );
    }


    const adminUid =
      adminSnap.docs[0].id;


    const configSnap =
      await db
        .collection("config_taxas")
        .doc("valores")
        .get();


    const cfg =
      configSnap.exists
        ? {
            ...configTaxas,
            ...configSnap.data()
          }
        : configTaxas;


    const motoWalletRef =
      db.collection("wallets")
        .doc(usuarioAtual.uid);


    const adminWalletRef =
      db.collection("wallets")
        .doc(adminUid);


    const retornoPct =
      Number(
        cfg.retornoPct || 0
      );


    const superPct =
      Number(
        cfg.superPct || 0
      );


    await db.runTransaction(
      async transaction => {

        const pedidoSnap =
          await transaction.get(
            pedidoRef
          );


        if(!pedidoSnap.exists){

          throw new Error(
            "Pedido não encontrado."
          );
        }


        const p =
          pedidoSnap.data();


        if(
          p.motoboyId !==
          usuarioAtual.uid
        ){

          throw new Error(
            "Essa entrega não pertence a você."
          );
        }


        if(p.status === "finalizado"){

          throw new Error(
            "Essa entrega já foi finalizada."
          );
        }


        if(
          String(
            p.codigo4Digitos
          ) !==
          String(codigo).trim()
        ){

          throw new Error(
            "Código de finalização incorreto."
          );
        }


        const valorEntrega =
          Number(
            p.valorEntrega ||
            p.valorTaxa ||
            0
          );


        const retornoValor =
          Number(
            (
              valorEntrega *
              retornoPct /
              100
            ).toFixed(2)
          );


        const superValor =
          Number(
            (
              valorEntrega *
              superPct /
              100
            ).toFixed(2)
          );


        const motoWalletSnap =
          await transaction.get(
            motoWalletRef
          );


        const adminWalletSnap =
          await transaction.get(
            adminWalletRef
          );


        const saldoMoto =
          motoWalletSnap.exists
            ? Number(
                motoWalletSnap.data().saldo || 0
              )
            : 0;


        const saldoAdmin =
          adminWalletSnap.exists
            ? Number(
                adminWalletSnap.data().saldo || 0
              )
            : 0;


        transaction.set(
          motoWalletRef,
          {

            uid:
              usuarioAtual.uid,

            saldo:
              saldoMoto + retornoValor,

            atualizadoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          },
          {merge:true}
        );


        transaction.set(
          adminWalletRef,
          {

            uid:
              adminUid,

            saldo:
              saldoAdmin + superValor,

            atualizadoEm:
              firebase.firestore.FieldValue.serverTimestamp()

          },
          {merge:true}
        );


        transaction.update(
          pedidoRef,
          {

            status:
              "finalizado",

            finalizadoEm:
              firebase.firestore.FieldValue.serverTimestamp(),

            retornoPct:
              retornoPct,

            retornoValor:
              retornoValor,

            superPct:
              superPct,

            superValor:
              superValor

          }
        );


        if(retornoValor > 0){

          const transacaoMoto =
            db.collection("transactions")
              .doc();

          transaction.set(
            transacaoMoto,
            {

              uid:
                usuarioAtual.uid,

              tipo:
                "retorno_motoboy",

              valor:
                retornoValor,

              orderId:
                id,

              status:
                "aprovado",

              criadoEm:
                firebase.firestore.FieldValue.serverTimestamp()

            }
          );
        }


        if(superValor > 0){

          const transacaoAdmin =
            db.collection("transactions")
              .doc();

          transaction.set(
            transacaoAdmin,
            {

              uid:
                adminUid,

              tipo:
                "super_admin",

              valor:
                superValor,

              orderId:
                id,

              status:
                "aprovado",

              criadoEm:
                firebase.firestore.FieldValue.serverTimestamp()

            }
          );
        }

      }
    );


    alert(
      "ENTREGA FINALIZADA!\n\n" +
      "Retorno para motoboy: R$ " +
      dinheiro(
        Number(
          configTaxas.retornoPct || 0
        ) *
        Number(0)
      )
    );


    await carregarMotoboy();

  }catch(error){

    alert(
      "ERRO AO FINALIZAR:\n\n" +
      (error.message || error)
    );
  }
}

async function sacarMotoboy(){

  const saldo =
    await obterSaldo(
      usuarioAtual.uid
    );


  if(saldo <= 0){

    alert(
      "Sua carteira não possui saldo para saque."
    );

    return;
  }


  const valorTexto =
    prompt(
      "Valor do saque:",
      saldo.toFixed(2)
    );


  const valor =
    Number(valorTexto);


  if(
    !valor ||
    valor <= 0 ||
    valor > saldo
  ){

    alert(
      "Valor de saque inválido."
    );

    return;
  }


  const pix =
    $("pixMotoboy")
      .value.trim();


  if(!pix){

    alert(
      "Cadastre sua chave PIX primeiro."
    );

    return;
  }


  await db
    .collection("saques")
    .add({

      uid:
        usuarioAtual.uid,

      nome:
        perfilAtual.nome || "",

      valor:
        valor,

      pix:
        pix,

      status:
        "pendente",

      criadoEm:
        firebase.firestore.FieldValue.serverTimestamp()

    });


  alert(
    "Solicitação de saque enviada ao administrador."
  );
}

/* =========================================================
   RESUMO ADMIN
========================================================= */

async function carregarResumoAdmin(){

  const snap =
    await db
      .collection("transactions")
      .get();


  let receitas = 0;
  let pagamentos = 0;


  snap.forEach(doc => {

    const t =
      doc.data();

    const valor =
      Number(t.valor || 0);


    if(
      t.tipo ===
      "taxa_pedido"
    ){

      receitas +=
        Math.abs(valor);
    }


    if(
      t.tipo ===
      "pagamento_motoboy"
    ){

      pagamentos +=
        Math.abs(valor);
    }

  });


  $("adminReceitas").innerText =
    dinheiro(receitas);

  $("adminPagamentos").innerText =
    dinheiro(pagamentos);

  $("adminLucro").innerText =
    dinheiro(
      receitas - pagamentos
    );
}

async function aprovarMotoboy(uid){

  if(
    !perfilAtual ||
    perfilAtual.tipo !== "admin"
  ){

    alert(
      "Somente admin."
    );

    return;
  }


  const motoRef =
    db.collection("motoboys")
      .doc(uid);


  const snap =
    await motoRef.get();


  if(!snap.exists){

    alert(
      "Motoboy não encontrado."
    );

    return;
  }


  const moto =
    snap.data();


  await motoRef.update({

    aprovado:true,

    aprovadoEm:
      firebase.firestore.FieldValue.serverTimestamp(),

    aprovadoPor:
      usuarioAtual.uid

  });


  await db
    .collection("profiles")
    .doc(uid)
    .update({

      aprovado:true,

      motoboyCodigo:
        moto.codigo || ""

    });


  alert(
    "Motoboy " +
    (moto.codigo || "") +
    " aprovado."
  );


  await carregarAdminMotoboys();
}

async function aprovarRecarga(id){

  const ref =
    db.collection("recargas")
      .doc(id);


  const snap =
    await ref.get();


  if(!snap.exists) return;


  const r =
    snap.data();


  const walletRef =
    db.collection("wallets")
      .doc(r.uid);


  await db.runTransaction(
    async transaction => {

      const walletSnap =
        await transaction.get(
          walletRef
        );


      const saldo =
        walletSnap.exists
          ? Number(
              walletSnap.data().saldo || 0
            )
          : 0;


      transaction.set(
        walletRef,
        {

          uid:r.uid,

          saldo:
            saldo + Number(r.valor || 0),

          atualizadoEm:
            firebase.firestore.FieldValue.serverTimestamp()

        },
        {merge:true}
      );


      transaction.update(
        ref,
        {

          status:
            "aprovado",

          aprovadoEm:
            firebase.firestore.FieldValue.serverTimestamp(),

          aprovadoPor:
            usuarioAtual.uid

        }
      );


      const tr =
        db.collection("transactions")
          .doc();


      transaction.set(
        tr,
        {

          uid:r.uid,

          tipo:
            "recarga",

          valor:
            Number(r.valor || 0),

          status:
            "aprovado",

          criadoEm:
            firebase.firestore.FieldValue.serverTimestamp()

        }
      );

    }
  );


  alert(
    "Recarga aprovada."
  );


  await carregarAdminRecargas();
}

/* =========================================================
   EXTRATO 90 DIAS
========================================================= */

async function carregarExtrato(
  elementoId,
  uid
){

  const box =
    $(elementoId);

  if(!box) return;


  const limite =
    new Date(
      Date.now() -
      90 * 24 * 60 * 60 * 1000
    );


  const snap =
    await db
      .collection("transactions")
      .where(
        "uid",
        "==",
        uid
      )
      .get();


  const lista =
    snap.docs
      .map(doc => ({
        id:doc.id,
        ...doc.data()
      }))
      .filter(t => {

        if(!t.criadoEm)
          return true;

        return (
          t.criadoEm.toDate() >=
          limite
        );
      });


  lista.sort(
    (a,b) => {

      const aa =
        a.criadoEm
          ? a.criadoEm.toMillis()
          : 0;

      const bb =
        b.criadoEm
          ? b.criadoEm.toMillis()
          : 0;

      return bb-aa;
    }
  );


  if(!lista.length){

    box.innerText =
      "Nenhuma movimentação nos últimos 90 dias.";

    return;
  }


  box.innerHTML = `

    <div class="tabela">

      <table>

        <thead>

          <tr>

            <th>Data</th>

            <th>Tipo</th>

            <th>Valor</th>

            <th>Status</th>

          </tr>

        </thead>

        <tbody>

          ${
            lista.map(t => `

              <tr>

                <td>
                  ${
                    t.criadoEm
                      ? t.criadoEm
                          .toDate()
                          .toLocaleString("pt-BR")
                      : "-"
                  }
                </td>

                <td>
                  ${t.tipo || ""}
                </td>

                <td>
                  R$ ${dinheiro(t.valor)}
                </td>

                <td>
                  ${t.status || ""}
                </td>

              </tr>

            `).join("")
          }

        </tbody>

      </table>

    </div>

  `;
}


/* =========================================================
   INÍCIO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    atualizarCamposCadastro();

  }
);

</script>
