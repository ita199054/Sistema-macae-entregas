<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anjos V8 - Corrige Endereço + Saldo 0 + Retorno Super</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700&display=swap');
body{font-family:'Inter';max-width:480px;margin:0 auto;background:#0e0e0e;color:#fff}
.bg-stripe{background:repeating-linear-gradient(45deg,#000,#000 18px,#FFD700 18px,#FFD700 36px);height:10px}
.top{position:sticky;top:0;background:#000;color:#FFD700;padding:12px;border:3px solid #FFD700;z-index:9;display:flex;justify-content:space-between}
.card{background:#1e1e1e;border:3px solid #FFD700;padding:12px;margin:10px;box-shadow:5px 5px 0 #FFD700}
.card-w{background:#fff;color:#000;border:3px solid #000;padding:12px;margin:10px;box-shadow:5px 5px 0 #000}
input,select{width:100%;padding:12px;margin-top:6px;border:2px solid #FFD700;background:#000;color:#FFD700;font-weight:bold;box-sizing:border-box}
button{padding:12px;width:100%;border:3px solid #000;font-family:'Anton';font-size:15px;margin-top:6px;box-shadow:4px 4px 0 #000}
.b-black{background:#000;color:#FFD700;border-color:#FFD700}.b-gold{background:#FFD700;color:#000}.b-green{background:#00ff88;color:#000}.b-red{background:#ff0033;color:#fff}.b-gray{background:#333;color:#fff}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.v-card{background:#fff;color:#000;border:3px solid #000;padding:8px;text-align:center;font-weight:900;font-size:11px}.v-card.active{background:#FFD700}
.flex{display:flex;justify-content:space-between;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="bg-stripe"></div>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",
  authDomain: "anjos-flash.firebaseapp.com",
  projectId: "anjos-flash",
  storageBucket: "anjos-flash.firebasestorage.app",
  messagingSenderId: "725133182752",
  appId: "1:725133182752:web:5f9a98fa97269dcdcab945",
  measurementId: "G-9CSJXXNR0C"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();
let tela="inicio", user=null, perfil=null;
let config={base:10, kmBase:5, valorKm:2, motoBase:7.5, motoKm:1.5, valorSuper:5, retornoPorc:50, valorExpress:8, bairros:{"centro":0,"imbetiba":3,"cavaleiros":5,"cavalheiros":5,"barra":6,"lagomar":8,"aeroporto":7,"malvinas":7,"parque aeroporto":7,"atlantica":5}, utilitarioBase:25, utilitarioKm:3, caminhaoBase:60, caminhaoKm:5, carretaBase:120, carretaKm:8};
let lojas=[], motoboys=[], entregas=[];
function genCode(){return Math.floor(1000+Math.random()*9000).toString();}
function calc(km,tipo,veiculo,bairro){
  let k=Number(km)||0; let extraB=config.bairros[(bairro||"").toLowerCase().trim()]||0;
  if((bairro||"").toLowerCase().includes("atlantica")) extraB=config.bairros["atlantica"]||5;
  if((bairro||"").toLowerCase().includes("cavalheiros")||(bairro||"").toLowerCase().includes("cavaleiros")) extraB=config.bairros["cavaleiros"];
  let paga=config.base+(k>config.kmBase?(k-config.kmBase)*config.valorKm:0)+extraB; let moto=config.motoBase+(k>config.kmBase?(k-config.kmBase)*config.motoKm:0);
  if(veiculo==="utilitario"){paga=config.utilitarioBase+(k>config.kmBase?(k-config.kmBase)*config.utilitarioKm:0)+extraB; moto=paga*0.75;}
  if(veiculo==="caminhao"){paga=config.caminhaoBase+(k>config.kmBase?(k-config.kmBase)*config.caminhaoKm:0)+extraB; moto=paga*0.75;}
  if(veiculo==="carreta"){paga=config.carretaBase+(k>config.kmBase?(k-config.kmBase)*config.carretaKm:0)+extraB; moto=paga*0.75;}
  if(tipo==="super") paga+=config.valorSuper;
  if(tipo==="retorno") paga=paga*config.retornoPorc/100;
  if(tipo==="express") paga+=config.valorExpress;
  return {paga:+paga.toFixed(2), moto:+moto.toFixed(2), extraB, tempo:Math.round(k*3+6), km:k};
}
auth.onAuthStateChanged(async u=>{user=u; if(u){let d=await db.collection("usuarios").doc(u.uid).get(); perfil=d.exists?{id:d.id,...d.data()}:null; tela=perfil?.tipo||"inicio";}else{tela="inicio";perfil=null;} render();});
let files={cnh:null,crlv:null,selfie:null,comp:null};
function render(){
  let h="";
  if(tela==="inicio"){
    h=`<div class="top"><b>⚡ ANJOS V8</b><small>FIX ENDEREÇO</small></div><div class="bg-stripe"></div>
    <div class="card"><input id="email" placeholder="EMAIL"><input id="senha" type="password" placeholder="SENHA"><button class="b-black" onclick="login()">ENTRAR</button>
    <button class="b-gray" onclick="tela='cad_lojista';render()">🏪 Lojista - Saldo 0,00</button><button class="b-gray" onclick="tela='cad_super';render()">🏪🏪 Super - Saldo 0,00</button>
    <button style="background:#fff;color:#000" onclick="tela='cad_motoboy';render()">🚚 Motorista #0001 Saldo 0,00</button><button class="b-gold" onclick="tela='login_franquia';render()">🏢 Admin</button></div>`;
  }
  else if(tela==="lojista"||tela==="lojista_super"){
    let isSuper=tela==="lojista_super"; let minhas=lojas.filter(l=>l.ownerId===user.uid); let lojaId=document.getElementById("lojaSel")?.value||(minhas[0]?.id||""); let loja=lojas.find(l=>l.id===lojaId)||minhas[0];
    if(!loja){h=`<div class="card">Carregando loja...</div>`; document.getElementById("app").innerHTML=h; return;}
    let saldo=loja.saldo||0; // SEMPRE 0,00 INICIAL
    let kmVal=document.getElementById("km")?.value||3; let bairroVal=document.getElementById("bairroEnt")?.value||"cavaleiros"; let veiculoSel=document.getElementById("veiculo")?.value||"moto"; let tipoSel=document.querySelector('input[name="tipo"]:checked')?.value||"normal"; let c=calc(kmVal,tipoSel,veiculoSel,bairroVal);
    let endLojaEdit=document.getElementById("editEnderecoLoja")?.value||loja.endereco||"Avenida Atlantica 2720 Cavaleiros Macaé RJ";
    h=`<div class="top"><div><b>${loja.nome}</b><br><small style="color:#fff">Saldo R$${saldo.toFixed(2)} | Motoboy não vê</small></div><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="bg-stripe"></div>
    <div class="card" style="border-color:#00ff88"><h4 style="color:#00ff88;font-family:Anton;margin:0">✏️ MEU ENDEREÇO - EDITÁVEL</h4>
    <input id="editEnderecoLoja" value="${loja.endereco||''}" placeholder="Av Atlântica 2720 Cavaleiros Macaé">
    <button class="b-green" onclick="salvarEndereco('${loja.id}')">SALVAR MEU ENDEREÇO</button>
    <small style="color:#888">Isso corrige erro 'não existe' - use endereço curto</small></div>
    <div class="card-w"><h3 style="font-family:Anton;margin:0">📦 NOVA ENTREGA</h3>
    <input id="end" placeholder="Endereço cliente *" value="Rua cliente 123">
    <input id="bairroEnt" list="bairrosList" placeholder="Bairro *" value="${bairroVal}" oninput="render()"><datalist id="bairrosList">${Object.keys(config.bairros).map(b=>`<option value="${b}">`).join('')}</datalist>
    <input id="km" type="number" value="${kmVal}" oninput="render()" placeholder="KM">
    <a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(endLojaEdit)}&destination=${encodeURIComponent(document.getElementById('end')?.value||''+','+bairroVal)}" target="_blank" style="font-size:11px;color:#000;font-weight:900;display:block;margin:6px 0">🗺️ VER MAPA: ${endLojaEdit} → cliente</a>
    <div class="v-grid"><div class="v-card ${veiculoSel==='moto'?'active':''}" onclick="setVeic('moto')">🏍️ MOTO<br>R$${calc(kmVal,tipoSel,'moto',bairroVal).paga}</div><div class="v-card ${veiculoSel==='utilitario'?'active':''}" onclick="setVeic('utilitario')">🚐 UTIL<br>R$${calc(kmVal,tipoSel,'utilitario',bairroVal).paga}</div><div class="v-card ${veiculoSel==='caminhao'?'active':''}" onclick="setVeic('caminhao')">🚚 CAMINHÃO</div><div class="v-card ${veiculoSel==='carreta'?'active':''}" onclick="setVeic('carreta')">🚛 CARRETA</div></div><select id="veiculo" style="display:none"><option value="moto">moto</option><option value="utilitario">utilitario</option><option value="caminhao">caminhao</option><option value="carreta">carreta</option></select>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px"><label style="background:#000;color:#FFD700;padding:6px;border:1px solid #FFD700"><input type="radio" name="tipo" value="normal" ${tipoSel==='normal'?'checked':''} onchange="render()"> NORMAL</label><label style="background:#000;color:#FFD700;padding:6px;border:1px solid #FFD700"><input type="radio" name="tipo" value="super" ${tipoSel==='super'?'checked':''} onchange="render()"> SUPER +R$${config.valorSuper}</label><label style="background:#fff;color:#000;padding:6px;border:2px solid #000"><input type="radio" name="tipo" value="retorno" ${tipoSel==='retorno'?'checked':''} onchange="render()"> RETORNO 50%</label><label style="background:#fff;color:#000;padding:6px;border:2px solid #000"><input type="radio" name="tipo" value="express" ${tipoSel==='express'?'checked':''} onchange="render()"> EXPRESS +R$${config.valorExpress}</label></div>
    <div style="background:#000;color:#FFD700;padding:10px;text-align:center;font-family:Anton;margin-top:8px">VOCÊ PAGA R$${c.paga}<br><small style="font-family:Inter;font-size:9px;color:#fff">Base + KM + Bairro +R$${c.extraB} [${veiculoSel}] [${tipoSel.toUpperCase()}] Motoboy não vê seu custo</small></div>
    <input id="motoboyNum" placeholder="#0001 direcionar (opcional)"><button class="b-black" onclick="criarEntrega()">CRIAR + CÓDIGO 4 DÍGITOS</button></div>`;
  }
  else if(tela==="cad_lojista"||tela==="cad_super"){
    let isSuper=tela==="cad_super";
    h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><h3 style="font-family:Anton;color:#FFD700">${isSuper?'SUPER':'LOJISTA'} - SALDO 0,00</h3><input id="nome" placeholder="Nome loja"><input id="dono" placeholder="Dono"><input id="tel" placeholder="WhatsApp"><input id="endereco" placeholder="Av Atlântica 2720, Cavaleiros, Macaé - RJ (editável depois)"><input id="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button class="b-black" onclick="cadastrarLojista(${isSuper})">CADASTRAR COM SALDO 0,00</button></div>`;
  }
  else if(tela==="cad_motoboy"){h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><h3 style="font-family:Anton;color:#FFD700">MOTORISTA - SALDO 0,00</h3><select id="tipoVeiculo"><option value="moto">🏍️ Moto</option><option value="utilitario">🚐 Utilitário</option><option value="caminhao">🚚 Caminhão</option><option value="carreta">🚛 Carreta</option></select><input id="nome" placeholder="Nome *"><input id="tel" placeholder="Tel *"><input id="cpf" placeholder="CPF *"><input id="placa" placeholder="Placa *"><input id="email" placeholder="Email *"><input id="senha" type="password" placeholder="Senha *"><label style="color:#FFD700;font-size:11px">CNH *</label><input type="file" accept="image/*,.pdf" onchange="files.cnh=this.files[0]"><label style="color:#FFD700;font-size:11px">CRLV *</label><input type="file" accept="image/*,.pdf" onchange="files.crlv=this.files[0]"><label style="color:#FFD700;font-size:11px">Selfie *</label><input type="file" accept="image/*" onchange="files.selfie=this.files[0]"><label style="color:#FFD700;font-size:11px">Comp *</label><input type="file" accept="image/*,.pdf" onchange="files.comp=this.files[0]"><button class="b-black" onclick="cadastrarMotoboy()">CADASTRAR SALDO 0,00</button></div>`;}
  else if(tela==="login_franquia"){h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><input id="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button class="b-black" onclick="login()">ENTRAR</button></div>`;}
  else if(tela==="motoboy"){
    let disp=entregas.filter(e=>e.status==='pendente');
    h=`<div class="top"><div>#${perfil.numero} ${perfil.nome}<br><small style="color:#fff">Saldo R$${(perfil.saldo||0).toFixed(2)} - Inicia 0,00</small></div><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="bg-stripe"></div><div class="card"><h3 style="color:#FFD700;font-family:Anton">CORRIDAS</h3>${disp.map(e=>`<div style="background:#fff;color:#000;padding:8px;margin-bottom:6px;border:3px solid #000"><b>${e.lojaNome} [${e.veiculo}] ${e.bairro}</b><br>${e.endereco}<br>💰 R$${e.moto}<br><button class="b-green" onclick="aceitar('${e.id}')">ACEITAR</button></div>`).join('')||'Nenhuma'}</div>`;
  }
  else{h=`<div class="top"><b>ADMIN</b><button onclick="auth.signOut()" style="width:auto">Sair</button></div><div class="card"><h3>Bairros +X</h3>${Object.entries(config.bairros).map(([b,v])=>`${b} +R$${v}`).join('<br>')}</div>`;}
  document.getElementById("app").innerHTML=h;
  let sel=document.getElementById("veiculo"); if(sel){sel.value=localStorage.getItem("veic")||"moto";}
}
function setVeic(v){localStorage.setItem("veic",v); document.getElementById("veiculo").value=v; render();}
async function salvarEndereco(id){let novo=document.getElementById("editEnderecoLoja").value; if(!novo) return alert("Digite endereço"); await db.collection("lojistas").doc(id).update({endereco:novo}); alert("Endereço salvo: "+novo); render();}
async function login(){try{await auth.signInWithEmailAndPassword(document.getElementById("email").value,document.getElementById("senha").value);}catch(e){alert(e.message)}}
async function cadastrarLojista(isSuper){let n=document.getElementById("nome").value,d=document.getElementById("dono").value||n,t=document.getElementById("tel").value,en=document.getElementById("endereco").value||"Av Atlântica 2720 Cavaleiros Macaé",em=document.getElementById("email").value,s=document.getElementById("senha").value;let c=await auth.createUserWithEmailAndPassword(em,s);await db.collection("usuarios").doc(c.user.uid).set({nome:n,dono:d,tipo:isSuper?"lojista_super":"lojista",email:em,saldo:0});await db.collection("lojistas").doc(c.user.uid).set({nome:n,dono:d,tel:t,endereco:en,email:em,tipo:isSuper?"lojista_super":"lojista",ownerId:c.user.uid,saldo:0});}
async function cadastrarMotoboy(){let n=document.getElementById("nome").value,t=document.getElementById("tel").value,em=document.getElementById("email").value,s=document.getElementById("senha").value,cpf=document.getElementById("cpf").value,placa=document.getElementById("placa").value,tipoVeiculo=document.getElementById("tipoVeiculo").value;if(!files.cnh||!files.crlv||!files.selfie||!files.comp) return alert("Envie todos docs");let c=await auth.createUserWithEmailAndPassword(em,s);let num=("000"+(motoboys.length+1)).slice(-4);async function up(f,p){let r=storage.ref().child(p);await r.put(f);return await r.getDownloadURL();}let cnhUrl=await up(files.cnh,`docs/${c.user.uid}/cnh`),crlvUrl=await up(files.crlv,`docs/${c.user.uid}/crlv`),selfieUrl=await up(files.selfie,`docs/${c.user.uid}/selfie`),compUrl=await up(files.comp,`docs/${c.user.uid}/comp`);await db.collection("usuarios").doc(c.user.uid).set({nome:n,tipo:"motoboy",tipoVeiculo,numero:num,email:em,saldo:0});await db.collection("motoboys").doc(c.user.uid).set({nome:n,tel:t,email:em,numero:num,cpf,placa,tipoVeiculo,cnhUrl,crlvUrl,selfieUrl,compUrl,tipo:"motoboy",saldo:0});alert("#"+num+" saldo 0,00 OK");}
async function criarEntrega(){let end=document.getElementById("end").value,bairro=document.getElementById("bairroEnt").value,km=document.getElementById("km").value,tipo=document.querySelector('input[name="tipo"]:checked')?.value||"normal",dest=document.getElementById("motoboyNum").value,veiculo=document.getElementById("veiculo").value||"moto";let c=calc(km,tipo,veiculo,bairro);let loja=lojas.find(l=>l.ownerId===user.uid);let codigo=genCode();await db.collection("entregas").add({endereco:end,bairro,extraB:c.extraB,km:Number(km),tempo:c.tempo,paga:c.paga,moto:c.moto,tipo,veiculo,status:"pendente",codigo,lojaId:loja?.id||user.uid,lojaNome:loja?.nome||perfil.nome,lojaEndereco:loja?.endereco||"",motoboyDestino:dest?dest.replace("#",""):"",criadoAt:new Date()});}
async function aceitar(id){await db.collection("entregas").doc(id).update({status:"aceita",motoboyId:user.uid,motoboyNome:perfil.nome,motoboyNumero:perfil.numero});}
db.collection("config").doc("geral").onSnapshot(d=>{if(d.exists){config={...config,...d.data()};render();}});
db.collection("lojistas").onSnapshot(s=>{lojas=s.docs.map(d=>({id:d.id,...d.data()}));render();});
db.collection("motoboys").onSnapshot(s=>{motoboys=s.docs.map(d=>({id:d.id,...d.data()}));render();});
db.collection("entregas").onSnapshot(s=>{entregas=s.docs.map(d=>({id:d.id,...d.data()}));render();});
render();
</script>
</body>
</html>
