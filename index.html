<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#111;border:2px solid #D4AF37;padding:24px;border-radius:16px;width:90%;max-width:400px}
h1{color:#D4AF37;text-align:center;margin:0 0 16px}
input,select{width:100%;padding:14px;margin:8px 0;background:#222;color:#fff;border:1px solid #333;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin-top:8px;cursor:pointer}
.gold{background:#D4AF37;color:#000}
.dark{background:#222;color:#D4AF37;border:1px solid #D4AF37}
#msg{color:#ffcc00;margin-top:12px;text-align:center;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h1>👑 ANJOS FLASH</h1>
<input id="email" type="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">
<select id="tipo"><option value="lojista">🏪 Lojista</option><option value="motorista">🏍️ Motorista</option><option value="admin">👑 Admin</option></select>
<button class="gold" onclick="entrar()">ENTRAR</button>
<button class="dark" onclick="cadastrar()">CADASTRAR</button>
<div id="msg">Pronto - Vercel OK</div>
<div style="margin-top:12px;text-align:center"><a href="lojista.html" style="color:#D4AF37">Lojista</a> | <a href="motoboy.html" style="color:#D4AF37">Motoboy</a> | <a href="Admin.html" style="color:#D4AF37">Admin</a></div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain:"anjos-flash.firebaseapp.com",projectId:"anjos-flash",storageBucket:"anjos-flash.firebasestorage.app",messagingSenderId:"725133182752",appId:"1:725133182752:web:5f9a98fa97269dcdcab945"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(); const db=firebase.firestore();
function mostrar(t){document.getElementById("msg").innerText=t;}
async function entrar(){
  const e=document.getElementById("email").value.trim(); const s=document.getElementById("senha").value;
  if(!e||!s) return mostrar("Digite email e senha");
  try{ mostrar("Entrando..."); const cred=await auth.signInWithEmailAndPassword(e,s); const snap=await db.collection("usuarios").doc(cred.user.uid).get();
    if(!snap.exists){mostrar("Sem perfil, clique Cadastrar"); return;}
    const u=snap.data(); if(u.role==="lojista") location.href="lojista.html"; else if(u.role==="motorista") location.href="motoboy.html"; else location.href="Admin.html";
  }catch(err){mostrar(err.message);}
}
async function cadastrar(){
  const e=document.getElementById("email").value.trim(); const s=document.getElementById("senha").value; const tipo=document.getElementById("tipo").value;
  if(!e||!s) return mostrar("Digite email e senha");
  try{ mostrar("Cadastrando..."); const cred=await auth.createUserWithEmailAndPassword(e,s);
    await db.collection("usuarios").doc(cred.user.uid).set({email:e,role:tipo,nome:e.split("@")[0],saldo:tipo==="lojista"?70:0,aprovado:tipo==="motorista"?false:true,veiculo:tipo==="motorista"?"moto":null,codigoMotorista:tipo==="motorista"?"M"+Math.floor(1000+Math.random()*9000):null,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});
    mostrar("Cadastrado! Entrando..."); setTimeout(entrar,1000);
  }catch(err){mostrar(err.message);}
}
</script>
</body>
</html>
