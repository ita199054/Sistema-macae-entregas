<!-- ADICIONA ISSO NO HTML DO PAINEL ADMIN / SUPORTE / FRANQUEADO -->
<!-- Onde fica o campo de recarga -->
<div id="boxDinamica" class="hidden border-2 border-yellow-400 bg-yellow-50 p-3 rounded-xl mb-3">
  <div class="flex justify-between items-center">
    <div>
      <b class="text-sm">⚡ TARIFA DINÂMICA</b>
      <p id="statusDinamicaTxt" class="text-[11px]">Carregando...</p>
    </div>
    <button id="btnDinamica" onclick="toggleDinamica()" class="px-4 py-2 rounded-full font-bold text-sm text-white">LIGAR</button>
  </div>
  <div class="mt-2 flex gap-2">
    <input id="valorDinamicaInput" type="number" placeholder="Ex: 5.00 valor extra" class="border p-2 rounded w-full text-sm">
    <button onclick="salvarValorDinamica()" class="bg-black text-white px-3 rounded text-xs">SALVAR</button>
  </div>
</div>

<script>
// --- FIX RECARGA COM E-MAIL (NÃO DÁ MAIS ERRO) ---
window.recarregarLojista = async () => {
  let emailDigitado = document.getElementById("emailRecarga").value.trim().toLowerCase();
  let valor = parseFloat(document.getElementById("valorRecarga").value);
  if(!emailDigitado ||!valor) return alert("Digite e-mail e valor");

  try {
    let refEmail = doc(db, "usuarios", emailDigitado);
    let snapEmail = await getDoc(refEmail);
    let dados = null;
    let uidReal = null;

    if (snapEmail.exists()) {
      dados = snapEmail.data();
      uidReal = dados.userId;
    } else {
      const q = query(collection(db, "usuarios"), where("email", "==", emailDigitado));
      const res = await getDocs(q);
      if (res.empty) return alert("❌ E-mail não encontrado: " + emailDigitado + "\nDigite igual tá no Firebase em minúsculo");
      dados = res.docs[0].data();
      uidReal = dados.userId || res.docs[0].id;
    }

    const novoSaldo = (dados.saldo || 0) + valor;

    // Atualiza nos 2 lugares pra não voltar pra 00,00
    await setDoc(doc(db, "usuarios", emailDigitado), { saldo: novoSaldo }, { merge: true });
    if (uidReal) await setDoc(doc(db, "usuarios", uidReal), { saldo: novoSaldo }, { merge: true });
    try { await setDoc(doc(db, "lojas", uidReal), { saldo: novoSaldo }, { merge: true }); } catch(e){}

    alert(`✅ R$ ${valor.toFixed(2)} para ${dados.nome || emailDigitado}\nSaldo: R$ ${novoSaldo.toFixed(2)}`);
    document.getElementById("emailRecarga").value = "";
    document.getElementById("valorRecarga").value = "";
  } catch (e) {
    alert("Erro recarga: " + e.message);
  }
};

// --- FIX LISTA PENDENTES NÃO DUPLICAR MAIS ---
async function carregarPendentes(){
  onSnapshot(collection(db,"usuarios"), snap=>{
    let vistos = new Map();
    let h = "";
    snap.forEach(d=>{
      const u = d.data();
      if(u.status!=="PENDENTE") return;
      const chave = u.userId || u.email;
      if(vistos.has(chave)) return;
      vistos.set(chave, true);
      h+=`<div class="border-2 bg-white p-2 rounded mb-2">
        <b>${u.nome} ${u.codigo||''}</b> - ${u.role}<br>
        <span class="text-[11px]">${u.email}</span><br>
        <button onclick="aprovarUsuario('${d.id}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs mt-1 font-bold">✅ APROVAR</button>
        <button onclick="reprovarUsuario('${d.id}')" class="bg-red-600 text-white px-3 py-1 rounded text-xs mt-1">❌</button>
      </div>`;
    });
    document.getElementById("listaPendentesAprovacao").innerHTML = h || "Nenhum pendente";
  });
}

// --- NOVO: BOTÃO LIGA / DESLIGA DINÂMICA (SÓ ADMIN / SUPORTE / FRANQUEADO) ---
let dinamicaLigada = false;

async function carregarDinamica(){
  onSnapshot(doc(db,"config","sistema"), (snap)=>{
    if(!snap.exists()){
      dinamicaLigada = false;
      atualizarBotaoDinamica();
      return;
    }
    const c = snap.data();
    dinamicaLigada = c.dinamicaLigada || false;
    if(document.getElementById("valorDinamicaInput")) document.getElementById("valorDinamicaInput").value = c.valorDinamica || "";
    atualizarBotaoDinamica();
  });
}

function atualizarBotaoDinamica(){
  const btn = document.getElementById("btnDinamica");
  const txt = document.getElementById("statusDinamicaTxt");
  if(!btn) return;
  if(dinamicaLigada){
    btn.textContent = "🟢 LIGADA - CLIQUE P/ DESLIGAR";
    btn.className = "px-4 py-2 rounded-full font-bold text-sm text-white bg-green-600";
    txt.textContent = "Dinâmica LIGADA: Lojista paga taxa extra";
    txt.className = "text-[11px] text-green-700 font-bold";
  } else {
    btn.textContent = "🔴 DESLIGADA - CLIQUE P/ LIGAR";
    btn.className = "px-4 py-2 rounded-full font-bold text-sm text-white bg-red-600";
    txt.textContent = "Dinâmica DESLIGADA: Preço normal";
    txt.className = "text-[11px] text-red-700 font-bold";
  }
}

window.toggleDinamica = async ()=>{
  const novo =!dinamicaLigada;
  await setDoc(doc(db,"config","sistema"), { dinamicaLigada: novo }, { merge:true });
};

window.salvarValorDinamica = async ()=>{
  const v = parseFloat(document.getElementById("valorDinamicaInput").value);
  if(isNaN(v)) return alert("Digite valor");
  await setDoc(doc(db,"config","sistema"), { valorDinamica: v }, { merge:true });
  alert("Valor dinâmica salvo: R$ " + v.toFixed(2));
};

// CHAMA ISSO DENTRO DO onAuthStateChanged QUANDO LOGAR
// Mostra o box só pra quem pode
function mostrarBoxDinamicaPorRole(role){
  const box = document.getElementById("boxDinamica");
  if(!box) return;
  if(["ADMIN","SUPORTE","FRANQUEADO"].includes(role)){
    box.classList.remove("hidden");
    carregarDinamica();
  } else {
    box.classList.add("hidden");
  }
}
</script>
