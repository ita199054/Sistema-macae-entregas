<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macaé Entregas</title>
<style>body{font-family:Arial;padding:15px;background:#f5f5f5}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:15px;background:black;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:10px}</style>
</head><body><div class="card">
<h2>📦 Nova Entrega</h2>
<input id="origem" placeholder="Origem (loja)">
<input id="destino" placeholder="Destino (cliente)">
<label><input type="checkbox" id="ret"> ↩️ Retorno R$2 fixo motoboy</label><br>
<label><input type="checkbox" id="sub"> 🏢 Subir</label>
<p>Lojista: R$ <span id="vl">8.00</span> | Motoboy vê: R$ <span id="vm">5.00</span></p>
<button onclick="a()">Calcular</button>
<p style="font-size:12px;color:gray">Lugar da chave: config.js (vou te mandar depois)</p>
</div><script>
function a(){let l=8,m=5;if(ret.checked)m+=2;if(sub.checked){l+=2;m+=1.5}vl.innerText=l.toFixed(2);vm.innerText=m.toFixed(2);alert('Lojista paga R$'+l+' | Motoboy recebe R$'+m)}
</script></body></html>
