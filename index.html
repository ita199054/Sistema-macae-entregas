<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANJOS FLASH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff}
.topo{background:#000;color:#FFD700;text-align:center;padding:25px;font-size:32px;font-weight:900}
.btn{width:100%;padding:28px;font-size:24px;font-weight:900;border:none;border-bottom:5px solid #fff;cursor:pointer}
.btn:active{opacity:0.7}
.preto{background:#000;color:#FFD700}
.cinza{background:#2a2a2a;color:#fff}
.amarelo{background:#FFD700;color:#000}
</style>
</head>
<body>
<div class="topo">⚡ ANJOS FLASH</div>
<button class="btn preto" onclick="location.href='?tela=lojista'">🏪 LOJISTA</button>
<button class="btn cinza" onclick="location.href='?tela=motoboy'">🏍️ MOTOBOY</button>
<button class="btn amarelo" onclick="location.href='?tela=admin'">👑 ADMIN ADD/ZERA</button>

<script>
// Se tiver ?tela=, mostra que clicou
const p = new URLSearchParams(location.search).get('tela');
if(p){ document.body.innerHTML += `<div style="padding:20px;text-align:center"><h1>${p.toUpperCase()}</h1><p>Carregando painel ${p}...</p><br><a href="/" style="background:#000;color:#FFD700;padding:10px 20px;text-decoration:none;border-radius:8px">VOLTAR</a></div>`; }
</script>
</body>
</html>
