<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anjos Flash - FINAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div id="telaLogin" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
<div class="bg-white p-6 rounded-xl w-full max-w-sm">
<h2 class="font-bold text-center">🏍️ Anjos Flash</h2>
<input id="loginEmail" placeholder="email" class="w-full border p-3 rounded mb-2">
<input id="loginSenha" type="password" placeholder="senha" class="w-full border p-3 rounded mb-2">
<button onclick="fazerLogin()" class="w-full bg-orange-500 text-white p-3 rounded">ENTRAR</button>
</div>
</div>
<div id="app" class="max-w-[420px] mx-auto bg-white min-h-screen">
<div class="p-4 flex justify-between border-b">
<b>Anjos Flash - FINAL LIMPO</b>
<button onclick="fazerLogout()" class="text-xs border px-2 py-1 rounded">SAIR</button>
</div>
<div id="telaLojista" class="p-4">
<div class="bg-black text-white p-3 rounded-xl text-center">R$ <span id="saldoLojistaValor">0.00</span></div>
<input id="enderecoSalaoLojista" placeholder="CAVALEIROS" value="CAVALEIROS" class="w-full p-2 rounded border-2 mt-2 text-sm uppercase" oninput="calc();">
<input id="enderecoCompletoLojista" placeholder="AROEIRA" class="w-full border-2 p-2 rounded text-sm uppercase mt-2" oninput="calc();">
<div class="bg-yellow-50 border-4 border-yellow-500 p-4 rounded-xl mt-3">
<h3 class="font-black text-sm">🔄 ABA RETORNO - SO RETORNO E LOCAL PARA MARCAR</h3>
<div class="bg-white border-2 border-black p-3 rounded-xl mt-3 flex items-center gap-3">
<input type="checkbox" id="precisaRetorno" class="w-8 h-8" onchange="calc()">
<div>
<p class="font-black text-sm">🔄 RETORNO</p>
<p class="text-[10px]">Local para marcar retorno</p>
</div>
</div>
<div id="localMarcarRetorno" class="mt-3 bg-yellow-100 border-2 border-yellow-600 p-3 rounded-xl hidden">
<label class="text-[10px] font-black">📍 LOCAL PARA MARCAR RETORNO</label>
<input id="enderecoRetornoLojista" placeholder="ENDERECO RETORNO - ONDE VOLTA" class="w-full p-3 rounded border-2 text-sm uppercase mt-1">
</div>
</div>
<div class="bg-white border-2 border-black p-3 rounded-xl mt-3 text-center">
<p class="font-black text-2xl">R$ <span id="totalLojista">10.00</span></p>
</div>
<button onclick="criarPedido()" class="w-full bg-black text-white p-3 rounded-xl mt-3">🚀 CRIAR CORRIDA</button>
<div class="bg-blue-50 border-2 border-blue-600 p-2 rounded-xl mt-3">
<h3 class="font-bold text-sm">📞 CHAMAR MOTOBOY #0001</h3>
<input id="codigoMotoboyChamarLojista" placeholder="#0001" class="border p-2 rounded text-xs w-full mt-1">
<input id="idCorridaChamarLojista" placeholder="ID CORRIDA" class="border p-2 rounded text-xs w-full mt-1">
<button onclick="chamarMotoboyPorNumeroLojista()" class="bg-blue-600 text-white w-full py-2 rounded mt-2 text-xs">CHAMAR #0001</button>
<div id="listaCorridasParaChamarLojista" class="mt-2 text-xs"></div>
</div>
<div id="listaMeusPedidosLojista" class="mt-3 text-xs"></div>
<div class="bg-blue-100 border-2 border-blue-600 p-2 rounded-xl mt-3">
<button onclick="imprimirMeuExtratoLojista()" class="bg-blue-600 text-white w-full py-2 rounded text-xs">🖨️ EXTRATO</button>
</div>
</div>
<div id="telaMotoboy" class="p-4 hidden">
<div class="bg-black text-white p-3 rounded-xl text-center">R$ <span id="saldoMotoboyValor">0.00</span><p id="meuCodigoDisplay">#0000</p></div>
<div id="listaEntregasMotoboy" class="mt-3 text-xs"></div>
</div>
<div id="telaAdmin" class="p-4 hidden">
<h3 class="font-bold">ADMIN</h3>
<div class="bg-yellow-50 border-4 border-yellow-500 p-3 rounded-xl mt-3">
<h3 class="font-black text-sm">🔄 ABA RETORNO ADMIN</h3>
<div class="bg-white border-2 border-black p-3 rounded-xl mt-2 flex items-center gap-3">
<input type="checkbox" id="precisaRetornoAdmin" class="w-8 h-8" onchange="calcAdminLancamento()">
<p class="font-black text-sm">🔄 RETORNO</p>
</div>
<div id="localMarcarRetornoAdmin" class="mt-3 bg-yellow-100 border-2 p-3 rounded-xl hidden">
<input id="enderecoRetornoAdmin" placeholder="ENDERECO RETORNO ADMIN" class="w-full p-3 rounded border-2 text-sm uppercase">
</div>
</div>
<div class="bg-gray-100 p-2 rounded text-xs mt-2">Loja: R$ <span id="totalLojistaAdminLanc">10.00</span> | Moto: R$ <span id="totalMotoAdminLanc">7.50</span></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain: "anjos-flash.firebaseapp.com",projectId: "anjos-flash"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
const $=id=>document.getElementById(id);
window.calc=function(){
  var loj=10; var moto=7.5;
  if($("precisaRetorno")?.checked){
    loj+=loj*0.5; moto+=3;
    $("localMarcarRetorno").classList.remove("hidden");
  }else{
    $("localMarcarRetorno").classList.add("hidden");
  }
  $("totalLojista").innerText=loj.toFixed(2);
  return{lojista:loj,moto:moto};
};
window.calcAdminLancamento=function(){
  var loj=10; var moto=7.5;
  if($("precisaRetornoAdmin")?.checked){
    loj+=loj*0.5; moto+=3;
    $("localMarcarRetornoAdmin").classList.remove("hidden");
  }else{
    $("localMarcarRetornoAdmin").classList.add("hidden");
  }
  $("totalLojistaAdminLanc").innerText=loj.toFixed(2);
  $("totalMotoAdminLanc").innerText=moto.toFixed(2);
  return{loj,moto};
};
window.criarPedido=async function(){var c=calc(); alert("Criado R$"+c.lojista.toFixed(2));};
window.chamarMotoboyPorNumeroLojista=async function(){alert("CHAMAR #0001 LOJISTA");};
window.imprimirMeuExtratoLojista=function(){window.print();};
window.fazerLogin=async function(){await signInWithEmailAndPassword(auth,$("loginEmail").value,$("loginSenha").value);};
window.fazerLogout=async function(){await signOut(auth); location.reload();};
onAuthStateChanged(auth, async user=>{if(user){$("telaLogin").classList.add("hidden"); var d=await getDoc(doc(db,"usuarios",user.uid)); var role=d.data()?.role||"LOJISTA"; $("telaLojista").classList.toggle("hidden",!role.includes("LOJISTA")); $("telaMotoboy").classList.toggle("hidden",!role.includes("MOTOBOY")); $("telaAdmin").classList.toggle("hidden",role!=="ADMIN");}else{$("telaLogin").classList.remove("hidden");}});
</script>
</body>
</html>
