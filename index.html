<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>body{background:#000;color:#fff;padding:20px;font-family:Arial}input{width:100%;padding:12px;margin:8px 0;border-radius:10px}button{width:100%;padding:12px;background:gold;font-weight:bold;border-radius:10px}#msg{background:#222;padding:10px;margin-top:10px;color:gold}</style>
</head>
<body>
<h2>ANJOS FLASH - TESTE</h2>
<input id="email" placeholder="super@macae.com">
<input id="senha" type="password" placeholder="senha">
<button onclick="login()">ENTRAR</button>
<div id="msg">Aguardando...</div>
<script>
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

async function login(){
 const msg=document.getElementById("msg");
 msg.innerText="Tentando...";
 try{
  const e=document.getElementById("email").value.trim().toLowerCase();
  const s=document.getElementById("senha").value;
  msg.innerText="Conectando Firebase com "+e;
  const cred=await auth.signInWithEmailAndPassword(e,s);
  msg.innerText="Logou! Buscando tipo... UID="+cred.user.uid;
  let doc=await db.collection("usuarios").doc(e).get();
  if(!doc.exists){ doc=await db.collection("usuarios").doc(cred.user.uid).get(); msg.innerText=msg.innerText+" - Achou por UID"; }
  else{ msg.innerText=msg.innerText+" - Achou por EMAIL"; }
  if(!doc.exists){ msg.innerText="ERRO: Não achou doc em usuarios"; return; }
  const tipo=doc.data().tipo;
  msg.innerText="TIPO="+tipo+" | Indo pra "+tipo+".html";
  setTimeout(()=>{ location.href=tipo=="super"||tipo=="admin"?"super.html":tipo+".html"; },1000);
 }catch(err){
  msg.innerText="ERRO: "+err.message;
  alert(err.message);
 }
}
</script>
</body>
</html>
