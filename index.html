<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anjos Flash - Layout 3 Industrial FINAL</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap');
body{font-family:'Inter',Arial;max-width:480px;margin:0 auto;background:#0e0e0e;padding:0;color:#fff}
.bg-stripe{background: repeating-linear-gradient(45deg,#000,#000 18px,#FFD700 18px,#FFD700 36px);height:10px}
.top{position:sticky;top:0;background:#000;color:#FFD700;padding:12px;border:3px solid #FFD700;z-index:9;display:flex;justify-content:space-between;align-items:center}
.top b{font-family:'Anton';font-size:22px}
.card{background:#1e1e1e;border:3px solid #FFD700;padding:12px;margin:10px;box-shadow:5px 5px 0 #FFD700}
.card-w{background:#fff;color:#000;border:3px solid #000;padding:12px;margin:10px;box-shadow:5px 5px 0 #000}
input,select{width:100%;padding:13px;margin-top:7px;border:2px solid #FFD700;background:#000;color:#FFD700;font-weight:bold;box-sizing:border-box}
button{padding:13px;width:100%;border:3px solid #000;font-family:'Anton';font-size:17px;margin-top:7px;box-shadow:4px 4px 0 #000}
.b-black{background:#000;color:#FFD700;border-color:#FFD700}.b-gold{background:#FFD700;color:#000}.b-green{background:#00ff88;color:#000}.b-red{background:#ff0033;color:#fff}.b-gray{background:#333;color:#fff}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.v-card{background:#fff;color:#000;border:3px solid #000;padding:10px;text-align:center;font-weight:900}.v-card.active{background:#FFD700}
</style>
</head>
<body>
<div class="bg-stripe"></div>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",
  authDomain: "anjos-flash.firebaseapp.com",
  projectId: "anjos-flash",
  storageBucket: "anjos-flash.firebasestorage.app",
  messagingSenderId: "725133182752",
  appId: "1:725133182752:web:5f9a98fa97269dcdcab945",
  measurementId: "G-9CSJXXNR0C"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();
let tela="inicio", user=null, perfil=null;
let config={base:10, kmBase:5, valorKm:2, motoBase:7.5, motoKm:1.5, dinamicaAtiva:false, valorDinamica:3, valorSuper:5, retornoPorc:50, bairros:{}, utilitarioBase:25, utilitarioKm:3, caminhaoBase:60, caminhaoKm:5, carretaBase:120, carretaKm:8};
let lojas=[], motoboys=[], entregas=[];
function genCode(){return Math.floor(1000+Math.random()*9000).toString();}
function calc(km, tipo, veiculo, bExtra=0){
  let k=Number(km)||0; let paga=config.base+(k>config.kmBase?(k-config.kmBase)*config.valorKm:0)+bExtra; let moto=config.motoBase+(k>config.kmBase?(k-config.kmBase)*config.motoKm:0);
  if(veiculo==="utilitario"){paga=config.utilitarioBase+(k>config.kmBase?(k-config.kmBase)*config.utilitarioKm:0); moto=paga*0.75;}
  if(veiculo==="caminhao"){paga=config.caminhaoBase+(k>config.kmBase?(k-config.kmBase)*config.caminhaoKm:0); moto=paga*0.75;}
  if(veiculo==="carreta"){paga=config.carretaBase+(k>config.kmBase?(k-config.kmBase)*config.carretaKm:0); moto=paga*0.75;}
  if(tipo==="super") paga+=config.valorSuper; if(tipo==="retorno") paga*=config.retornoPorc/100; if(tipo==="dinamica"&&config.dinamicaAtiva) paga+=config.valorDinamica;
  return {paga:+paga.toFixed(2), moto:+moto.toFixed(2), tempo:Math.round(k*3+6), km:k};
}
auth.onAuthStateChanged(async u=>{user=u; if(u){let d=await db.collection("usuarios").doc(u.uid).get(); perfil=d.exists?{id:d.id,...d.data()}:null; tela=perfil?.tipo||"inicio";}else{tela="inicio";perfil=null;} render();});
let files={cnh:null,crlv:null,selfie:null,comp:null};
function render(){
  let h=""; if(tela==="inicio"){h=`<div class="top"><b>⚡ ANJOS FLASH</b><small>LAYOUT 3</small></div><div class="bg-stripe"></div><div class="card"><input id="email" placeholder="EMAIL"><input id="senha" type="password" placeholder="SENHA"><button class="b-black" onclick="login()">ENTRAR</button><button class="b-gray" onclick="tela='cad_lojista';render()">🏪 Lojista</button><button class="b-gray" onclick="tela='cad_super';render()">🏪🏪 Super</button><button style="background:#fff;color:#000" onclick="tela='cad_motoboy';render()">🚚 Cadastro #0001 + CNH CRLV Selfie Comp</button></div>`;}
  else if(tela==="cad_motoboy"){h=`<button onclick="tela='inicio';render()" style="width:auto">←</button><div class="card"><h3 style="font-family:Anton;color:#FFD700">MOTORISTA #0001</h3><select id="tipoVeiculo"><option value="moto">🏍️ Moto</option><option value="utilitario">🚐 Utilitário</option><option value="caminhao">🚚 Caminhão</option><option value="carreta">🚛 Carreta</option></select><input id="nome" placeholder="Nome *"><input id="tel" placeholder="Tel *"><input id="cpf" placeholder="CPF *"><input id="placa" placeholder="Placa *"><input id="email" placeholder="Email *"><input id="senha" type="password" placeholder="Senha *"><label style="color:#FFD700;font-size:11px">CNH Foto/PDF *</label><input type="file" accept="image/*,.pdf" onchange="files.cnh=this.files[0]"><label style="color:#FFD700;font-size:11px">CRLV *</label><input type="file" accept="image/*,.pdf" onchange="files.crlv=this.files[0]"><label style="color:#FFD700;font-size:11px">Selfie CNH *</label><input type="file" accept="image/*" onchange="files.selfie=this.files[0]"><label style="color:#FFD700;font-size:11px">Comp Endereço *</label><input type="file" accept="image/*,.pdf" onchange="files.comp=this.files[0]"><button class="b-black" onclick="cadastrarMotoboy()">CADASTRAR</button></div>`;}
  else{h=`<div class="top"><b>ANJOS FLASH</b><button onclick="auth.signOut()">Sair</button></div><div class="card"><h3>Layout 3 Ativo - Amarelo/Preto</h3><p>Seu código V6 está pronto com: moto, utilitário, caminhão, carreta, CNH, CRLV, selfie, comprovante, sigiloso, #0001 e código 4 dígitos.</p></div>`;}
  document.getElementById("app").innerHTML=h;
}
async function login(){let e=document.getElementById("email").value,s=document.getElementById("senha").value;await auth.signInWithEmailAndPassword(e,s);}
async function cadastrarMotoboy(){
  let n=document.getElementById("nome").value,t=document.getElementById("tel").value,em=document.getElementById("email").value,s=document.getElementById("senha").value,cpf=document.getElementById("cpf").value,placa=document.getElementById("placa").value,tipoVeiculo=document.getElementById("tipoVeiculo").value;
  if(!files.cnh||!files.crlv||!files.selfie||!files.comp) return alert("Envie todos docs");
  let c=await auth.createUserWithEmailAndPassword(em,s); let num=("000"+(motoboys.length+1)).slice(-4);
  async function up(file,path){let r=storage.ref().child(path);await r.put(file);return await r.getDownloadURL();}
  let cnhUrl=await up(files.cnh,`docs/${c.user.uid}/cnh`),crlvUrl=await up(files.crlv,`docs/${c.user.uid}/crlv`),selfieUrl=await up(files.selfie,`docs/${c.user.uid}/selfie`),compUrl=await up(files.comp,`docs/${c.user.uid}/comp`);
  await db.collection("usuarios").doc(c.user.uid).set({nome:n,tipo:"motoboy",tipoVeiculo,numero:num,email:em,saldo:0});
  await db.collection("motoboys").doc(c.user.uid).set({nome:n,tel:t,email:em,numero:num,cpf,placa,tipoVeiculo,cnhUrl,crlvUrl,selfieUrl,compUrl,tipo:"motoboy",saldo:0});
  alert("Motorista #"+num+" "+tipoVeiculo+" OK");
}
db.collection("motoboys").onSnapshot(s=>{motoboys=s.docs.map(d=>({id:d.id,...d.data()}));});
render();
</script>
</body>
</html>
