<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Anjos Flash FIX LOJISTA</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100">
<div id="telaLogin" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-xl w-full max-w-sm"><h2 class="font-bold text-xl text-center">Anjos Flash</h2><input id="loginEmail" placeholder="email" class="w-full border p-3 rounded mb-2"><input id="loginSenha" type="password" placeholder="senha" class="w-full border p-3 rounded mb-2"><button onclick="fazerLogin()" class="w-full bg-orange-500 text-white p-3 rounded font-bold">ENTRAR</button><p id="msgLogin" class="text-xs text-red-600"></p></div></div>
<div id="app" class="max-w-[420px] mx-auto bg-white min-h-screen">
<div class="p-4 border-b flex justify-between"><b>Anjos Flash FIX LOJISTA</b><button onclick="fazerLogout()" class="border px-2 py-1 rounded text-xs">SAIR</button></div>
<div id="telaLojista" class="p-4 hidden">
<input id="nomeSalaoLojista" placeholder="Nome loja" class="w-full border-2 border-black p-2 rounded mb-2">
<input id="enderecoSalaoLojista" placeholder="CAVALEIROS" value="CAVALEIROS" class="w-full border-2 border-green-600 p-2 rounded mb-2 uppercase" oninput="calc()">
<input id="enderecoCompletoLojista" placeholder="AROEIRA" class="w-full border-2 border-blue-600 p-2 rounded mb-2 uppercase" oninput="calc()">
<div class="bg-yellow-50 border-4 border-yellow-500 p-3 rounded-xl mb-3"><label class="flex gap-2 font-bold"><input type="checkbox" id="precisaRetorno" onchange="calc()"> RETORNO</label><div id="localMarcarRetorno" class="hidden mt-2"><input id="enderecoRetornoLojista" placeholder="ENDERECO RETORNO ONDE VOLTA" class="w-full border-2 border-yellow-600 p-2 rounded uppercase"></div></div>
<label class="flex gap-2"><input type="checkbox" id="precisaSuper" onchange="calc()"> SUBIR +</label>
<p class="text-center font-black text-3xl">R$ <span id="totalLojista">10.00</span></p><div id="detalheRegiao" class="text-xs"></div>
<button onclick="criarPedido()" class="w-full bg-black text-white p-3 rounded mt-2 font-bold">CRIAR CORRIDA</button>
<div id="listaMeusPedidosLojista" class="mt-2 text-xs"></div>
</div>
<div id="telaAdmin" class="p-4 hidden">
<div class="bg-white p-3 rounded-xl border-4 border-black mb-4 shadow">
<h3 class="font-black text-sm">🏪 LANÇAR CORRIDA - ESCOLHA A LOJA - FIX AGORA APARECE</h3>
<select id="selectLojaLancamento" class="w-full border-2 border-black p-2 rounded text-xs bg-white font-bold mt-2" onchange="selecionarLojaParaLancar()"><option value="">-- Carregando lojas... --</option></select>
<button onclick="carregarLojasParaLancamentoFIX()" class="bg-blue-600 text-white w-full py-2 rounded mt-2 text-xs font-black">🔄 RECARREGAR LOJAS APROVADAS</button>
<div id="boxLojaSelecionadaLancamento" class="hidden mt-2 bg-yellow-100 border-2 border-yellow-500 p-2 rounded">
<p class="text-[11px] font-black">✅ LOJA SELECIONADA:</p><p id="nomeLojaLancamento" class="text-xs font-bold"></p><p id="emailLojaLancamento" class="text-[10px]"></p><p id="saldoLojaLancamento" class="text-[11px] font-bold text-green-700"></p>
</div>
<input id="enderecoLojaAdminLancamento" placeholder="CAVALEIROS" value="CAVALEIROS" class="w-full p-3 rounded border-2 border-green-600 text-sm font-bold uppercase mt-2" oninput="calcAdminLancamento()">
<input id="enderecoClienteAdminLancamento" placeholder="AROEIRA" class="w-full border-2 border-blue-600 p-3 rounded text-sm font-bold uppercase mt-2" oninput="calcAdminLancamento()">
<div class="bg-yellow-50 border-4 border-yellow-500 p-3 rounded-xl mt-2"><label class="flex gap-2 font-bold"><input type="checkbox" id="precisaRetornoAdmin" onchange="calcAdminLancamento()"> RETORNO</label><div id="localMarcarRetornoAdmin" class="hidden mt-2"><input id="enderecoRetornoAdmin" placeholder="ENDERECO RETORNO ADMIN" class="w-full border-2 border-yellow-600 p-2 rounded uppercase"></div></div>
<p class="font-black text-center mt-2">Loja: R$ <span id="totalLojistaAdminLanc">10.00</span> <span id="detalheRegiaoAdminLanc" class="text-[10px] block"></span></p>
<button onclick="criarPedidoAdminPorLoja()" class="w-full bg-blue-600 text-white p-3 rounded mt-2 font-black">🚀 CRIAR PELA LOJA SELECIONADA</button>
</div>
<div class="bg-blue-100 border-4 border-blue-600 p-3 rounded-xl mb-4"><h3 class="font-black text-sm">TODAS CORRIDAS - FIX SEM ORDERBY</h3><div id="listaCorridasParaChamar" class="mt-2 space-y-1 max-h-[500px] overflow-y-auto text-[11px] bg-white p-2 rounded border-2"></div></div>
<div class="bg-yellow-100 border-4 border-black p-3 rounded-xl mb-4"><h3 class="font-bold text-sm">VALOR FIXO</h3><div class="grid grid-cols-2 gap-2 mt-2"><input id="origemRota" placeholder="CAVALEIROS" class="border-2 border-black p-2 rounded text-xs uppercase"><input id="destinoRota" placeholder="AROEIRA" class="border-2 border-black p-2 rounded text-xs uppercase"><input id="valorRotaLojista" placeholder="15,00" class="border-2 border-blue-600 p-2 rounded text-xs"><input id="valorRotaMotoboy" placeholder="8,00" class="border-2 border-green-600 p-2 rounded text-xs"></div><button onclick="addRota()" class="bg-black text-white w-full py-2 rounded mt-2 text-xs font-black">SALVAR FIXO</button><div id="listaRotasAdmin" class="mt-2 text-[11px]"></div></div>
<div class="border-4 border-yellow-500 p-3 rounded-xl mb-4 bg-yellow-50"><h3 class="font-bold text-sm">PENDENTES</h3><div id="listaLojistasPendentes"></div><div id="listaMotoboysPendentes"></div></div>
</div>
<div id="telaMotoboy" class="p-4 hidden"><p id="meuCodigoDisplay" class="font-black text-3xl bg-yellow-400 text-black p-2 rounded">#0000</p><div id="listaEntregasMotoboy" class="mt-2 text-xs"></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, doc, setDoc, getDoc, Timestamp, orderBy, limit, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {apiKey: "AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain: "anjos-flash.firebaseapp.com",projectId: "anjos-flash"};
const app = initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
let userLogado=null; let userRoleReal=null; let mapaRotasFixas={}; let configPrecos={retorno_percent:50,retorno_moto:3,subir_lojista:8,subir_moto:4};
const $=id=>document.getElementById(id);
window.debounceKm=()=>setTimeout(()=>calc(),200);
window.debounceKmAdmin=()=>setTimeout(()=>calcAdminLancamento(),200);
async function carregarMapaRotasFixas(){const snap=await getDocs(collection(db,"rotas"));mapaRotasFixas={};snap.forEach(d=>{const r=d.data();if(r.deletado)return;const o=(r.origem||"").toUpperCase().trim();const de=(r.destino||"").toUpperCase().trim();if(!o||!de)return;mapaRotasFixas[o+"_"+de]={lojista:Number(r.valor_lojista||10),motoboy:Number(r.valor_motoboy||7.5),origem:o,destino:de,id:d.id};mapaRotasFixas[de+"_"+o]=mapaRotasFixas[o+"_"+de];});renderListaRotasFixas();calc();calcAdminLancamento();}
function getValorFixoPorBairro(oRaw,dRaw){if(!oRaw||!dRaw)return null;const o=oRaw.toUpperCase().trim();const d=dRaw.toUpperCase().trim();for(let k in mapaRotasFixas){const r=mapaRotasFixas[k];if((o.includes(r.origem)||r.origem.includes(o))&&(d.includes(r.destino)||r.destino.includes(d)))return r;}return null;}
function renderListaRotasFixas(){let h="";const ja=new Set();for(let k in mapaRotasFixas){const r=mapaRotasFixas[k];const idU=r.origem+"_"+r.destino;if(ja.has(idU))continue;ja.add(idU);h+=`<div class="bg-white border-2 border-black p-2 rounded flex justify-between items-center mb-1"><div><b>${r.origem} x ${r.destino}</b><br>R$${r.lojista.toFixed(2)}</div><button onclick="deletarRotaFixa('${r.id}')" class="bg-red-600 text-white px-2 py-1 rounded">X</button></div>`;}if($("listaRotasAdmin"))$("listaRotasAdmin").innerHTML=h||"Nenhum";}
window.deletarRotaFixa=async function(id){try{await deleteDoc(doc(db,"rotas",id));}catch(e){await setDoc(doc(db,"rotas",id),{deletado:true},{merge:true});}carregarMapaRotasFixas();};
window.calc=function(){let origem=$("enderecoSalaoLojista")?.value||"";let destino=$("enderecoCompletoLojista")?.value||"";let fixo=getValorFixoPorBairro(origem,destino);let loj=10;let moto=7.5;if(fixo){loj=fixo.lojista;moto=fixo.motoboy;if($("detalheRegiao"))$("detalheRegiao").innerHTML=`FIXO ${fixo.origem} x ${fixo.destino} R$${loj.toFixed(2)}`;}else{if($("detalheRegiao"))$("detalheRegiao").innerHTML=`SEM FIXO`;}if($("precisaRetorno")?.checked){loj+=loj*(configPrecos.retorno_percent/100);moto+=configPrecos.retorno_moto;$("localMarcarRetorno").classList.remove("hidden");}else{$("localMarcarRetorno")?.classList.add("hidden");}if($("precisaSuper")?.checked){loj+=configPrecos.subir_lojista;moto+=configPrecos.subir_moto;}if($("totalLojista"))$("totalLojista").innerText=loj.toFixed(2);return{lojista:loj,moto:moto};};
window.calcAdminLancamento=function(){let origem=$("enderecoLojaAdminLancamento")?.value||"";let destino=$("enderecoClienteAdminLancamento")?.value||"";let fixo=getValorFixoPorBairro(origem,destino);let loj=10;let moto=7.5;if(fixo){loj=fixo.lojista;moto=fixo.motoboy;if($("detalheRegiaoAdminLanc"))$("detalheRegiaoAdminLanc").innerHTML=`FIXO ${fixo.origem} x ${fixo.destino}`;}else{if($("detalheRegiaoAdminLanc"))$("detalheRegiaoAdminLanc").innerHTML=`SEM FIXO`;}if($("precisaRetornoAdmin")?.checked){loj+=loj*(configPrecos.retorno_percent/100);moto+=configPrecos.retorno_moto;$("localMarcarRetornoAdmin").classList.remove("hidden");}else{$("localMarcarRetornoAdmin")?.classList.add("hidden");}if($("precisaSuperAdmin")?.checked){loj+=configPrecos.subir_lojista;moto+=configPrecos.subir_moto;}if($("totalLojistaAdminLanc"))$("totalLojistaAdminLanc").innerText=loj.toFixed(2);return{loj:loj,moto:moto};};
window.fazerLogin=async function(){try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginSenha").value.trim());}catch(e){$("msgLogin").innerText=e.message;}};
window.fazerLogout=async function(){await signOut(auth);location.reload();};
window.carregarLojasParaLancamentoFIX=async function(){
 try{
  const snap=await getDocs(collection(db,"usuarios"));
  const sel=document.getElementById("selectLojaLancamento");
  if(!sel) return;
  sel.innerHTML='<option value="">-- Selecione loja APROVADA --</option>';
  let count=0;
  snap.forEach(d=>{
   const u=d.data(); if(!u) return;
   const role=(u.role||"").toUpperCase();
   const status=(u.status||"").toUpperCase();
   if(role.includes("LOJISTA") && status==="APROVADO"){
    const opt=document.createElement("option");
    opt.value=u.userId||d.id;
    opt.textContent=(u.nome||u.email||"LOJA")+" - R$"+Number(u.saldo_lojista||0).toFixed(2)+" - "+(u.email||"");
    sel.appendChild(opt);
    count++;
   }
  });
  if(count===0) sel.innerHTML='<option value="">Nenhum lojista APROVADO encontrado - aprove lojistas em PENDENTES abaixo</option>';
 }catch(e){
  const sel=document.getElementById("selectLojaLancamento");
  if(sel) sel.innerHTML='<option>Erro: '+e.message+'</option>';
 }
};
window.selecionarLojaParaLancar=async function(){
 const sel=document.getElementById("selectLojaLancamento");
 const uid=sel.value;
 if(!uid || uid.includes("Nenhum") || uid.includes("Erro") || uid==="") return;
 try{
  const d=await getDoc(doc(db,"usuarios",uid));
  if(!d.exists()){ alert("Lojista nao encontrado"); return; }
  const data=d.data();
  window.lojaSelecionadaLanc=data;
  window.lojaSelecionadaLanc.uid=uid;
  const box=document.getElementById("boxLojaSelecionadaLancamento");
  if(box) box.classList.remove("hidden");
  document.getElementById("nomeLojaLancamento").innerText="✅ "+(data.nome||data.email);
  document.getElementById("emailLojaLancamento").innerText=data.email||"";
  document.getElementById("saldoLojaLancamento").innerText="Saldo: R$"+Number(data.saldo_lojista||0).toFixed(2);
 }catch(e){ alert("Erro: "+e.message); }
};
window.carregarTodasCorridasAdminFIX=async function(){
  const snap=await getDocs(collection(db,"pedidos"));
  let h=""; snap.forEach(d=>{const p=d.data(); if(p.status!=="AGUARDANDO") return; const id=d.id; h+=`<div class="bg-yellow-50 border-2 border-yellow-500 p-2 rounded mb-2"><b>${p.nome_loja||'LOJA'}</b> ${p.endereco_loja||''} -> ${p.endereco_completo||''} R$${Number(p.valor_lojista||0).toFixed(2)} ${p.precisaRetorno?'RETORNO '+(p.endereco_retorno||''):''} <br>ID ${id.slice(0,8)}</div>`;});
  if($("listaCorridasParaChamar")) $("listaCorridasParaChamar").innerHTML=h||"Nenhuma";
};
onAuthStateChanged(auth,async user=>{
 if(user){
  userLogado=user;
  let d=await getDoc(doc(db,"usuarios",user.uid));
  userRoleReal=d.data()?.role||"LOJISTA";
  $("telaLogin").classList.add("hidden");
  if(userRoleReal.startsWith("MOTOBOY")){$("telaMotoboy").classList.remove("hidden");}else if(userRoleReal==="LOJISTA"){$("telaLojista").classList.remove("hidden");}else{$("telaAdmin").classList.remove("hidden");}
  carregarMapaRotasFixas();
  carregarLojasParaLancamentoFIX();
  carregarTodasCorridasAdminFIX();
  onSnapshot(collection(db,"pedidos"), ()=>{carregarTodasCorridasAdminFIX();});
  try{const snap=await getDocs(collection(db,"usuarios"));let hL="";let hM="";snap.forEach(docu=>{const u=docu.data();if(u.status!=="PENDENTE")return;if((u.role||"").includes("MOTOBOY")){hM+=`<div class="bg-white border p-2 rounded text-xs mb-1"><b>${u.nome||u.email}</b><br><button onclick="aprovarUsuario('${u.userId}')" class="bg-green-600 text-white px-2 py-1 rounded">APROVAR</button></div>`;}else{hL+=`<div class="bg-white border p-2 rounded text-xs mb-1"><b>${u.nome||u.email}</b><br><button onclick="aprovarUsuario('${u.userId}')" class="bg-green-600 text-white px-2 py-1 rounded">APROVAR</button></div>`;}});if($("listaLojistasPendentes"))$("listaLojistasPendentes").innerHTML=hL||"Nenhum";if($("listaMotoboysPendentes"))$("listaMotoboysPendentes").innerHTML=hM||"Nenhum";}catch(e){}
 }else{$("telaLogin").classList.remove("hidden");}
});
window.aprovarUsuario=async function(uid){await setDoc(doc(db,"usuarios",uid),{status:"APROVADO"},{merge:true});location.reload();};
window.criarPedido=async function(){let c=calc();let cod=Math.floor(1000+Math.random()*9000).toString();await addDoc(collection(db,"pedidos"),{owner_id:userLogado.uid,nome_loja:$("nomeSalaoLojista").value,endereco_completo:$("enderecoCompletoLojista").value,endereco_loja:$("enderecoSalaoLojista").value,endereco_retorno:$("enderecoRetornoLojista")?.value||"",valor_lojista:c.lojista,valor_motoboy:7.5,codigo_secreto:cod,status:"AGUARDANDO",criado_em:Timestamp.now(),precisaRetorno:$("precisaRetorno")?.checked||false});alert("Criada R$"+c.lojista.toFixed(2));};
window.criarPedidoAdminPorLoja=async function(){
 let loja=window.lojaSelecionadaLanc;
 if(!loja){ alert("SELECIONE LOJA PRIMEIRO NA CAIXA ACIMA"); return; }
 let c=calcAdminLancamento();
 let endCliente=$("enderecoClienteAdminLancamento").value;
 if(!endCliente) return alert("Digite destino");
 let cod=Math.floor(1000+Math.random()*9000).toString();
 let saldoAtual=Number(loja.saldo_lojista||0);
 if(saldoAtual < c.loj){ alert("Loja sem saldo: R$"+saldoAtual.toFixed(2)+" precisa R$"+c.loj.toFixed(2)); return; }
 await addDoc(collection(db,"pedidos"),{owner_id:loja.userId||loja.uid, nome_loja:loja.nome||loja.email, endereco_completo:endCliente, endereco_loja:$("enderecoLojaAdminLancamento").value||"CAVALEIROS", endereco_retorno:$("enderecoRetornoAdmin")?.value||"", valor_lojista:c.loj, valor_motoboy:7.5, codigo_secreto:cod, status:"AGUARDANDO", criado_em:Timestamp.now(), precisaRetorno:$("precisaRetornoAdmin")?.checked||false});
 await setDoc(doc(db,"usuarios",loja.userId||loja.uid),{saldo_lojista:saldoAtual-c.loj},{merge:true});
 alert("✅ Corrida criada pela loja "+(loja.nome||loja.email)+" R$"+c.loj.toFixed(2));
 carregarLojasParaLancamentoFIX();
 carregarTodasCorridasAdminFIX();
};
window.addRota=async function(){let origem=$("origemRota").value.trim().toUpperCase();let destino=$("destinoRota").value.trim().toUpperCase();let lojRaw=$("valorRotaLojista").value.replace(",",".").replace(/[^0-9.]/g,"");let motoRaw=$("valorRotaMotoboy").value.replace(",",".").replace(/[^0-9.]/g,"");const id=origem+"_"+destino;await setDoc(doc(db,"rotas",id),{origem:origem,destino:destino,valor_lojista:Number(lojRaw||10),valor_motoboy:Number(motoRaw||7.5),criado_em:Timestamp.now()});alert("Salvo "+origem+" x "+destino);carregarMapaRotasFixas();};
</script>
</body>
</html>
