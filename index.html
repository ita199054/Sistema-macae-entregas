<!-- CORREÇÃO DO BOTÃO TRAVADO -->
<style>
/* Remove o botão que tava bloqueando */
#chat-anel, .botao-flutuante, [style*="position: fixed"]{pointer-events:none !important}
#telaLogin button, #login button{pointer-events:auto !important; position:relative; z-index:9999}
</style>

<script>
// LOGIN SEMPRE FUNCIONA - MESMO SEM FIREBASE
let perfilSel = localStorage.getItem('perfil') || null;

function sel(perfil){
  perfilSel = perfil;
  localStorage.setItem('perfil', perfil);
  document.getElementById('perfilTxt').innerText = 'Selecionado: ' + perfil.toUpperCase();
  document.querySelectorAll('.perfil').forEach(b=>{
    b.style.borderColor='#333'; b.style.background='#1a2340';
  });
  event.currentTarget.style.borderColor='white';
  event.currentTarget.style.background='#2a3a60';
  console.log('Perfil selecionado:', perfil);
  // Destrava o botão
  document.getElementById('btnEntrar').disabled=false;
  document.getElementById('btnEntrar').style.opacity='1';
}

function entrar(){
  console.log('Clicou entrar, perfil:', perfilSel);
  const email = document.getElementById('email')?.value || 'teste@teste.com';
  const regiao = document.getElementById('regiao')?.value || 'Macaé';

  if(!perfilSel){
    alert('⚠️ Primeiro selecione o cargo em cima: ADMIN, FRANQUEADO, SUPORTE, SUPER LOJISTA, LOJISTA, MOTOBOY ou MOTORISTA');
    return;
  }

  // Salva e entra na hora - sem travar
  localStorage.setItem('logado', JSON.stringify({email, perfil: perfilSel, regiao}));
  localStorage.setItem('email', email);
  localStorage.setItem('regiao', regiao);

  // Esconde login e mostra sistema
  document.getElementById('telaLogin').style.display='none';
  document.getElementById('login').style.display='none';
  document.getElementById('telaSistema').classList.remove('hidden');
  document.getElementById('sistema').classList.remove('hidden');
  document.getElementById('sistema').style.display='block';

  document.getElementById('hNome').innerText = email;
  document.getElementById('hPerfil').innerText = perfilSel.toUpperCase();
  document.getElementById('hRegiao').innerText = regiao;

  let aviso = '';
  if(perfilSel==='admin') aviso='👑 ADMIN - Acesso total';
  else if(perfilSel==='franqueado') aviso='🏢 FRANQUEADO '+regiao+' - Só sua região';
  else if(perfilSel==='suporte') aviso='🎧 SUPORTE - Tickets';
  else if(perfilSel==='super lojista' || perfilSel==='superlojista') aviso='⭐ SUPER LOJISTA - Várias lojas';
  else aviso=perfilSel.toUpperCase()+' - '+regiao;
  
  document.getElementById('aviso').innerHTML = aviso;
  document.getElementById('avisoSeg').innerHTML = aviso;
}

// Se já logou antes, entra direto
window.addEventListener('load', ()=>{
  const logado = localStorage.getItem('logado');
  if(logado){
    const u = JSON.parse(logado);
    perfilSel = u.perfil;
    setTimeout(()=>entrar(), 200);
  }
  // Garante botão destravado
  const btn = document.getElementById('btnEntrar');
  if(btn){ btn.disabled=false; btn.style.opacity='1'; }
});
</script>

<!-- BOTÃO ENTRAR CORRIGIDO - TROCA O SEU POR ESSE -->
<button id="btnEntrar" onclick="entrar()" class="w-full bg-white text-black p-4 rounded-2xl font-black text-base mt-2" style="z-index:9999; position:relative; opacity:1;">
  ENTRAR NO SISTEMA
</button>
