function mostrarMensagem(id, texto, tipo="info"){

  const el = document.getElementById(id);

  if(!el) return;

  el.className = "mensagem " + tipo;
  el.textContent = texto;
  el.classList.remove("oculto");
}


function limparMensagem(id){

  const el = document.getElementById(id);

  if(!el) return;

  el.textContent = "";
  el.className = "mensagem oculto";
}


function erroHumano(error){

  if(!error) return "Ocorreu um erro.";

  const codigo = error.code || "";

  const mensagens = {

    "auth/invalid-credential":
      "E-mail ou senha incorretos.",

    "auth/invalid-login-credentials":
      "E-mail ou senha incorretos.",

    "auth/user-not-found":
      "Usuário não encontrado.",

    "auth/wrong-password":
      "Senha incorreta.",

    "auth/invalid-email":
      "E-mail inválido.",

    "auth/email-already-in-use":
      "Este e-mail já está cadastrado.",

    "auth/weak-password":
      "A senha deve ter pelo menos 6 caracteres.",

    "auth/network-request-failed":
      "Erro de conexão com a internet.",

    "permission-denied":
      "Permissão negada no banco de dados."
  };

  return mensagens[codigo] ||
    error.message ||
    "Não foi possível realizar a operação.";
}

/* =========================================================
   CRIAR PEDIDO
========================================================= */

async function criarPedido(){

  if(!usuarioAtual) return;

  const cliente =
    document.getElementById("pedidoCliente")
      .value.trim();

  const telefone =
    document.getElementById("pedidoTelefone")
      .value.trim();

  const endereco =
    document.getElementById("pedidoEndereco")
      .value.trim();

  const valorProduto =
    Number(
      document.getElementById("pedidoValor")
        .value || 0
    );

  const veiculo =
    document.getElementById("pedidoVeiculo")
      .value;

  if(!cliente || !telefone || !endereco){

    alert(
      "Preencha cliente, telefone e endereço."
    );

    return;
  }

  const taxaBase = 8;

  try{

    const walletRef =
      db.collection("wallets")
        .doc(usuarioAtual.uid);

    const orderRef =
      db.collection("orders")
        .doc();

    const transactionRef =
      db.collection("transactions")
        .doc();

    await db.runTransaction(async transaction => {

      const walletSnap =
        await transaction.get(walletRef);

      let saldo = 0;

      if(walletSnap.exists){

        saldo =
          Number(walletSnap.data().saldo || 0);
      }

      if(saldo < taxaBase){

        throw new Error(
          "SALDO_INSUFICIENTE"
        );
      }

      const codigo =
        Math.floor(
          1000 + Math.random() * 9000
        ).toString();

      transaction.update(
        walletRef,
        {

          saldo:
            firebase.firestore.FieldValue
              .increment(-taxaBase),

          atualizadoEm:
            firebase.firestore.FieldValue
              .serverTimestamp()

        }
      );

      transaction.set(
        orderRef,
        {

          lojistaId:
            usuarioAtual.uid,

          lojistaNome:
            perfilAtual.nome || "",

          clienteNome:
            cliente,

          telefoneCliente:
            telefone,

          enderecoEntrega:
            endereco,

          valorProduto:
            valorProduto,

          valorPedido:
            valorProduto,

          valorTaxa:
            taxaBase,

          veiculo:
            veiculo,

          codigo4Digitos:
            codigo,

          status:
            "pendente",

          motoboyId:
            null,

          criadoEm:
            firebase.firestore.FieldValue
              .serverTimestamp()

        }
      );

      transaction.set(
        transactionRef,
        {

          uid:
            usuarioAtual.uid,

          tipo:
            "taxa_pedido",

          valor:
            -taxaBase,

          orderId:
            orderRef.id,

          status:
            "aprovado",

          criadoEm:
            firebase.firestore.FieldValue
              .serverTimestamp()

        }
      );

    });

    alert(
      "Pedido criado com sucesso!\n\n" +
      "Código: " +
      "Consulte o pedido para ver o código."
    );

    document.getElementById("pedidoCliente").value = "";
    document.getElementById("pedidoTelefone").value = "";
    document.getElementById("pedidoEndereco").value = "";
    document.getElementById("pedidoValor").value = "";

    await atualizarSaldo();
    await carregarLojista();

  }catch(error){

    console.error(error);

    if(error.message === "SALDO_INSUFICIENTE"){

      alert(
        "Saldo insuficiente.\n\n" +
        "É necessário ter pelo menos R$ 8,00 para solicitar uma entrega."
      );

      return;
    }

    alert(
      "Não foi possível criar o pedido:\n" +
      erroHumano(error)
    );
  }
}

  const div =
    document.getElementById(
      "listaPedidosLojista"

  div.textContent = "Carregando...";

    if(snap.empty){

      div.innerHTML =

    let html = "";

    snap.forEach(doc => {

      html += `

          <strong>Cliente:</strong>

          <strong>Telefone:</strong>

          <strong>Endereço:</strong>

          <strong>Veículo:</strong>
          ${p.veiculo || "-"}<br>

          <strong>Status:</strong>
          ${p.status || "-"}<br>

          <strong>Taxa:</strong>
          R$ ${Number(p.valorTaxa || 0)

            .replace(".", ",")}<br>

          <strong>Código:</strong>
          ${p.codigo4Digitos || "-"}

        </div>

    div.innerHTML = html;

    div.innerHTML =

}

  if(!usuarioAtual) return;

  try{

    const ref =
      db.collection("profiles")

    const snap = await ref.get();

    const atual =
      snap.exists &&
      snap.data().online === true;

    await ref.update({

    alert(

  const status =
    document.getElementById("statusMotoboy");

  const botao =
    document.getElementById("btnOnline");

  if(!status || !botao) return;

  if(online){

    status.textContent = "ONLINE";

    status.className =
      "status-offline";

      "FICAR ONLINE";

    botao.className =
      "btn-verde";

/* =========================================================
   CARREGAR MOTOBOY
========================================================= */

async function carregarMotoboy(){

  if(!usuarioAtual) return;

  try{

    const perfilSnap =
      await db.collection("profiles")
        .doc(usuarioAtual.uid)
        .get();

    if(perfilSnap.exists){

      const online =
        perfilSnap.data().online === true;

      atualizarStatusMotoboy(online);
    }


    const div =
      document.getElementById(
        "listaPedidosMotoboy"
      );

    if(!div) return;

    const snap =
      await db.collection("orders")
        .where(
          "status",
          "==",
          "pendente"
        )
        .get();

    if(snap.empty){

      div.innerHTML =
        '<div class="item">Nenhuma entrega disponível.</div>';

    }else{

      let html = "";

      snap.forEach(doc => {

        const p = doc.data();

        html += `
          <div class="item">

            <strong>Loja:</strong>
            ${p.lojistaNome || "-"}<br>

            <strong>Cliente:</strong>
            ${p.clienteNome || "-"}<br>

            <strong>Endereço:</strong>
            ${p.enderecoEntrega || "-"}<br>

            <strong>Veículo:</strong>
            ${p.veiculo || "-"}

            <button
              class="btn-verde"
              onclick="aceitarPedido('${doc.id}')"
            >
              ACEITAR ENTREGA
            </button>

          </div>
        `;
      });

      div.innerHTML = html;
    }


    const minhas =
      await db.collection("orders")
        .where(
          "motoboyId",
          "==",
          usuarioAtual.uid
        )
        .get();

    const lista =
      document.getElementById(
        "listaAceitasMotoboy"
      );

    if(lista){

      if(minhas.empty){

        lista.innerHTML =
          '<div class="item">Nenhuma entrega aceita.</div>';

      }else{

        let html = "";

        minhas.forEach(doc => {

          const p = doc.data();

          html += `
            <div class="item">

              <strong>Cliente:</strong>
              ${p.clienteNome || "-"}<br>

              <strong>Endereço:</strong>
              ${p.enderecoEntrega || "-"}<br>

              <strong>Status:</strong>
              ${p.status || "-"}

              <br>

              <input
                id="codigo_${doc.id}"
                maxlength="4"
                inputmode="numeric"
                placeholder="Código de 4 dígitos"
              >

              <button
                class="btn-azul"
                onclick="finalizarPedido('${doc.id}')"
              >
                FINALIZAR
              </button>

            </div>
          `;
        });

        lista.innerHTML = html;
      }
    }

  }catch(error){

    console.error(error);

    const div =
      document.getElementById(
        "listaPedidosMotoboy"
      );

    if(div){

      div.innerHTML =
        '<div class="item">Erro ao carregar entregas.</div>';
    }
  }
}


/* =========================================================
   ACEITAR PEDIDO
========================================================= */

async function aceitarPedido(orderId){

  if(!usuarioAtual) return;

  try{

    const ref =
      db.collection("orders")
        .doc(orderId);

    await db.runTransaction(async transaction => {

      const snap =
        await transaction.get(ref);

      if(!snap.exists){

        throw new Error(
          "Pedido não encontrado."
        );
      }

      const pedido = snap.data();

      if(pedido.status !== "pendente"){

        throw new Error(
          "Esta entrega já foi aceita por outro motorista."
        );
      }

      transaction.update(ref, {

        motoboyId:
          usuarioAtual.uid,

        status:
          "em_rota",

        aceitoEm:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });

    });

    alert(
      "Entrega aceita com sucesso!"
    );

    await carregarMotoboy();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      erroHumano(error)
    );
  }
}


/* =========================================================
   FINALIZAR PEDIDO
========================================================= */

async function finalizarPedido(orderId){

  if(!usuarioAtual) return;

  const campo =
    document.getElementById(
      "codigo_" + orderId
    );

  if(!campo) return;

  const codigo =
    campo.value.trim();

  if(!/^\d{4}$/.test(codigo)){

    alert(
      "Digite o código de 4 dígitos."
    );

    return;
  }

  try{

    const ref =
      db.collection("orders")
        .doc(orderId);

    const snap =
      await ref.get();

    if(!snap.exists){

      alert(
        "Entrega não encontrada."
      );

      return;
    }

    const pedido =
      snap.data();

    if(pedido.motoboyId !== usuarioAtual.uid){

      alert(
        "Esta entrega não pertence a você."
      );

      return;
    }

    if(String(pedido.codigo4Digitos) !== codigo){

      alert(
        "Código incorreto."
      );

      return;
    }

    await ref.update({

      status:
        "finalizado",

      finalizadoEm:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

    alert(
      "Entrega finalizada!"
    );

    await carregarMotoboy();

  }catch(error){

    console.error(error);

    alert(
      "Erro ao finalizar:\n" +
      erroHumano(error)
    );
  }
}

      new Date();

      limite.getDate() - 90
    );

      await db.collection("transactions")
        .where(
          "uid",
          "==",
          usuarioAtual.uid
        )
        .get();

    snap.forEach(doc => {

      let data = null;

      if(t.criadoEm && t.criadoEm.toDate){

        data =
          t.criadoEm.toDate();

      if(!data || data >= limite){

        lista.push({
          id: doc.id,
          ...t,
          data: data
        });

    lista.sort((a,b) => {

      const da =

      const dbb =
        b.data ? b.data.getTime() : 0;

    });

    if(lista.length === 0){

      div.innerHTML =
        '<div class="item">Nenhum movimento nos últimos 90 dias.</div>';

      return;
    }

    let html =

      "<th>Data</th>" +
      "<th>Tipo</th>" +
      "<th>Valor</th>" +
      "<th>Status</th>" +
      "</tr>";

    lista.forEach(t => {

      const data =
        t.data
          ? t.data.toLocaleDateString("pt-BR")
          : "-";

      html += `
        <tr>
          <td>${data}</td>
          <td>${t.tipo || "-"}</td>
          <td>
            R$ ${Number(t.valor || 0)
              .toFixed(2)
              .replace(".", ",")}
          </td>
          <td>${t.status || "-"}</td>
        </tr>
      `;
    });

    html += "</table>";

    div.innerHTML = html;

  }catch(error){

    console.error(error);

    div.innerHTML =
      '<div class="item">Erro ao carregar extrato.</div>';
  }
}

/* =========================================================
   ADMIN
========================================================= */

async function carregarAdmin(){

  if(!usuarioAtual) return;

  try{

    const perfil =
      await db.collection("profiles")
        .doc(usuarioAtual.uid)
        .get();

    if(
      !perfil.exists ||
      String(perfil.data().tipo || "")
        .toLowerCase() !== "admin"
    ){

      alert(
        "Acesso administrativo não autorizado."
      );

      await auth.signOut();

      return;
    }


    /* =========================
       TRANSAÇÕES
    ========================== */

    const transSnap =
      await db.collection("transactions")
        .get();

    let receitas = 0;
    let pagamentos = 0;

    let pendentes = [];

    transSnap.forEach(doc => {

      const t = doc.data();

      if(t.status === "aprovado"){

        if(
          t.tipo === "recarga_50" ||
          t.tipo === "recarga"
        ){

          receitas +=
            Number(t.valor || 0);
        }

        if(
          t.tipo === "pagamento_motoboy"
        ){

          pagamentos +=
            Number(t.valor || 0);
        }
      }

      if(
        t.tipo === "recarga_50" &&
        t.status === "pendente"
      ){

        pendentes.push({
          id: doc.id,
          ...t
        });
      }

    });

    const lucro =
      receitas - pagamentos;

    document.getElementById(
      "adminReceitas"
    ).textContent =
      receitas.toFixed(2)
        .replace(".", ",");

    document.getElementById(
      "adminPagamentos"
    ).textContent =
      pagamentos.toFixed(2)
        .replace(".", ",");

    document.getElementById(
      "adminLucro"
    ).textContent =
      lucro.toFixed(2)
        .replace(".", ",");


    /* =========================
       RECARGAS
    ========================== */

    const recDiv =
      document.getElementById(
        "adminRecargas"
      );

    if(pendentes.length === 0){

      recDiv.innerHTML =
        '<div class="item">Nenhuma recarga pendente.</div>';

    }else{

      let html = "";

      pendentes.forEach(t => {

        html += `
          <div class="item">

            <strong>Usuário:</strong>
            ${t.uid}<br>

            <strong>Valor:</strong>
            R$ ${Number(t.valor || 0)
              .toFixed(2)
              .replace(".", ",")}

            <button
              class="btn-verde"
              onclick="aprovarRecarga('${t.id}','${t.uid}',${Number(t.valor || 0)})"
            >
              APROVAR RECARGA
            </button>

          </div>
        `;
      });

      recDiv.innerHTML = html;
    }


    /* =========================
       USUÁRIOS
    ========================== */

    const usersSnap =
      await db.collection("profiles")
        .get();

    const usersDiv =
      document.getElementById(
        "adminUsuarios"
      );

    if(usersSnap.empty){

      usersDiv.innerHTML =
        '<div class="item">Nenhum usuário.</div>';

    }else{

      let html = "";

      usersSnap.forEach(doc => {

        const u = doc.data();

        html += `
          <div class="item">

            <strong>Nome:</strong>
            ${u.nome || "-"}<br>

            <strong>E-mail:</strong>
            ${u.email || "-"}<br>

            <strong>Telefone:</strong>
            ${u.telefone || "-"}<br>

            <strong>Tipo:</strong>
            ${u.tipo || "-"}<br>

            <strong>UID:</strong>
            ${doc.id}

            <button
              class="btn-azul"
              onclick="editarSaldo('${doc.id}')"
            >
              EDITAR SALDO
            </button>

          </div>
        `;
      });

      usersDiv.innerHTML = html;
    }


    /* =========================
       PEDIDOS
    ========================== */

    const ordersSnap =
      await db.collection("orders")
        .get();

    const ordersDiv =
      document.getElementById(
        "adminPedidos"
      );

    if(ordersSnap.empty){

      ordersDiv.innerHTML =
        '<div class="item">Nenhuma entrega.</div>';

    }else{

      let html = "";

      ordersSnap.forEach(doc => {

        const p = doc.data();

        html += `
          <div class="item">

            <strong>ID:</strong>
            ${doc.id}<br>

            <strong>Loja:</strong>
            ${p.lojistaNome || "-"}<br>

            <strong>Cliente:</strong>
            ${p.clienteNome || "-"}<br>

            <strong>Veículo:</strong>
            ${p.veiculo || "-"}<br>

            <strong>Status:</strong>
            ${p.status || "-"}<br>

            <strong>Motoboy:</strong>
            ${p.motoboyId || "Aguardando"}

          </div>
        `;
      });

      ordersDiv.innerHTML = html;
    }

  }catch(error){

    console.error(
      "Erro ADMIN:",
      error
    );

    alert(
      "Erro ao carregar painel admin:\n" +
      erroHumano(error)
    );
  }
}


/* =========================================================
   APROVAR RECARGA
========================================================= */

async function aprovarRecarga(
  transactionId,
  uid,
  valor
){

  if(!usuarioAtual) return;

  try{

    const walletRef =
      db.collection("wallets")
        .doc(uid);

    const transRef =
      db.collection("transactions")
        .doc(transactionId);

    await db.runTransaction(async transaction => {

      const walletSnap =
        await transaction.get(walletRef);

      const transSnap =
        await transaction.get(transRef);

      if(!transSnap.exists){

        throw new Error(
          "Recarga não encontrada."
        );
      }

      if(
        transSnap.data().status !==
        "pendente"
      ){

        throw new Error(
          "Esta recarga já foi processada."
        );
      }

      if(walletSnap.exists){

        transaction.update(
          walletRef,
          {

            saldo:
              firebase.firestore.FieldValue
                .increment(Number(valor)),

            atualizadoEm:
              firebase.firestore.FieldValue
                .serverTimestamp()

          }
        );

      }else{

        transaction.set(
          walletRef,
          {

            saldo:
              Number(valor),

            atualizadoEm:
              firebase.firestore.FieldValue
                .serverTimestamp()

          }
        );
      }

      transaction.update(
        transRef,
        {

          status:
            "aprovado",

          aprovadoEm:
            firebase.firestore.FieldValue
              .serverTimestamp(),

          aprovadoPor:
            usuarioAtual.uid

        }
      );

    });

    alert(
      "Recarga aprovada."
    );

    await carregarAdmin();

  }catch(error){

    console.error(error);

    alert(
      "Erro ao aprovar recarga:\n" +
      erroHumano(error)
    );
  }
}


/* =========================================================
   EDITAR SALDO
========================================================= */

async function editarSaldo(uid){

  if(!usuarioAtual) return;

  const novo =
    prompt(
      "Digite o novo saldo para este usuário:"
    );

  if(novo === null) return;

  const valor =
    Number(
      novo.replace(",", ".")
    );

  if(isNaN(valor)){

    alert(
      "Valor inválido."
    );

    return;
  }

  try{

    await db.collection("wallets")
      .doc(uid)
      .set({

        saldo:
          valor,

        atualizadoEm:
          firebase.firestore.FieldValue
            .serverTimestamp()

      }, {
        merge:true
      });

    alert(
      "Saldo atualizado."
    );

    await carregarAdmin();

  }catch(error){

    console.error(error);

    alert(
      "Erro ao editar saldo:\n" +
      erroHumano(error)
    );
  }
}
