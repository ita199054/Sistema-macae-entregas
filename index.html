<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Entregas Mundial</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen">
<header class="p-4 bg-gray-900 border-b border-gray-800 sticky top-0 z-50 flex justify-between items-center">
  <div>
    <h1 class="font-bold text-xl" data-i18n="title">🪽 Sistema Mundial</h1>
    <p class="text-xs text-gray-400" id="saudacao"></p>
  </div>
  <!-- SELETOR DE IDIOMAS -->
  <select id="idioma" onchange="mudarIdioma(this.value)" class="bg-gray-800 p-2 rounded-xl text-sm border border-gray-700">
    <option value="pt">🇧🇷 PT</option>
    <option value="en">🇺🇸 EN</option>
    <option value="es">🇪🇸 ES</option>
    <option value="fr">🇫🇷 FR</option>
  </select>
</header>

<main class="p-4 pb-24 max-w-md mx-auto space-y-4">
<div class="bg-gray-900 rounded-2xl p-4 border border-gray-800">
  <h2 class="font-bold mb-3" data-i18n="nova">🌍 Nova Entrega Mundial</h2>
  <input id="orderId" class="w-full p-3 rounded-xl bg-gray-800 mb-2 outline-none">
  <input id="endereco" class="w-full p-3 rounded-xl bg-gray-800 mb-2 outline-none">
  <div class="grid grid-cols-2 gap-2 mb-2">
    <input id="cidade" class="p-3 rounded-xl bg-gray-800 outline-none">
    <input id="pais" class="p-3 rounded-xl bg-gray-800 outline-none">
  </div>
  <input id="obs" class="w-full p-3 rounded-xl bg-gray-800 mb-2 outline-none">
  <div class="grid grid-cols-2 gap-2 mb-2">
    <select id="pagamento" class="p-3 rounded-xl bg-gray-800">
      <option value="PAGO" data-i18n="pago">PAGO - PIX</option>
      <option value="DINHEIRO" data-i18n="dinheiro">DINHEIRO</option>
      <option value="CARTÃO" data-i18n="cartao">CARTÃO</option>
    </select>
    <input id="troco" class="p-3 rounded-xl bg-gray-800">
  </div>
  <button onclick="gerarEntrega()" class="w-full bg-white text-black font-bold p-3 rounded-xl" data-i18n="gerar">Gerar Mensagem</button>
</div>

<div id="resultado" class="hidden bg-gray-900 rounded-2xl p-4 border border-green-900">
  <pre id="textoFinal" class="whitespace-pre-wrap text-sm bg-black p-3 rounded-xl mb-3"></pre>
  <div class="grid grid-cols-2 gap-2">
    <button onclick="copiar()" class="bg-green-600 p-3 rounded-xl font-bold" data-i18n="copiar"><i class="fa-solid fa-copy"></i> Copiar</button>
    <button onclick="abrirMaps()" class="bg-blue-600 p-3 rounded-xl font-bold" data-i18n="mapa"><i class="fa-solid fa-map"></i> Mapa Local</button>
  </div>
  <button onclick="enviarWhats()" class="w-full mt-2 bg-[#25D366] p-3 rounded-xl font-bold text-black"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
</div>
<div id="lista" class="space-y-2"></div>
</main>

<script>
const traducoes = {
  pt: { title:"🪽 Sistema Mundial", nova:"🌍 Nova Entrega Mundial", orderId:"Nº Pedido", endereco:"Rua, Número, Bairro", cidade:"Cidade / Região", pais:"País / Estado", obs:"Observação", pago:"PAGO - PIX", dinheiro:"DINHEIRO", cartao:"CARTÃO", troco:"Troco p/ R$", gerar:"Gerar Mensagem", copiar:"Copiar", mapa:"Mapa Local" },
  en: { title:"🪽 World System", nova:"🌍 New Worldwide Delivery", orderId:"Order #", endereco:"Street, Number, District", cidade:"City / Region", pais:"Country / State", obs:"Note", pago:"PAID - PIX", dinheiro:"CASH", cartao:"CARD", troco:"Change for $", gerar:"Generate Message", copiar:"Copy", mapa:"Local Map" },
  es: { title:"🪽 Sistema Mundial", nova:"🌍 Nueva Entrega Mundial", orderId:"Nº Pedido", endereco:"Calle, Número, Barrio", cidade:"Ciudad / Región", pais:"País / Estado", obs:"Observación", pago:"PAGADO", dinheiro:"EFECTIVO", cartao:"TARJETA", troco:"Cambio para $", gerar:"Generar Mensaje", copiar:"Copiar", mapa:"Mapa Local" },
  fr: { title:"🪽 Système Mondial", nova:"🌍 Nouvelle Livraison", orderId:"Commande #", endereco:"Rue, Numéro, Quartier", cidade:"Ville / Région", pais:"Pays / État", obs:"Observation", pago:"PAYÉ", dinheiro:"ESPÈCES", cartao:"CARTE", troco:"Monnaie pour €", gerar:"Générer Message", copiar:"Copier", mapa:"Carte Locale" }
};
let lang = 'pt';
let queryMaps = '';

function mudarIdioma(l){
  lang = l;
  localStorage.setItem('lang', l);
  const t = traducoes[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]) el.innerText = el.innerText.includes('🪽') || el.innerText.includes('🌍') ? t[k] : t[k];
  });
  document.getElementById('orderId').placeholder = t.orderId;
  document.getElementById('endereco').placeholder = t.endereco;
  document.getElementById('cidade').placeholder = t.cidade;
  document.getElementById('pais').placeholder = t.pais;
  document.getElementById('obs').placeholder = t.obs;
  document.getElementById('troco').placeholder = t.troco;
  document.getElementById('pagamento').options[0].text = t.pago;
  document.getElementById('pagamento').options[1].text = t.dinheiro;
  document.getElementById('pagamento').options[2].text = t.cartao;
  document.querySelector('[data-i18n="gerar"]').innerText = t.gerar;
  document.querySelector('[data-i18n="copiar"]').innerHTML = `<i class="fa-solid fa-copy"></i> ${t.copiar}`;
  document.querySelector('[data-i18n="mapa"]').innerHTML = `<i class="fa-solid fa-map"></i> ${t.mapa}`;
}

document.getElementById('saudacao').innerText = new Date().toLocaleString(lang,{weekday:'long', hour:'2-digit', minute:'2-digit'}) + ' - Mundial';

function gerarEntrega(){
  const id = document.getElementById('orderId').value || Math.floor(Math.random()*9000+1000);
  const end = document.getElementById('endereco').value;
  const cidade = document.getElementById('cidade').value;
  const pais = document.getElementById('pais').value;
  const obs = document.getElementById('obs').value;
  const pag = document.getElementById('pagamento').value;
  const troco = document.getElementById('troco').value;
  if(!end) return alert('Digite o endereço');
  let enderecoCompleto = end; if(cidade) enderecoCompleto += ', ' + cidade; if(pais) enderecoCompleto += ', ' + pais;
  queryMaps = enderecoCompleto;
  let msg = `[${id}]\n${enderecoCompleto}\n`;
  if(obs) msg+=`OBS: ${obs}\n`;
  msg+=`🗺️ https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoCompleto)}&hl=${lang}\n`;
  msg+=`[${pag}]${troco ? ' troco: '+troco : ''}`;
  document.getElementById('textoFinal').innerText = msg;
  document.getElementById('resultado').classList.remove('hidden');
  const card = `<div class="bg-gray-900 p-3 rounded-xl border border-gray-800 text-sm"><b>#${id}</b> - ${enderecoCompleto}<br><span class="text-gray-400">${cidade||'World'} - ${pag}</span></div>`;
  document.getElementById('lista').innerHTML = card + document.getElementById('lista').innerHTML;
}
function copiar(){ navigator.clipboard.writeText(document.getElementById('textoFinal').innerText); alert('Copiado / Copied!'); }
function abrirMaps(){ window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryMaps)}&hl=${lang}`,'_blank'); }
function enviarWhats(){ window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('textoFinal').innerText)}`,'_blank'); }

// carrega idioma salvo
const saved = localStorage.getItem('lang') || 'pt';
document.getElementById('idioma').value = saved;
mudarIdioma(saved);
</script>
</body>
</html>
