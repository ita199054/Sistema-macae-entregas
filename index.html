<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANJOS EM DUAS RODAS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<style>*{box-sizing:border-box;font-family:Inter,Arial}body{margin:0;background:#0f0f0f;color:white}.top{height:68px;background:#111;display:flex;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.container{max-width:430px;margin:0 auto;padding:16px}.card{background:#1a1a1a;border-radius:20px;padding:20px;margin-bottom:14px;border:1px solid #2a2a2a}.cardLight{background:#fff;color:#111;border-radius:20px;padding:20px;margin-bottom:14px}input,select{width:100%;background:#262626;border:1px solid #333;color:white;padding:14px;border-radius:14px;margin:6px 0}button{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer}.btnPrimary{background:linear-gradient(90deg,#ff7a00,#ff9d00);color:#111}.btnGhost{background:#2a2a2a;color:white}.badge{background:#ff7a001a;color:#ff7a00;border:1px solid #ff7a0033;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800}#mapLojista,#mapMoto,#mapAdmin,#mapLojistaSuper{height:280px;border-radius:16px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #333;padding:12px 18px;border-radius:12px;display:none;z-index:99}</style>
</head>
<body>
<div class="top"><div style="font-size:24px">🏍️</div><b><span style="color:white">ANJOS</span> <span style="color:#ff7a00">EM DUAS RODAS</span></b></div>
<div class="container">
<div id="authDiv"><div style="text-align:center;padding:20px 0"><div style="font-size:44px">🏍️</div><div style="font-weight:900;font-size:28px"><span style="color:white">ANJOS</span><br><span style="color:#ff7a00">EM DUAS RODAS</span></div></div><div class="card"><h3 style="margin:0">Entrar</h3><input id="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button class="btnPrimary" onclick="login()" style="margin-top:8px">ENTRAR</button><div id="msgAuth" style="color:#ff5555;font-size:12px;text-align:center;margin-top:6px"></div></div></div>
<div id="appDiv" style="display:none">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div id="infoUser" style="font-weight:700"></div><div style="font-size:12px;color:#777">Saldo <b id="saldoTxt" style="color:#ff7a00"></b> | <span id="tipoTxt" style="color:#ff7a00;font-weight:900"></span></div></div><button class="btnGhost" style="width:auto" onclick="logout()">Sair</button></div>

<div id="painelLojista" style="display:none"><div class="cardLight"><b>LOJISTA</b> - Saldo <span id="saldoLojista"></span><button class="btnPrimary" onclick="criarPedido()">CRIAR PEDIDO TESTE R$10</button></div><div id="mapLojista"></div><div id="listaLojista"></div></div>

<div id="painelSuperLojista" style="display:none"><div class="cardLight"><b>SUPER LOJISTA - TUDO JUNTO</b></div></div>

<div id="painelMotoboy" style="display:none"><div class="card"><b>MOTOBOY</b> <span id="meuCodigoMoto"></span><div id="statusMoto"></div><button id="btnOnline" class="btnPrimary" onclick="alternarOnline()">FICAR ONLINE</button></div><div id="mapMoto"></div><div id="listaPedidosMoto"></div></div>

<div id="painelAdmin" style="display:none">
<div class="cardLight"><b>ADMIN - Super@macae.com</b><div>Rec <b id="adminReceitas"></b> | Lucro <b id="adminLucro"></b></div><div style="font-size:10px">Você é: <b id="adminTipo"></b></div></div>
<div class="card"><button class="btnPrimary" onclick="carregarAdmin()">🔄 ATUALIZAR LISTA DE APROVAÇÃO</button><div id="adminUsuarios" style="margin-top:10px"></div></div>
<div class="card"><b>Recargas pendentes</b><div id="adminRecargas"></div></div>
<div class="card"><div id="mapAdmin" style="height:300px"></div><div id="adminPedidos"></div></div>
</div>
</div></div>
<div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain:"anjos-flash.firebaseapp.com",projectId:"anjos-flash",storageBucket:"anjos-flash.firebasestorage.app",messagingSenderId:"725133182752",appId:"1:725133182752:web:5f9a98fa97269dcdcab945",measurementId:"G-9CSJXXNR0C"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore(); const auth=firebase.auth();
let usuarioAtual=null,perfilAtual=null,saldoAtual=0,mapaLojista=null,mapaMoto=null,mapAdmin=null;
function toastM(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",3000); }
async function login(){ try{ await auth.signInWithEmailAndPassword(email.value,senha.value);}catch(e){msgAuth.textContent=e.message;}} function logout(){ auth.signOut(); }
auth.onAuthStateChanged(async u=>{
 if(!u){ authDiv.style.display="block"; appDiv.style.display="none"; return; }
 usuarioAtual=u;
 authDiv.style.display="none"; appDiv.style.display="block";
 try{
   let pSnap=await db.collection("profiles").doc(u.uid).get();
   if(!pSnap.exists){
     // cria perfil admin automatico para super@macae.com
     if(u.email.toLowerCase()==="super@macae.com"){
       await db.collection("profiles").doc(u.uid).set({nome:"SUPER ADMIN",email:u.email,tipo:"admin",online:false,criadoEm:firebase.firestore.FieldValue.serverTimestamp()});
       pSnap=await db.collection("profiles").doc(u.uid).get();
     } else {
       infoUser.textContent="Sem perfil no Firestore! Crie no Firebase";
       return;
     }
   }
   perfilAtual=pSnap.data();
   // FORÇA ADMIN SE EMAIL FOR SUPER
   if(u.email.toLowerCase()==="super@macae.com" && perfilAtual.tipo!=="admin"){
     await db.collection("profiles").doc(u.uid).update({tipo:"admin"});
     perfilAtual.tipo="admin";
   }
   infoUser.textContent=perfilAtual.nome+" ("+u.email+")";
   tipoTxt.textContent=perfilAtual.tipo.toUpperCase();
   const w=await db.collection("wallets").doc(u.uid).get();
   saldoAtual=w.exists?Number(w.data().saldo):0;
   saldoTxt.textContent="R$"+saldoAtual.toFixed(2);
   if(document.getElementById("saldoLojista")) saldoLojista.textContent="R$"+saldoAtual.toFixed(2);

   // ESCONDE TUDO E MOSTRA SO O CORRETO
   painelLojista.style.display="none"; painelSuperLojista.style.display="none"; painelMotoboy.style.display="none"; painelAdmin.style.display="none";
   if(perfilAtual.tipo==="lojista") painelLojista.style.display="block";
   if(perfilAtual.tipo==="super_lojista") painelSuperLojista.style.display="block";
   if(perfilAtual.tipo==="motoboy") { painelMotoboy.style.display="block"; carregarMotoboy(); }
   if(perfilAtual.tipo==="admin" || perfilAtual.tipo==="franqueado" || u.email.toLowerCase()==="super@macae.com"){
     painelAdmin.style.display="block"; 
     document.getElementById("adminTipo").textContent=perfilAtual.tipo;
     carregarAdmin();
   }
 }catch(e){ alert("Erro ao carregar perfil: "+e.message); console.log(e); }
});

async function criarPedido(){ toastM("Teste - pedido criado"); }
async function carregarMotoboy(){ meuCodigoMoto.textContent=perfilAtual.codigoMoto||""; statusMoto.textContent=perfilAtual.docStatus||"aprovado"; if(!mapaMoto){ mapaMoto=L.map('mapMoto').setView([-22.37,-41.78],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapaMoto);} db.collection("orders").where("status","==","pendente").onSnapshot(s=>{ let h=""; s.forEach(doc=>{ h+=`<div class="card">${doc.data().clienteNome||"Pedido"}</div>`}); listaPedidosMoto.innerHTML=h; });}
async function alternarOnline(){ await db.collection("profiles").doc(usuarioAtual.uid).update({online:!perfilAtual.online}); perfilAtual.online=!perfilAtual.online; toastM(perfilAtual.online?"Online":"Offline");}
async function carregarAdmin(){
 if(!mapAdmin){ mapAdmin=L.map('mapAdmin').setView([-22.37,-41.78],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapAdmin); }
 const us=await db.collection("profiles").where("docStatus","==","pendente").get();
 let uh=""; us.forEach(doc=>{ const u=doc.data(); uh+=`<div class="card" style="border:1px solid #ff7a00"><b>${u.nome} ${u.codigoMoto||""}</b> ${u.tipoVeiculo||""}<br>${u.telefone||""}<br><button class="btnPrimary" onclick="aprovarDoc('${doc.id}')">✅ APROVAR</button> <button class="btnGhost" style="background:red" onclick="reprovarDoc('${doc.id}')">❌ REPROVAR</button></div>`; });
 adminUsuarios.innerHTML=uh||"<div style='color:#777'>Nenhum motoboy pendente</div>";
 const tx=await db.collection("transactions").where("status","==","pendente").get();
 let rh=""; tx.forEach(d=>{ rh+=`<div class="card">${d.data().uid} R$${d.data().valor} <button class="btnPrimary" onclick="aprovarRecarga('${d.id}')">APROVAR R$50</button></div>`; });
 adminRecargas.innerHTML=rh||"Nenhuma";
 adminReceitas.textContent=tx.size;
}
async function aprovarDoc(uid){ await db.collection("profiles").doc(uid).update({docStatus:"aprovado"}); toastM("Aprovado!"); carregarAdmin(); }
async function reprovarDoc(uid){ await db.collection("profiles").doc(uid).update({docStatus:"reprovado"}); carregarAdmin(); }
async function aprovarRecarga(id){ const r=await db.collection("transactions").doc(id).get(); const wRef=db.collection("wallets").doc(r.data().uid); const w=await wRef.get(); await wRef.set({saldo:Number(w.data()?.saldo||0)+Number(r.data().valor||50)},{merge:true}); await db.collection("transactions").doc(id).update({status:"aprovado"}); toastM("Recarga aprovada"); carregarAdmin(); }
</script>
</body>
</html>
