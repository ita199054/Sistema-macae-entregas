<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Mundial - Seguro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔴 TROQUE AQUI PELA SUA CONFIG DO FIREBASE
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  appId: "SEU_APP_ID"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.auth=auth; window.db=db; window.signInWithEmailAndPassword=signInWithEmailAndPassword; window.createUserWithEmailAndPassword=createUserWithEmailAndPassword; window.onAuthStateChanged=onAuthStateChanged; window.signOut=signOut; window.addDoc=addDoc; window.collection=collection; window.doc=doc; window.setDoc=setDoc;
</script>
</head>
<body class="bg-[#0a0f1e] text-white min-h-screen">

<!-- LOGIN SEGURO -->
<div id="telaLogin" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-[#131a2e] rounded-3xl p-6 w-full max-w-sm border border-[#1e2a4a]">
<h1 class="font-bold text-xl text-center">🪽 Sistema Mundial</h1>
<p class="text-xs text-gray-400 text-center mb-4">Login obrigatório - Seguro</p>

<div class="grid grid-cols-2 gap-2 mb-3 max-h-[200px] overflow-y-auto">
<button onclick="sel('admin')" class="perfil p-2 rounded-xl bg-red-900/30 text-xs border border-red-800"><b>ADMIN</b></button>
<button onclick="sel('franqueado')" class="perfil p-2 rounded-xl bg-purple-900/30 text-xs border border-purple-800"><b>FRANQUEADO</b></button>
<button onclick="sel('suporte')" class="perfil p-2 rounded-xl bg-blue-900/30 text-xs border border-blue-800"><b>SUPORTE</b></button>
<button onclick="sel('superlojista')" class="perfil p-2 rounded-xl bg-yellow-900/30 text-xs border border-yellow-700"><b>SUPER LOJISTA</b></button>
<button onclick="sel('lojista')" class="perfil p-2 rounded-xl bg-[#1a2340] text-xs border border-gray-700"><b>LOJISTA</b></button>
<button onclick="sel('motoboy')" class="perfil p-2 rounded-xl bg-[#1a2340] text-xs border border-gray-700"><b>MOTOBOY</b></button>
<button onclick="sel('motorista')" class="perfil p-2 rounded-xl bg-[#1a2340] text-xs border border-gray-700 col-span-2"><b>MOTORISTA</b></button>
</div>
<p id="perfilSel" class="text-[10px] text-center text-yellow-400 mb-2">Nenhum perfil selecionado</p>

<input id="email" type="email" placeholder="Email" class="w-full p-3 rounded-xl bg-[#1a2340] mb-2 outline-none">
<input id="senha" type="password" placeholder="Senha (min 6 dígitos)" class="w-full p-3 rounded-xl bg-[#1a2340] mb-2 outline-none">
<input id="regiao" placeholder="Sua região / cidade" class="w-full p-3 rounded-xl bg-[#1a2340] mb-3 outline-none">

<div class="grid grid-cols-2 gap-2">
<button onclick="criarConta()" class="bg-gray-700 p-3 rounded-xl font-bold text-sm">Criar Conta</button>
<button onclick="logar()" class="bg-white text-black p-3 rounded-xl font-bold text-sm">Entrar</button>
</div>
<p id="erro" class="text-red-400 text-xs mt-2 hidden text-center"></p>
<p class="text-[10px] text-gray-500 mt-3 text-center">Sem login não entra. Cada perfil só vê o que pode.</p>
</div>
</div>

<!-- SISTEMA LOGADO -->
<div id="telaSistema" class="hidden">
<header class="p-3 bg-[#0a0f1e] border-b border-gray-800 flex justify-between items-center sticky top-0">
<div><b id="hNome"></b><br><span id="hPerfil" class="text-[10px] px-2 py-1 rounded-full bg-white text-black"></span> <span id="hRegiao" class="text-xs text-gray-400"></span></div>
<button onclick="sair()" class="text-xs bg-red-900/40 px-3 py-1 rounded-full border border-red-800">Sair</button>
</header>
<main class="p-4 max-w-md mx-auto space-y-3">
<div id="avisoSeg" class="p-3 rounded-xl text-xs"></div>

<!-- FORM MUNDIAL -->
<div id="areaForm" class="bg-[#131a2e] rounded-3xl p-5 border border-[#1e2a4a]">
<h2 class="font-bold mb-3">🌍 Nova Entrega Mundial</h2>
<input id="pedido" placeholder="Nº Pedido" class="w-full p-4 rounded-2xl bg-[#1a2340] mb-2">
<input id="rua" placeholder="Rua, Número, Bairro" class="w-full p-4 rounded-2xl bg-[#1a2340] mb-2">
<div class="grid grid-cols-2 gap-2 mb-2"><input id="cidade" placeholder="Cidade / Região" class="p-4 rounded-2xl bg-[#1a2340]"><input id="pais" placeholder="País / Estado" class="p-4 rounded-2xl bg-[#1a2340]"></div>
<input id="obs" placeholder="Observação" class="w-full p-4 rounded-2xl bg-[#1a2340] mb-2">
<div class="grid grid-cols-2 gap-2 mb-3"><select id="pag" class="p-4 rounded-2xl bg-[#1a2340]"><option>PAGO - PIX</option><option>DINHEIRO</option><option>CARTÃO</option></select><input id="troco" placeholder="Troco p/ R$" class="p-4 rounded-2xl bg-[#1a2340]"></div>
<button onclick="gerar()" class="w-full bg-white text-black font-bold p-4 rounded-2xl">Gerar Mensagem</button>
<div id="res" class="hidden mt-4 bg-black p-4 rounded-2xl"><pre id="txt" class="whitespace-pre-wrap text-sm"></pre><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="copiar()" class="bg-green-600 p-3 rounded-xl">Copiar</button><button onclick="mapa()" class="bg-blue-600 p-3 rounded-xl">Mapa</button></div><button onclick="zap()" class="w-full mt-2 bg-[#25D366] text-black p-3 rounded-xl font-bold">WhatsApp</button></div>
</div>
<div id="lista" class="space-y-2"></div>
</main>
</div>

<script>
let perfilSel=null, qMap='', lang='pt';
function sel(p){perfilSel=p; document.getElementById('perfilSel').innerText='Perfil: '+p.toUpperCase(); document.querySelectorAll('.perfil').forEach(b=>b.classList.remove('border-white')); event.currentTarget.classList.add('border-white');}

async function criarConta(){
  const email=document.getElementById('email').value, senha=document.getElementById('senha').value, regiao=document.getElementById('regiao').value;
  if(!perfilSel) return erro('Selecione o cargo: admin, franqueado, suporte, super lojista, etc');
  if(!email||!senha) return erro('Digite email e senha');
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, senha);
    await setDoc(doc(db, "usuarios", cred.user.uid), {email, perfil: perfilSel, regiao, criado: new Date()});
    alert('Conta criada! Agora clique em Entrar');
  }catch(e){ erro(e.message); }
}
async function logar(){
  const email=document.getElementById('email').value, senha=document.getElementById('senha').value;
  try{ await signInWithEmailAndPassword(auth, email, senha); }catch(e){ erro('Erro login: '+e.message); }
}
function erro(t){ const e=document.getElementById('erro'); e.innerText=t; e.classList.remove('hidden'); }

onAuthStateChanged(auth, async (user)=>{
  if(user){
    document.getElementById('telaLogin').classList.add('hidden');
    document.getElementById('telaSistema').classList.remove('hidden');
    const perfil = localStorage.getItem('perfilTemp') || perfilSel || 'lojista';
    const regiao = document.getElementById('regiao').value || localStorage.getItem('regiao') || '';
    document.getElementById('hNome').innerText=user.email;
    document.getElementById('hPerfil').innerText=perfil.toUpperCase();
    document.getElementById('hRegiao').innerText=regiao;
    // Avisos por cargo
    let aviso='';
    if(perfil==='admin') aviso='<div class="bg-red-900/20 border border-red-800 p-3 rounded-xl">👑 ADMIN: Acesso total mundial</div>';
    else if(perfil==='franqueado') aviso=`<div class="bg-purple-900/20 border border-purple-800 p-3 rounded-xl">🏢 FRANQUEADO ${regiao}: Vê só sua região</div>`;
    else if(perfil==='suporte') aviso='<div class="bg-blue-900/20 border border-blue-800 p-3 rounded-xl">🎧 SUPORTE: Pode ver tickets</div>';
    else if(perfil==='superlojista') aviso='<div class="bg-yellow-900/20 border border-yellow-800 p-3 rounded-xl">⭐ SUPER LOJISTA: Várias lojas</div>';
    else aviso=`<div class="bg-[#1a2340] p-3 rounded-xl">${perfil.toUpperCase()} - Região: ${regiao||'Mundial'}</div>`;
    document.getElementById('avisoSeg').innerHTML=aviso;
  } else {
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('telaSistema').classList.add('hidden');
  }
});

function sair(){ signOut(auth); localStorage.clear(); location.reload(); }
function gerar(){
  const id=document.getElementById('pedido').value||Math.floor(Math.random()*9000+1000), rua=document.getElementById('rua').value, cid=document.getElementById('cidade').value, pais=document.getElementById('pais').value;
  if(!rua) return alert('Rua');
  let comp=rua; if(cid) comp+=', '+cid; if(pais) comp+=', '+pais; qMap=comp;
  let m=`[${id}]\n${comp}\n${document.getElementById('obs').value?'OBS: '+document.getElementById('obs').value+'\n':''}🗺️ https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(comp)}&hl=${lang}\n[${document.getElementById('pag').value}]`;
  document.getElementById('txt').innerText=m; document.getElementById('res').classList.remove('hidden');
  // salva seguro no Firebase
  addDoc(collection(db, "entregas"), {id, comp, por: auth.currentUser.email, perfil: document.getElementById('hPerfil').innerText, data: new Date()});
}
function copiar(){navigator.clipboard.writeText(document.getElementById('txt').innerText);}
function mapa(){window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(qMap)}`,'_blank');}
function zap(){window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('txt').innerText)}`,'_blank');}

// salva perfil temporário antes do login
const origSel = window.sel;
window.sel = function(p){ perfilSel=p; localStorage.setItem('perfilTemp', p); localStorage.setItem('regiao', document.getElementById('regiao').value); origSel(p); };
</script>
</body>
</html>
