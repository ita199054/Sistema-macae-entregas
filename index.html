<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anjos Flash</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:Arial;max-width:400px;margin:auto;padding:15px}button{padding:14px;width:100%;border:0;border-radius:10px;margin-top:8px;font-weight:bold} .card{border:2px solid #000;padding:10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between}</style>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBT0GOP33aXXyMTE8xLGdu3iv98WmgGN44",authDomain:"anjos-flash.firebaseapp.com",projectId:"anjos-flash",storageBucket:"anjos-flash.firebasestorage.app",messagingSenderId:"725133182752",appId:"1:725133182752:web:5f9a98fa97269dcdcab945"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let tela="inicio",add=10,lojistas=[],motoboys=[];
function render(){
 let h="";
 if(tela==="inicio"){
  h=`<div style="background:#000;color:#FFD700;padding:20px;border-radius:12px;text-align:center;font-weight:bold;font-size:22px">⚡ ANJOS FLASH</div>
  <button onclick="tela='lojista';render()" style="background:#000;color:#FFD700;margin-top:20px">🏪 LOJISTA</button>
  <button onclick="tela='motoboy';render()" style="background:#333;color:#fff">🏍️ MOTOBOY</button>
  <button onclick="tela='admin';render()" style="background:#FFD700;color:#000">👑 ADMIN ADD/ZERA</button>`;
 }else if(tela==="admin"){
  h=`<button onclick="tela='inicio';render()" style="width:auto">← Voltar</button><h2>👑 ADMIN</h2>Valor: <input type="number" value="${add}" onchange="add=this.value" style="width:80px;padding:8px"><h3>🏪 LOJISTAS</h3>`;
  lojistas.forEach(l=>{h+=`<div class="card"><div><b>${l.nome||l.id}</b><br>R$ ${(l.saldo||0).toFixed(2)}</div><div><button onclick="addSaldo('lojistas','${l.id}',${add})" style="background:green;color:#fff;padding:8px">+${add}</button><button onclick="zerar('lojistas','${l.id}')" style="background:red;color:#fff;padding:8px;margin-top:4px">ZERAR</button></div></div>`});
  h+=`<h3>🏍️ MOTOBOYS</h3>`;
  motoboys.forEach(m=>{h+=`<div class="card" style="border-color:#FFD700"><div><b>${m.nome||m.id}</b><br>R$ ${(m.saldo||0).toFixed(2)}</div><div><button onclick="addSaldo('motoboys','${m.id}',${add})" style="background:green;color:#fff;padding:8px">+${add}</button><button onclick="zerar('motoboys','${m.id}')" style="background:#000;color:#FFD700;padding:8px;margin-top:4px">ZERAR</button></div></div>`});
  if(lojistas.length==0) h+=`<button onclick="criarTeste()" style="background:#000;color:#FFD700">Criar loja/moto teste</button>`;
 }else if(tela==="lojista"){
  h=`<button onclick="tela='inicio';render()" style="width:auto">← Voltar</button><h3>🏪 Lojista - Valor travado</h3><input id="end" placeholder="Endereço" style="width:100%;padding:12px"><input id="km" type="number" value="3" style="width:100%;padding:12px;margin-top:8px"><button onclick="criar()" style="background:#000;color:#FFD700;margin-top:10px">CRIAR</button>`;
 }else{
  h=`<button onclick="tela='inicio';render()" style="width:auto">← Voltar</button><h3>🏍️ Motoboy</h3><p>Valor travado - só pega</p>`;
 }
 document.getElementById("app").innerHTML=h;
}
async function addSaldo(c,i,v){await db.collection(c).doc(i).update({saldo:firebase.firestore.FieldValue.increment(Number(v))});}
async function zerar(c,i){if(confirm("Zerar?")) await db.collection(c).doc(i).update({saldo:0});}
async function criar(){let e=document.getElementById("end").value,k=document.getElementById("km").value;if(!e) return alert("Endereço");await db.collection("entregas").add({endereco:e,km:Number(k),status:"pendente"});alert("Criado");}
async function criarTeste(){await db.collection("lojistas").add({nome:"Loja Macaé",saldo:0});await db.collection("motoboys").add({nome:"Moto Teste",saldo:0});}
db.collection("lojistas").onSnapshot(s=>{lojistas=s.docs.map(d=>({id:d.id,...d.data()}));if(tela==="admin") render();});
db.collection("motoboys").onSnapshot(s=>{motoboys=s.docs.map(d=>({id:d.id,...d.data()}));if(tela==="admin") render();});
render();
</script>
</body>
</html>
