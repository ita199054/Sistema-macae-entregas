<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Mundial - Anjos Flash V6</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#000}</style>
</head>
<body class="text-white min-h-screen">

<!-- LOGIN COM SENHA -->
<div id="telaLogin" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-[#111] border-2 border-yellow-400 rounded-2xl p-6 w-full max-w-sm">
<h1 class="font-black text-center text-yellow-400 text-xl">🪽 ANJOS FLASH V6</h1>
<p class="text-xs text-center text-gray-400 mb-4">Login Obrigatório - Mundial</p>

<div class="grid grid-cols-2 gap-2 mb-3">
<button onclick="setCargo('admin')" class="cargoBtn p-3 rounded-xl bg-red-900/40 border border-zinc-700 text-xs font-bold">👑 ADMIN</button>
<button onclick="setCargo('franqueado')" class="cargoBtn p-3 rounded-xl bg-purple-900/30 border border-zinc-700 text-xs font-bold">🏢 FRANQUEADO</button>
<button onclick="setCargo('suporte')" class="cargoBtn p-3 rounded-xl bg-blue-900/30 border border-zinc-700 text-xs font-bold">🎧 SUPORTE</button>
<button onclick="setCargo('superlojista')" class="cargoBtn p-3 rounded-xl bg-yellow-900/30 border border-zinc-700 text-xs font-bold">⭐ SUPER LOJISTA</button>
<button onclick="setCargo('lojista')" class="cargoBtn p-3 rounded-xl bg-zinc-800 border border-zinc-700 text-xs">🏪 LOJISTA</button>
<button onclick="setCargo('motoboy')" class="cargoBtn p-3 rounded-xl bg-zinc-800 border border-zinc-700 text-xs">🏍️ MOTOBOY</button>
<button onclick="setCargo('motorista')" class="cargoBtn p-3 rounded-xl bg-zinc-800 border border-zinc-700 text-xs col-span-2">🚛 MOTORISTA - MOTO/CARRO/CAMINHÃO</button>
</div>

<p id="cargoSel" class="text-center text-yellow-400 text-xs font-bold mb-3 animate-pulse">👆 SELECIONE SEU CARGO ACIMA</p>

<input id="inpEmail" type="email" placeholder="Seu email" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-2 outline-none">
<input id="inpSenha" type="password" placeholder="Sua senha (6+ dígitos)" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-2 outline-none">
<input id="inpRegiao" type="text" placeholder="Sua região - ex: Macaé" value="Macaé" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-3 outline-none">

<button onclick="fazerCadastro()" class="w-full bg-zinc-800 border border-zinc-600 p-3.5 rounded-xl font-bold text-sm mb-2">📝 CRIAR CADASTRO</button>
<button onclick="fazerLogin()" class="w-full bg-yellow-400 text-black p-4 rounded-xl font-black text-lg">🔓 ENTRAR COM SENHA</button>

<p id="msgErro" class="hidden text-xs text-center mt-3 p-2 bg-red-900/50 border border-red-600 rounded"></p>

<p class="text-[10px] text-center text-gray-500 mt-3">Primeiro acesso? Clique em CRIAR CADASTRO<br>Teste ADMIN: super@macar.com / 123456</p>
</div>
</div>

<!-- SISTEMA -->
<div id="telaSistema" class="hidden">
<div class="bg-yellow-400 text-black p-3 flex justify-between items-center sticky top-0 z-50">
<div><b id="logNome" class="font-black text-sm"></b><br><span id="logPerfil" class="text-[11px] bg-black text-yellow-400 px-2 py-1 rounded-full font-bold"></span></div>
<button onclick="sair()" class="bg-black text-yellow-400 px-4 py-2 rounded-full font-black text-xs">SAIR</button>
</div>

<div class="p-4 max-w-md mx-auto space-y-4">

<div id="boxAdmin" class="hidden bg-[#111] border-2 border-yellow-400 p-4 rounded-xl">
<h2 class="font-black text-yellow-400">PAINEL ADMIN - VÊ TUDO</h2>
<div class="grid grid-cols-3 gap-2 mt-3 text-center">
<div class="bg-black p-3 rounded-xl border border-zinc-800"><b id="totalU" class="text-xl">0</b><br><span class="text-[10px] text-gray-400">Usuários</span></div>
<div class="bg-black p-3 rounded-xl border border-zinc-800"><b id="totalE" class="text-xl">0</b><br><span class="text-[10px] text-gray-400">Entregas</span></div>
<div class="bg-black p-3 rounded-xl border border-yellow-400"><b class="text-sm">LAYOUT<br>3</b><br><span class="text-[9px]">Amarelo/Preto</span></div>
</div>
<div id="listaUsuarios" class="mt-3 space-y-1 max-h-60 overflow-auto"></div>
<button onclick="atualizarAdmin()" class="w-full mt-3 bg-yellow-400 text-black p-2 rounded font-black text-xs">ATUALIZAR DADOS</button>
</div>

<div class="bg-[#111] border border-zinc-800 p-5 rounded-2xl">
<h2 class="font-bold mb-3 flex items-center gap-2">🌍 Nova Entrega Mundial</h2>
<input id="nPedido" placeholder="Nº Pedido" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-2 outline-none">
<input id="rua" placeholder="Rua, Número, Bairro" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-2 outline-none">
<div class="grid grid-cols-2 gap-2 mb-2">
<input id="cidade" placeholder="Cidade / Região" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 outline-none">
<input id="pais" placeholder="País / Estado" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 outline-none">
</div>
<input id="obs" placeholder="Observação" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 mb-2 outline-none">
<div class="grid grid-cols-2 gap-2 mb-3">
<select id="pag" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700"><option>PAGO - PIX</option><option>PAGO - DINHEIRO</option><option>PAGO - CARTÃO</option><option>A PAGAR</option></select>
<input id="troco" placeholder="Troco p/ R$" class="w-full p-3.5 rounded-xl bg-black border border-zinc-700 outline-none">
</div>
<button onclick="gerarMsg()" class="w-full bg-white text-black p-4 rounded-xl font-black">GERAR MENSAGEM</button>
<div id="boxMsg" class="hidden mt-3 bg-black p-3 rounded-xl border border-green-600"><pre id="txtMsg" class="whitespace-pre-wrap text-sm"></pre><button onclick="copiar()" class="w-full mt-2 bg-green-600 p-2 rounded font-bold text-sm">COPIAR MENSAGEM</button></div>
</div>

</div>
</div>

<script>
let cargoSel = null;
function setCargo(c){
  cargoSel=c; localStorage.setItem('cargoSel',c);
  document.getElementById('cargoSel').innerText='✓ '+c.toUpperCase()+' SELECIONADO';
  document.querySelectorAll('.cargoBtn').forEach(b=>{b.style.borderColor='#3f3f46';b.style.opacity='0.6'});
  event.currentTarget.style.borderColor='#facc15';event.currentTarget.style.opacity='1';event.currentTarget.style.borderWidth='2px';
}
function mostrarErro(t){let m=document.getElementById('msgErro');m.innerText='⚠️ '+t;m.classList.remove('hidden');}
function fazerCadastro(){
  const email=document.getElementById('inpEmail').value.trim();
  const senha=document.getElementById('inpSenha').value.trim();
  const regiao=document.getElementById('inpRegiao').value.trim()||'Mundial';
  if(!cargoSel) return mostrarErro('Selecione um cargo em cima!');
  if(!email.includes('@')) return mostrarErro('Digite um email válido!');
  if(senha.length<6) return mostrarErro('Senha precisa ter 6 dígitos ou mais!');
  let users=JSON.parse(localStorage.getItem('usuariosDB')||'[]');
  if(users.find(u=>u.email===email)) return mostrarErro('Email já cadastrado! Clique em ENTRAR COM SENHA');
  users.push({email,senha,perfil:cargoSel,regiao,criado:new Date().toLocaleString()});
  localStorage.setItem('usuariosDB',JSON.stringify(users));
  alert('✅ CADASTRO CRIADO!\nEmail: '+email+'\nAgora clique em ENTRAR COM SENHA');
  document.getElementById('msgErro').classList.add('hidden');
}
function fazerLogin(){
  const email=document.getElementById('inpEmail').value.trim();
  const senha=document.getElementById('inpSenha').value.trim();
  if(!cargoSel) return mostrarErro('Selecione o cargo!');
  if(!email ||!senha) return mostrarErro('Digite email e senha!');
  let users=JSON.parse(localStorage.getItem('usuariosDB')||'[]');
  // Admin mestre para teste
  if(email==='super@macar.com' && senha==='123456'){ users.push({email,senha,perfil:'admin',regiao:'Mundial'}); localStorage.setItem('usuariosDB',JSON.stringify(users)); }
  let u=users.find(x=>x.email===email && x.senha===senha);
  if(!u) return mostrarErro('Email ou senha errada! Se é primeiro acesso, clique em CRIAR CADASTRO');
  if(u.perfil!==cargoSel) return mostrarErro('Esse email foi cadastrado como '+u.perfil.toUpperCase()+'. Selecione '+u.perfil.toUpperCase()+' em cima!');
  localStorage.setItem('logado',JSON.stringify(u));
  entrarSistema(u);
}
function entrarSistema(u){
  document.getElementById('telaLogin').classList.add('hidden');
  document.getElementById('telaSistema').classList.remove('hidden');
  document.getElementById('logNome').innerText=u.email;
  document.getElementById('logPerfil').innerText=u.perfil.toUpperCase()+' - '+u.regiao;
  if(u.perfil==='admin'){document.getElementById('boxAdmin').classList.remove('hidden'); atualizarAdmin();}
}
function sair(){localStorage.removeItem('logado');location.reload();}
function atualizarAdmin(){
  let users=JSON.parse(localStorage.getItem('usuariosDB')||'[]');
  document.getElementById('totalU').innerText=users.length;
  document.getElementById('listaUsuarios').innerHTML=users.map(x=>`<div class="bg-black p-2 rounded text-[11px] border border-zinc-800 flex justify-between"><span><b>${x.email}</b><br><span class="text-gray-400">${x.perfil} - ${x.regiao}</span></span><span class="text-[10px] text-gray-600">${x.criado||''}</span></div>`).join('');
}
function gerarMsg(){
  let n=document.getElementById('nPedido').value, r=document.getElementById('rua').value, c=document.getElementById('cidade').value, p=document.getElementById('pais').value, o=document.getElementById('obs').value, pg=document.getElementById('pag').value, tr=document.getElementById('troco').value;
  if(!r) return alert('Digite a rua!');
  let comp=r; if(c) comp+=', '+c; if(p) comp+=', '+p;
  let msg=`[PEDIDO ${n||Math.floor(Math.random()*9000)}]\n📍 ${comp}\n${o?'📝 '+o+'\n':''}💰 ${pg} ${tr?'- Troco p/ '+tr:''}\n🗺️ https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(comp)}`;
  document.getElementById('txtMsg').innerText=msg; document.getElementById('boxMsg').classList.remove('hidden');
}
function copiar(){navigator.clipboard.writeText(document.getElementById('txtMsg').innerText); alert('Copiado!');}
let logado=localStorage.getItem('logado'); if(logado) entrarSistema(JSON.parse(logado));
</script>
</body>
</html>
