<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALDO LOJAS</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="config.js"></script>
<style>body{background:#0A0A0A;color:#fff;font-family:Arial;padding:12px}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:12px;margin:10px auto;max-width:500px} .btn{border:none;padding:10px 14px;border-radius:8px;font-weight:900;cursor:pointer;margin:2px} .g{background:#25D366;color:#fff} .y{background:#D4AF37;color:#000} .r{background:#ff4444;color:#fff} .b{background:#333;color:#fff} .input{background:#222;border:1px solid #D4AF37;color:#fff;padding:10px;border-radius:8px;width:90px}</style>
</head><body>
<h2 style="color:#D4AF37;text-align:center">💰 COLOCAR / TIRAR SALDO</h2>
<div id="lista"></div>
<script>
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

db.collection("usuarios").onSnapshot(s=>{
  let h="";
  s.forEach(doc=>{
    let u=doc.data();
    if(!String(u.tipo||"").toLowerCase().includes("loj")) return;
    let saldo = Number(u.saldo ?? u.caixa ?? 0);
    h+=`<div class="card">
      <b style="font-size:16px">${u.loja||u.nome||doc.id}</b><br>
      <span style="font-size:12px;color:#aaa">ID: ${doc.id} | ${u.endereco||""}</span><br>
      Saldo atual: <b style="color:#D4AF37;font-size:20px">R$${saldo.toFixed(2)}</b><br><br>
      <input id="v-${doc.id}" type="number" class="input" value="10" placeholder="valor">
      <button class="btn g" onclick="add('${doc.id}',1)">+ COLOCAR</button>
      <button class="btn r" onclick="add('${doc.id}',-1)">- TIRAR</button><br><br>
      <input id="s-${doc.id}" type="number" class="input" value="${saldo}" style="width:120px">
      <button class="btn y" onclick="setar('${doc.id}')">SALVAR</button>
      <button class="btn b" onclick="setar('${doc.id}',0)">ZERAR</button>
    </div>`;
  });
  document.getElementById("lista").innerHTML=h||"Nenhuma loja";
});

async function add(id, tipo){
  let v = parseFloat(document.getElementById("v-"+id).value);
  if(isNaN(v)) return alert("Digite o valor");
  if(tipo==-1) v = -Math.abs(v);
  try{
    await db.collection("usuarios").doc(id).update({
      saldo: firebase.firestore.FieldValue.increment(v),
      caixa: firebase.firestore.FieldValue.increment(v)
    });
  }catch(e){ alert(e.message); }
}

async function setar(id, forcar){
  let v = forcar!=null ? forcar : parseFloat(document.getElementById("s-"+id).value);
  if(isNaN(v)) return alert("Digite valor");
  try{
    await db.collection("usuarios").doc(id).update({saldo:v, caixa:v});
    alert("✅ Agora R$"+v.toFixed(2));
  }catch(e){ alert("ERRO: "+e.message); }
}
</script></body></html>
